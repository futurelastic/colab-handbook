# CI heavy lane (Node) — TEMPLATE. Copy me into your repo at .github/workflows/ci-heavy.yml,
# beside ci.yml (copied from ci-node.yml). Guidance, not a dependency:
# you own the copy (CONVENTIONS.md §7).
#
# EDIT POINTS are marked `# EDIT:` — walk them once after copying.
#
# HEAVY LANE (#607): the whole suite, including tests marked heavy, plus anything too slow for
# every merge (integration, browser/e2e, load). The light lane (ci.yml) runs on every push and
# is the only lane `colab ship` reads. This one runs:
#   - NIGHTLY, on trunk's tip. Skipped when trunk has not moved since the last green nightly.
#     A red nightly opens one `trunk-red` issue naming the commit range that could have caused
#     it. It never blocks a merge.
#   - On every OFFICIAL BUILD: release-tag.yml calls this file and publishes only when it is
#     green; release-auto.yml dispatches it at each candidate and finalizes only when it is
#     green at that exact sha.
#   - BY HAND: Actions → "CI (heavy)" → Run workflow, with a ref.
# Heavy is opt-in per test; an unmarked test is light. The marker:
#   a `test:heavy` script in package.json (e.g. over `*.heavy.test.*` files). `npm test`
#   stays light; this lane runs both.
#
# Deliberately NOT triggered by push or pull_request: a run of this workflow must never count as
# a merge verdict (tools/lib/verify-runs.js sets schedule and dispatch runs aside).
# No concurrency block: a heavy run is never cancelled — a release may be waiting on it.

name: CI (heavy)

on:
  schedule:
    - cron: "23 2 * * *" # EDIT: nightly, UTC. Keep the cron in this one place.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or sha to test (empty = trunk's tip)"
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or sha to test"
        type: string
        required: true

permissions: {}

env:
  # EDIT: this repo's trunk (`trunk:` in .github/project.yml). A schedule always starts on the
  # default branch; the nightly tests THIS branch's tip.
  TRUNK: main

jobs:
  # Resolves the one commit this run tests, and decides whether to test it. This job is the one
  # that concludes `success` when the nightly skips: a run whose jobs all skip reads as not-green.
  plan:
    name: What to test
    runs-on: ubuntu-latest # EDIT: needs `gh` (GitHub-hosted images have it).
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      run: ${{ steps.plan.outputs.run }}
      since: ${{ steps.plan.outputs.since }}
    steps:
      - name: Resolve the commit; skip a nightly on an unmoved trunk
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ inputs.ref }}
          REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -uo pipefail
          target="${REF:-$TRUNK}"
          if ! sha="$(gh api "repos/$REPO/commits/$target" --jq .sha)" || [ -z "$sha" ]; then
            echo "::error::cannot resolve '$target' to a commit"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          run=true; since=""
          if [ "$EVENT" = "schedule" ]; then
            # The last green nightly's tested commit, read from its `Full suite @ <sha>` job.
            # Any read error leaves `since` empty, and the suite runs.
            wf="${WORKFLOW_REF%@*}"; wf="${wf##*/}"
            for id in $(gh api "repos/$REPO/actions/workflows/$wf/runs?event=schedule&status=success&per_page=10" \
                          --jq '.workflow_runs[].id' 2>/dev/null); do
              since="$(gh api "repos/$REPO/actions/runs/$id/jobs" \
                --jq '[.jobs[] | select(.conclusion == "success" and (.name | startswith("Full suite @ "))) | .name | ltrimstr("Full suite @ ")][0] // ""' 2>/dev/null || true)"
              [ -z "$since" ] || break
            done
            if [ "$since" = "$sha" ]; then
              run=false
              echo "::notice title=heavy-skipped::$TRUNK has not moved since the last green nightly ($sha)"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "since=$since" >> "$GITHUB_OUTPUT"
          echo "Heavy lane: ${run} at \`$sha\`${since:+ (last green nightly: \`$since\`)}" >> "$GITHUB_STEP_SUMMARY"

  heavy:
    # The tested sha is in the job name: the next nightly reads it back to decide whether trunk moved.
    name: Full suite @ ${{ needs.plan.outputs.sha }}
    needs: plan
    if: ${{ needs.plan.outputs.run == 'true' }}
    runs-on: ubuntu-latest # EDIT: self-hosted label if this repo needs one.
    timeout-minutes: 120 # EDIT: well above YOUR heavy p99; the default is 360.
    permissions:
      contents: read
    defaults:
      run:
        # EDIT: the same directory as ci.yml's build job.
        working-directory: .
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      # Toolchain and install: the same steps as ci.yml's build job, so both lanes resolve the
      # same versions. Keep them in step when you edit either.
      # ---------------------------------------------------------------------------
      # Toolchain resolution. Precedence, highest first:
      #   1. .github/project.yml  ->  node: <version>
      #   2. .nvmrc, else package.json -> engines.node
      #   3. FAIL.
      #
      # There is deliberately NO fallback default. A silent default is exactly how a
      # repo here ended up building on Node 20 in CI while deploying on Node 22 —
      # CI was green and proved nothing about what actually shipped. If the version
      # is not declared anywhere, that is a bug in the repo, and the build says so.
      # ---------------------------------------------------------------------------
      - name: Resolve Node version
        id: toolchain
        if: hashFiles('package.json') != ''
        run: |
          set -euo pipefail

          # Normalise "^22", ">=22.1", "v22", "22.x" -> "22.1" / "22". setup-node
          # accepts a partial version and picks the newest matching release.
          normalise() {
            printf '%s' "$1" \
              | tr -d '"' \
              | sed -E 's/^[^0-9]*//' \
              | sed -E 's/[[:space:]].*$//' \
              | sed -E 's/\.x$//' \
              | sed -E 's/[^0-9.].*$//' \
              | sed -E 's/\.$//'
          }

          NODE_VERSION=""
          SOURCE=""

          # 1. project.yml wins. Flat `node: 22` mapping; good enough, this file is
          #    a handful of keys by design.
          if [ -f .github/project.yml ]; then
            V="$(sed -nE 's/^[[:space:]]*node:[[:space:]]*"?([^"#[:space:]]+)"?.*/\1/p' .github/project.yml | head -1 || true)"
            if [ -n "$V" ] && [ "$V" != "null" ]; then
              NODE_VERSION="$(normalise "$V")"; SOURCE=".github/project.yml (node:)"
            fi
          fi

          # 2a. .nvmrc
          if [ -z "$NODE_VERSION" ] && [ -f .nvmrc ]; then
            V="$(grep -vE '^[[:space:]]*(#|$)' .nvmrc | head -1 | tr -d '[:space:]' || true)"
            if [ -n "$V" ]; then
              NODE_VERSION="$(normalise "$V")"; SOURCE=".nvmrc"
            fi
          fi

          # 2b. package.json -> engines.node
          if [ -z "$NODE_VERSION" ] && [ -f package.json ]; then
            V=""
            if command -v node >/dev/null 2>&1; then
              V="$(node -e "try{const e=require('./package.json').engines||{};process.stdout.write(String(e.node||''))}catch(_){}" || true)"
            elif command -v python3 >/dev/null 2>&1; then
              V="$(python3 -c "import json;print((json.load(open('package.json')).get('engines') or {}).get('node') or '')" || true)"
            fi
            if [ -n "$V" ]; then
              NODE_VERSION="$(normalise "$V")"; SOURCE="package.json (engines.node)"
            fi
          fi

          # 3. No declared source -> stop. Do not guess.
          if [ -z "$NODE_VERSION" ]; then
            echo "::error::No Node version is declared in this repository, and this workflow refuses to guess one."
            {
              echo ""
              echo "Declare it in ONE of these places (checked in this order):"
              echo "  1. .github/project.yml  ->  node: \"22\"   (preferred: one descriptor for the whole repo)"
              echo "  2. .nvmrc               ->  22            (also drives local dev via nvm/fnm)"
              echo "     or package.json      ->  \"engines\": { \"node\": \">=22\" }"
              echo ""
              echo "Pick the version your DEPLOY target runs. CI on a different major than"
              echo "production proves nothing."
            } >&2
            exit 1
          fi

          echo "node-version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Node $NODE_VERSION (resolved from: $SOURCE)"
          echo "Node **$NODE_VERSION** — resolved from \`$SOURCE\`" >> "$GITHUB_STEP_SUMMARY"

      # Package cache (#571): on only on a GitHub-hosted runner AND with package-lock.json
      # present. Both halves are load-bearing:
      #   - No lockfile → setup-node's `cache:` fails the step outright ("Dependencies lock
      #     file is not found"), and this template allows a repo without one.
      #   - Self-hosted → off. A persistent runner already keeps ~/.npm between jobs; a
      #     remote cache on top was measured as a loss, not a saving (#512).
      # npm only: `cache: pnpm` needs pnpm on PATH before this step, and the install step
      # below enables it through corepack afterwards. `package-manager-cache` is pinned to
      # the same condition so setup-node's automatic `packageManager` caching cannot switch
      # it back on where the condition says off.
      # EDIT: self-hosted runners are already off; to turn caching off everywhere, replace
      # both expressions with '' and false. If the app is not at the root, point the
      # hashFiles() and a `cache-dependency-path:` at its package-lock.json.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: hashFiles('package.json') != ''
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: ${{ runner.environment == 'github-hosted' && hashFiles('package-lock.json') != '' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' && hashFiles('package-lock.json') != '' }}

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: |
          # Lockfile decides the package manager. `npm ci` / `--frozen-lockfile` are
          # intentional: CI must fail on a stale lockfile rather than silently resolve
          # a different dependency tree than the developer had.
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::No lockfile found — falling back to 'npm install'. Commit a lockfile so CI is reproducible."
            npm install
          fi

      - name: Test (the whole suite)
        run: |
          # `npm test` (light) and then `test:heavy`, if this repo has one.
          has() { node -e "const s=(require('./package.json').scripts)||{};process.exit(s['$1']?0:1)" 2>/dev/null; }
          if has test; then npm test; else echo "::notice::No 'test' script in package.json."; fi
          if has test:heavy; then npm run test:heavy; else echo "::notice::No 'test:heavy' script — nothing is marked heavy."; fi
      # EDIT: integration, browser/e2e or load jobs go here, or as jobs of their own with
      # `needs: plan` and the same `if:` and checkout ref as this one.

  # A red NIGHTLY is a trunk finding, never a merge block: one open issue per lane. An open issue
  # with the same title suppresses a new one; an issue list that cannot be read files nothing and
  # fails this job, so a silent miss is never mistaken for "already reported".
  report:
    name: Report a red nightly
    needs: [plan, heavy]
    if: ${{ always() && github.event_name == 'schedule' && needs.heavy.result == 'failure' }}
    runs-on: ubuntu-latest # EDIT: needs `gh`.
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: File one trunk-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.plan.outputs.sha }}
          SINCE: ${{ needs.plan.outputs.since }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          title="Nightly heavy lane red: $WORKFLOW"
          if ! open="$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number,title \
                         --jq "[.[] | select(.title == \"$title\")][0].number // \"\"")"; then
            echo "::error::cannot read this repo's issues — nothing filed; the red run is the only report"
            exit 1
          fi
          if [ -n "$open" ]; then
            echo "::notice::#$open already reports this lane red — not filing another."
            exit 0
          fi
          if [ -n "$SINCE" ]; then
            range="[\`${SINCE:0:12}..${SHA:0:12}\`]($GITHUB_SERVER_URL/$REPO/compare/$SINCE...$SHA) — the commits since the last green nightly"
          else
            range="up to \`${SHA:0:12}\` — no green nightly on record to bound it"
          fi
          gh label create trunk-red -R "$REPO" --color B60205 --description "Trunk fails a check" 2>/dev/null || true
          body="$(printf 'The heavy lane failed on trunk at `%s`: %s\n\nCould have caused it: %s.\n\nA nightly never blocks a merge. Close this issue once a nightly is green again.\n' "$SHA" "$RUN_URL" "$range")"
          gh issue create -R "$REPO" --title "$title" --label trunk-red --body "$body"
