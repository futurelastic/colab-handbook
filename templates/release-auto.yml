# Release (auto) — TEMPLATE. Copy me into your repo at .github/workflows/release-auto.yml.
#
# This is a starting point, not a dependency. Once you copy it, YOU OWN THIS FILE.
# Edit it freely; nothing calls it remotely and nothing will update it for you.
#
# EDIT POINTS are marked `# EDIT:` — walk them once after copying.
#
# WHAT IT DOES. It runs CONVENTIONS.md §6's release rung so nobody has to remember to:
#
#   trigger                                   step
#   ----------------------------------------  ------------------------------------------------
#   a daily schedule, first                   colab promote --auto           → dev → main, then
#   (`trunk: dev` + `deploy: tag` +                                            CI dispatched on
#   `promotion: main-loop` only; a no-op                                       main (#440)
#   everywhere else)
#   your CI workflow finished green on main   colab release cut --auto       → vX.Y.Z-rc.N
#   (on `trunk: dev`: the promotion's push)
#   a daily schedule                          colab release finalize --auto  → vX.Y.Z (or a
#                                                                              hand-off where
#                                                                              the final is a
#                                                                              human's)
#   workflow_dispatch                         all three, in that order
#   any of the above tagged something, and    npm publish (job `npm`, #433) — candidates to
#   project.yml declares release.npm          dist-tag `next`, finals to `latest`; see the
#                                             comment above that job
#
# Every decision — whether a candidate is owed, which bump, whether the test period
# elapsed clean, whether the final is automatic on this repo at all — is the colab CLI's,
# read from .github/project.yml's release rung. This file only schedules it and publishes
# what it tagged. Where the rung leaves candidates off, every run is a recorded refusal.
#
# WHERE IT FITS. `colab release cut` tags origin/main — release tags land on `main` on every
# trunk shape — so the same file, unchanged, fits two kinds of repo:
#
#   `trunk: main` + `deploy: tag | none`   every green CI run on main may cut a candidate.
#   `trunk: dev`  + `deploy: tag`          main only moves when dev is promoted into main (by
#                                          a human, or unattended below), so the green CI run
#                                          on that promotion is the trigger. The CLI reads `trunk:` and cuts only when
#                                          main's head IS a promotion of dev (a --no-ff merge
#                                          whose later parent is on dev, or a fast-forward);
#                                          any other head — a hotfix straight on main — is a
#                                          no-op, carried by the next promotion or cut by hand
#                                          with `colab release cut`. The bump reads the
#                                          promoted dev commits (never the merge subject, never
#                                          dev commits not yet promoted), and the manifest
#                                          version is read on main's promotion commit, so a
#                                          version bump must reach main through the promotion.
#                                          Finalize only posts the one-click hand-off: a final
#                                          is a human act wherever a tag deploys. Needs a
#                                          HANDBOOK_REF that carries #429; older CLIs cut on
#                                          any green main head.
#
# UNATTENDED PROMOTION (#440). Who may promote is project.yml's `promotion:`, read by the CLI. Where
# it says `main-loop` — and only on `deploy: tag`, where promotion verifies and deploys nothing —
# the daily run first runs `colab promote --auto`: when dev's head CI is green and dev is ahead of
# main it merges dev → main (`--no-ff`) and pushes main, then dispatches your CI workflow on main.
# The dispatch is needed because a push made with GITHUB_TOKEN triggers no workflow; a
# workflow_dispatch is the documented exception. That CI run's green completion fires this
# workflow again, and the cut step cuts the candidate exactly as it does for a human promotion. So
# your CI workflow must accept `workflow_dispatch:` (the handbook's CI templates do), and main
# must accept a push from this job's token (a ruleset on main that blocks it turns every promotion
# into a recorded refusal). Everywhere else — `promotion: human` or absent, `deploy: push-main`,
# `manual`, `none`, `trunk: main` — the step is a no-op and nothing promotes. The final tag stays
# the human click. Needs a HANDBOOK_REF that carries #440; an older CLI gives no verdict, which is
# a warning, never a failed run.
#
# Your CI workflow must run on pushes to main for the trigger to fire — the handbook's CI
# templates run on every branch. It does not fit `exposure: live` (no tags: the promotion
# itself is the deploy).
#
# PUBLISHING HAPPENS IN THIS RUN — deliberately. A tag pushed with GITHUB_TOKEN does NOT
# trigger other workflows (GitHub suppresses it to prevent loops). So "cut the tag here and
# let release.yml fire on the tag push" silently does nothing: the tag exists, no Release
# is ever published. The last step below publishes whatever this run tagged, itself.
# The same suppression means a deploy workflow on `v*.*.*` does not fire for a tag this
# workflow pushes either — on a `deploy: tag` repo the final is a human act anyway, and
# finalize --auto only posts the command for it.
#
# IT READS TAGS AND CREATES TAGS. IT NEVER WRITES A COMMIT. No step here commits; the refs
# pushed are the tags `colab release cut` / `colab release finalize` create (annotated, their
# checks recorded in the tag message) and — only on a repo granting unattended promotion — the
# promotion merge `colab promote --auto` pushes to main. The npm job never moves git either. `-rc.N` tags are published as
# pre-releases, never "Latest". The audit's pre-release deploy-trigger check (#332) still
# applies to your deploy workflows exactly as before.
#
# A REFUSAL IS NOT A FAILURE. `colab release cut --auto` refusing (nothing owed, a check
# failed) is the ordinary output of most runs; it is printed to the run summary as a
# warning and the job stays green, so a refusal never paints main red for `colab ship`.
# Only a run that produced no verdict at all (a crash, gh unusable, bad flags) fails.
#
# THE CLI IGNORES THIS WORKFLOW'S OWN RUNS when it reads CI at a commit (GITHUB_WORKFLOW,
# #425) — otherwise its own in-progress run would read as "CI not finished" forever. So
# never fold these steps into the workflow that runs your test suite: that suite's runs
# would be ignored with it.
#
# NO TOOLCHAIN RESOLUTION. It runs the colab CLI (zero-dependency Node) on the runner's
# preinstalled Node and gh. Nothing of your project is built here — except in the opt-in
# `npm` job, which sets up its own Node for npm's trusted publishing (EDIT point there for
# a package that needs a build). The npm job needs a HANDBOOK_REF that carries #433; an
# older CLI gives no npm verdict and nothing is published to npm.

name: Release (auto)

on:
  workflow_run:
    # EDIT: the `name:` of the workflow that runs your test suite on main.
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  schedule:
    # EDIT: when the daily finalize runs (UTC). Off the hour on purpose — the top of the
    # hour is when scheduled runs queue longest.
    - cron: "17 3 * * *"
  workflow_dispatch:

# One release run at a time; a second one waits rather than racing the first for the same
# candidate number. Never cancelled mid-run: a half-finished run may have pushed a tag
# without publishing it.
concurrency:
  group: release-auto
  cancel-in-progress: false

permissions: {}

env:
  # EDIT: the handbook version whose colab CLI makes the release decisions. Pin a tag;
  # moving it is a deliberate act, like re-copying a template.
  HANDBOOK_REF: "v1.11.0"
  HANDBOOK_REPO: "https://github.com/futurelastic/colab-handbook.git"

jobs:
  release:
    name: Cut, finalize, publish
    # A red CI run on main is not a candidate; skip rather than refuse.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest # EDIT: self-hosted label if this repo needs one.
    permissions:
      contents: write # push the tags (and, with promotion: main-loop, the promotion), publish the GitHub Release
      issues: write # finalize opens / comments on / closes the "release: vX.Y.Z" tracking issue
      actions: write # read the runs at a commit (ci-green, full-suite, trunk-green); dispatch CI after a promotion
    # What the npm job below needs (#433) — empty / publish=false unless this run tagged something
    # AND .github/project.yml opts in with release.npm.
    outputs:
      tags: ${{ steps.npm-target.outputs.tags }}
      npm: ${{ steps.npm-target.outputs.publish }}
      npm-dir: ${{ steps.npm-target.outputs.dir }}
      npm-gate: ${{ steps.npm-target.outputs.gate }}
      npm-package: ${{ steps.npm-target.outputs.package }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          # Full history plus tags: versions, bumps and "previous final" are all read from
          # git, and the on-trunk check refuses a shallow checkout outright.
          fetch-depth: 0
          # Left on deliberately: `colab release cut` / `finalize` push their tag over the
          # checkout's origin. The token is this job's, scoped by `permissions:` above.
          persist-credentials: true

      - name: Fetch the colab CLI
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$HANDBOOK_REF" "$HANDBOOK_REPO" "$RUNNER_TEMP/colab-handbook"
          echo "COLAB=$RUNNER_TEMP/colab-handbook/tools/colab" >> "$GITHUB_ENV"
          # The tags are annotated; git needs an identity to write one.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # #440: where project.yml grants `promotion: main-loop` on `deploy: tag`, promote a green dev
      # into main, then dispatch CI there — its green run fires this workflow again to cut the
      # candidate. Everywhere else the CLI answers a no-op. A refusal (dev CI not green, a push
      # rejected) is a warning; the job stays green.
      - name: Promote unattended (colab promote --auto)
        id: promote
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          # EDIT: your test-suite workflow — the same one `workflow_run.workflows` names above.
          CI_WORKFLOW: "CI"
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/promote.json"
          rc=0
          node "$COLAB" promote --auto --json > "$OUT" || rc=$?
          if ! jq -e 'has("promoted")' "$OUT" > /dev/null 2>&1; then
            echo "::warning::colab promote --auto gave no verdict (exit $rc; a HANDBOOK_REF older than #440?) — nothing was promoted"
            exit 0
          fi
          {
            echo "### colab promote --auto"
            echo
            jq -r '.checks[]? | "- \(if .ok then "✓" else "✗" end) **\(.condition)** — \(.detail)"' "$OUT"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$(jq -r '.promoted' "$OUT")" = "true" ]; then
            echo "promoted=true" >> "$GITHUB_OUTPUT"
            echo "Promoted to main @ $(jq -r '.sha' "$OUT")" | tee -a "$GITHUB_STEP_SUMMARY"
            if gh workflow run "$CI_WORKFLOW" --ref main; then
              echo "Dispatched $CI_WORKFLOW on main — its green run cuts the candidate." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::promoted, but could not dispatch $CI_WORKFLOW on main (does it declare workflow_dispatch:?) — run it by hand to cut the candidate"
            fi
          elif [ "$(jq -r '.noop' "$OUT")" = "true" ]; then
            echo "No promotion: $(jq -r '.reason' "$OUT")" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::colab promote --auto refused: $(jq -r '.reason' "$OUT")"
          fi

      - name: Cut a candidate (colab release cut --auto)
        id: cut
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/cut.json"
          rc=0
          node "$COLAB" release cut --auto --json > "$OUT" || rc=$?
          # A verdict is JSON carrying `ok`; anything else is a run that never decided.
          if ! jq -e 'has("ok")' "$OUT" > /dev/null 2>&1; then
            echo "::error::colab release cut produced no verdict (exit $rc)"
            cat "$OUT"
            exit 1
          fi
          {
            echo "### colab release cut --auto"
            echo
            jq -r '.checks[]? | "- \(if .ok then "✓" else "✗" end) **\(.condition)** — \(.detail)"' "$OUT"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$(jq -r '.created' "$OUT")" = "true" ]; then
            TAG="$(jq -r '.tag' "$OUT")"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Cut $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$(jq -r '.noop' "$OUT")" = "true" ]; then
            echo "No-op: nothing owed, inside the cadence window, or main's head is not a promotion." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$(jq -r '.ok' "$OUT")" = "true" ]; then
            echo "Verdict ok but nothing created." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::colab release cut refused: $(jq -r '[.checks[]? | select(.ok | not) | .condition] | join(", ")' "$OUT")"
          fi

      - name: Finalize the newest clean candidate (colab release finalize --auto)
        id: finalize
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/finalize.json"
          rc=0
          node "$COLAB" release finalize --auto --json > "$OUT" || rc=$?
          if ! jq -e 'has("state")' "$OUT" > /dev/null 2>&1; then
            echo "::error::colab release finalize produced no verdict (exit $rc)"
            cat "$OUT"
            exit 1
          fi
          STATE="$(jq -r '.state' "$OUT")"
          {
            echo "### colab release finalize --auto — $STATE"
            echo
            jq -r '.checks[]? | "- \(if .ok then "✓" else "✗" end) **\(.condition)** — \(.detail)"' "$OUT"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$(jq -r '.tagged' "$OUT")" = "true" ]; then
            TAG="$(jq -r '.finalTag' "$OUT")"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Finalized $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            case "$STATE" in
              refused|needs-new-candidate|held) echo "::warning::colab release finalize: $STATE" ;;
              *) echo "Finalize: $STATE" ;;
            esac
          fi

      # Whether the npm job publishes what this run tagged — `colab release npm` reads the
      # release: block (one reading, the same as cut/finalize). A CLI older than #433 gives no
      # verdict; that is a warning and no npm publish, never a failed release.
      - name: Read the npm target (colab release npm)
        id: npm-target
        if: steps.cut.outputs.tag != '' || steps.finalize.outputs.tag != ''
        env:
          TAGS: ${{ steps.cut.outputs.tag }} ${{ steps.finalize.outputs.tag }}
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/npm.json"
          node "$COLAB" release npm --json > "$OUT" 2> /dev/null || true
          if ! jq -e 'has("publish")' "$OUT" > /dev/null 2>&1; then
            echo "::warning::colab release npm gave no verdict (a HANDBOOK_REF older than #433?) — nothing is published to npm"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(jq -r '.publish' "$OUT")" != "true" ]; then
            if [ "$(jq -r '.findings | length' "$OUT")" != "0" ]; then
              echo "::warning::not publishing to npm: $(jq -r '.findings | join("; ")' "$OUT")"
            fi
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "publish=true"
            echo "tags=$(echo $TAGS)"
            echo "dir=$(jq -r '.dir' "$OUT")"
            echo "gate=$(jq -r '.gate' "$OUT")"
            echo "package=$(jq -r '.package' "$OUT")"
          } >> "$GITHUB_OUTPUT"

      # Publishes every tag THIS run created. In this run, never via a tag-push workflow:
      # see "PUBLISHING HAPPENS IN THIS RUN" in the header.
      - name: Publish GitHub Release (same run)
        if: steps.cut.outputs.tag != '' || steps.finalize.outputs.tag != ''
        env:
          TAGS: ${{ steps.cut.outputs.tag }} ${{ steps.finalize.outputs.tag }}
        run: |
          set -euo pipefail
          for TAG in $TAGS; do
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "$TAG already has a Release — skipping"
              continue
            fi
            # Notes since the previous FINAL tag, candidate or final alike — never since an
            # earlier candidate (the same rule as release-tag.yml).
            PREV="$(git describe --tags --abbrev=0 --match 'v*.*.*' --exclude '*-*' "${TAG}^" 2>/dev/null || true)"
            NOTES="$RUNNER_TEMP/notes-$TAG.md"
            if [ -n "$PREV" ]; then
              node "$COLAB" release-notes "${PREV}..${TAG}" --out "$NOTES"
            else
              printf '## %s\n\nFirst release.\n' "$TAG" > "$NOTES"
            fi
            case "$TAG" in
              *-*) KIND=(--prerelease --latest=false) ;;
              *)   KIND=(--latest) ;;
            esac
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES" --generate-notes "${KIND[@]}"
            echo "Published $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  # ---------------------------------------------------------------------------------------------
  # npm (#433) — publishes what the release job tagged, in this same run. Opt-in: it runs only when
  # .github/project.yml declares release.npm + release.npm-gate on the public-tool route, so a repo
  # without them never gets this job.
  #
  #   candidate vX.Y.Z-rc.N  ->  npm publish --tag next   --provenance
  #   final     vX.Y.Z       ->  npm publish --tag latest --provenance   (latest never moves to an rc)
  #
  # TRUSTED PUBLISHING (OIDC) ONLY. No npm token is stored, read, or offered as a fallback — the
  # job refuses to run with one in its environment. npm ends direct publishing with 2FA-bypass
  # tokens in January 2027; this design never used one. One-time setup on npmjs.com: the package's
  # Settings -> Trusted publishing -> GitHub Actions, this repository, workflow file
  # `release-auto.yml` (the file's name, not its `name:`).
  #
  # GITHUB-HOSTED, ALWAYS. npm trusted publishing does not support self-hosted runners, so this job
  # stays on GitHub-hosted even where `release` above runs self-hosted (free on a public repo — the
  # only kind that publishes here; a private repo is refused outright, #432).
  #
  # IT NEVER MOVES GIT. It checks out the tag, stamps the version from the tag into package.json
  # (the manifest carries none — the tag is the version), runs the gate, publishes. Nothing is
  # committed or pushed. If it fails, the tag stands, `npm-record` writes "tagged, not published"
  # on the Release, and re-running the failed job publishes the existing tag; a version already on
  # npm is skipped, so a re-run never double-publishes.
  npm:
    name: Publish to npm (trusted publishing)
    needs: release
    if: needs.release.outputs.npm == 'true'
    runs-on: ubuntu-latest # NEVER self-hosted: npm trusted publishing does not support it.
    permissions:
      contents: read # check out the tag; read the repository's visibility
      id-token: write # the OIDC token npm exchanges for a one-time publish credential
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAGS: ${{ needs.release.outputs.tags }}
      PKG_DIR: ${{ needs.release.outputs.npm-dir }}
      GATE: ${{ needs.release.outputs.npm-gate }}
      PACKAGE: ${{ needs.release.outputs.npm-package }}
    steps:
      - name: Refuse a private repository, and any npm token
        run: |
          set -uo pipefail
          # Visibility from the API, never assumed: unknown is refused like private.
          PRIVATE="$(gh api "repos/$REPO" --jq '.private' 2> /dev/null || echo unknown)"
          if [ "$PRIVATE" != "false" ]; then
            echo "::error::$REPO is private (or its visibility could not be read: $PRIVATE) — a private repository never publishes to public npm (#432). Remove release.npm, or install from git."
            exit 1
          fi
          if [ -n "${NODE_AUTH_TOKEN:-}${NPM_TOKEN:-}" ]; then
            echo "::error::an npm token is set in this job's environment — this workflow publishes through trusted publishing (OIDC) only and never with a token. Remove it."
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false # nothing here pushes

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24 # no registry-url: that writes an .npmrc expecting a token

      - name: npm new enough for trusted publishing (>= 11.5.1)
        run: |
          set -euo pipefail
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"; then
            npm install --global npm@11
          fi
          npm --version

      # EDIT: a package that needs a build step builds here, BEFORE the gate — the gate measures
      # what ships, and the publish below runs with --ignore-scripts so nothing changes after it.
      - name: Publish each tag (npm publish --provenance)
        run: |
          set -euo pipefail
          for TAG in $TAGS; do
            VERSION="${TAG#v}"
            case "$VERSION" in
              *-*) DIST=next ;;
              *)   DIST=latest ;;
            esac
            if npm view "$PACKAGE@$VERSION" version > /dev/null 2>&1; then
              echo "$PACKAGE@$VERSION is already on npm — skipping" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            git checkout --quiet --force "refs/tags/$TAG"
            git clean -fdxq
            (cd "$PKG_DIR" && npm pkg set "version=$VERSION")
            sh -c "$GATE"
            (cd "$PKG_DIR" && npm publish --tag "$DIST" --provenance --access public --ignore-scripts)
            echo "Published $PACKAGE@$VERSION to npm (dist-tag $DIST)" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  # Writes the npm outcome onto each GitHub Release the run published, replacing its own earlier
  # line on a re-run: "published" once it is, "tagged, not published" with the re-run hint until then.
  npm-record:
    name: Record the npm outcome on the Release
    needs: [release, npm]
    if: always() && needs.release.outputs.npm == 'true'
    runs-on: ubuntu-latest # EDIT: self-hosted label if this repo needs one.
    permissions:
      contents: write # edit the Release notes
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAGS: ${{ needs.release.outputs.tags }}
      PACKAGE: ${{ needs.release.outputs.npm-package }}
      RESULT: ${{ needs.npm.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Record the npm outcome
        run: |
          set -euo pipefail
          for TAG in $TAGS; do
            BODY="$(gh release view "$TAG" --repo "$REPO" --json body --jq '.body' 2> /dev/null)" || {
              echo "$TAG has no Release — nothing to record on"
              continue
            }
            VERSION="${TAG#v}"
            case "$VERSION" in *-*) DIST=next ;; *) DIST=latest ;; esac
            if [ "$RESULT" = "success" ]; then
              LINE="npm: published \`$PACKAGE@$VERSION\` (dist-tag \`$DIST\`)."
            else
              LINE="**npm: tagged, not published** (\`$PACKAGE@$VERSION\`, job $RESULT). Re-run the failed \`npm\` job of $RUN_URL — it publishes this existing tag; nothing in git moves."
            fi
            NOTES="$RUNNER_TEMP/notes-$TAG.md"
            printf '%s\n' "$BODY" | sed '/^<!-- colab:npm -->$/,/^<!-- \/colab:npm -->$/d' > "$NOTES"
            printf '\n<!-- colab:npm -->\n%s\n<!-- /colab:npm -->\n' "$LINE" >> "$NOTES"
            gh release edit "$TAG" --repo "$REPO" --notes-file "$NOTES" > /dev/null
            echo "$TAG: $LINE" | tee -a "$GITHUB_STEP_SUMMARY"
          done
