# Release (auto) — TEMPLATE. Copy me into your repo at .github/workflows/release-auto.yml.
#
# This is a starting point, not a dependency. Once you copy it, YOU OWN THIS FILE.
# Edit it freely; nothing calls it remotely and nothing will update it for you.
#
# EDIT POINTS are marked `# EDIT:` — walk them once after copying.
#
# WHAT IT DOES. It runs CONVENTIONS.md §6's release rung so nobody has to remember to:
#
#   trigger                                   step
#   ----------------------------------------  ------------------------------------------------
#   a daily schedule, first                   colab promote --auto           → dev → main, then
#   (`trunk: dev` + `deploy: tag` +                                            CI dispatched on
#   `promotion: main-loop` only; a no-op                                       main (#440)
#   everywhere else)
#   your CI workflow finished green on main   colab release cut --auto       → vX.Y.Z-rc.N
#   (on `trunk: dev`: the promotion's push),  (#443: the newest candidate always names main's
#   and the daily schedule                     head; a head already carrying one is a no-op)
#   a daily schedule                          colab release finalize --auto  → vX.Y.Z (or a
#                                                                              hand-off where
#                                                                              the final is a
#                                                                              human's)
#   workflow_dispatch                         all three, in that order
#   any of the above tagged something, and    npm publish (job `npm`, #433) — candidates to
#   project.yml declares release.npm          dist-tag `next`, finals to `latest`; see the
#                                             comment above that job
#   the cut tagged a FINAL — route            deploy + health check (job `deploy`, #446) — see
#   deploy-tag-fast only                      "DEPLOYING IN THIS RUN" below
#
# Every decision — whether a candidate is owed, which bump, whether the test period
# elapsed clean, whether the final is automatic on this repo at all — is the colab CLI's,
# read from .github/project.yml's release rung. This file only schedules it and publishes
# what it tagged. Where the rung leaves candidates off, every run is a recorded refusal.
#
# WHERE IT FITS. `colab release cut` tags origin/main — release tags land on `main` on every
# trunk shape — so the same file, unchanged, fits two kinds of repo:
#
#   `trunk: main` + `deploy: tag | none`   every green CI run on main may cut a candidate.
#   `trunk: dev`  + `deploy: tag`          main only moves when dev is promoted into main (by
#                                          a human, or unattended below), so the green CI run
#                                          on that promotion is the trigger. The CLI reads `trunk:` and cuts only when
#                                          main's head IS a promotion of dev (a --no-ff merge
#                                          whose later parent is on dev, or a fast-forward);
#                                          any other head — a hotfix straight on main — is a
#                                          no-op, carried by the next promotion or cut by hand
#                                          with `colab release cut`. The bump reads the
#                                          promoted dev commits (never the merge subject, never
#                                          dev commits not yet promoted), and the manifest
#                                          version is read on main's promotion commit, so a
#                                          version bump must reach main through the promotion.
#                                          Finalize only posts the one-click hand-off: a final
#                                          is a human act wherever a tag deploys. Needs a
#                                          HANDBOOK_REF that carries #429; older CLIs cut on
#                                          any green main head.
#
# UNATTENDED PROMOTION (#440). Who may promote is project.yml's `promotion:`, read by the CLI. Where
# it says `main-loop` — and only on `deploy: tag`, where promotion verifies and deploys nothing —
# the daily run first runs `colab promote --auto`: when dev's head CI is green and dev is ahead of
# main it merges dev → main (`--no-ff`) and pushes main, then dispatches your CI workflow on main.
# The dispatch is needed because a push made with GITHUB_TOKEN triggers no workflow; a
# workflow_dispatch is the documented exception. That CI run's green completion fires this
# workflow again, and the cut step cuts the candidate exactly as it does for a human promotion. So
# your CI workflow must accept `workflow_dispatch:` (the handbook's CI templates do), and main
# must accept a push from this job's token (a ruleset on main that blocks it turns every promotion
# into a recorded refusal). Everywhere else — `promotion: human` or absent, `deploy: push-main`,
# `manual`, `none`, `trunk: main` — the step is a no-op and nothing promotes. The final tag stays
# the human click. Needs a HANDBOOK_REF that carries #440; an older CLI gives no verdict, which is
# a warning, never a failed run.
#
# Your CI workflow must run on pushes to main for the trigger to fire — the handbook's CI
# templates run on every branch. It does not fit `exposure: live` (no tags: the promotion
# itself is the deploy).
#
# PUBLISHING HAPPENS IN THIS RUN — deliberately. A tag pushed with GITHUB_TOKEN does NOT
# trigger other workflows (GitHub suppresses it to prevent loops). So "cut the tag here and
# let release.yml fire on the tag push" silently does nothing: the tag exists, no Release
# is ever published. The last step below publishes whatever this run tagged, itself.
# The same suppression means a deploy workflow on `v*.*.*` does not fire for a tag this
# workflow pushes either — on a `deploy: tag` repo the final is a human act anyway, and
# finalize --auto only posts the command for it.
#
# DEPLOYING IN THIS RUN (deploy-tag-fast, #446). On a `deploy: tag` repo whose operator granted
# route `deploy-tag-fast` (release.final-grant + release.health-url + release.rollback: auto),
# `colab release cut --auto` tags the FINAL vX.Y.Z on every green main head — no candidate, no
# test period — and the `deploy` job below deploys that tag in this same run, then polls
# release.health-url until it reports the version. Its deploy step is an EDIT point: replace it
# with your deploy (it fails loudly until you do) — or, for a container app, replace the whole job
# with the commented one under it, which calls templates/deploy-container.yml (#452): the same
# deploy a human-pushed final runs on route deploy-tag, so both routes share one deploy path, with
# its own health check and rollback. On every other route the job is skipped and the
# run still concludes on the `release` job. EDIT: on this route, a cron more frequent than daily
# tags a head that release.final-spacing held back sooner.
#
# DRY RUN ON A FIX BRANCH (#474). This workflow never runs on a branch by itself, so a fix to it
# (a moved runner label, a HANDBOOK_REF naming a missing branch) had no run to prove it, and the
# cure rule (CONVENTIONS.md §4) could only refuse it — a human ci-grant was the one door. Dispatch
# it on the fix branch instead:
#
#     gh workflow run release-auto.yml --ref <fix-branch> -f dry_run=true
#
# (`colab ship` dispatches it for you when a red in this workflow is what stands between the branch
# and trunk). A dispatch on any ref other than main is ALWAYS dry, input or not. A dry run checks out
# the branch, runs every step with `--dry` — the same decisions, nothing promoted, tagged, released,
# pushed or dispatched — and skips only the steps whose names end in `[publish]`. The step
# "Dry run — nothing is tagged, released or published" runs only then; it is how the cure rule
# recognises the run. Keep both names as they are: the cure rule matches steps BY NAME, and accepts
# a dry run only if every step that ran in trunk's red run passed in it and every step it skipped
# ends in `[publish]`. So a red INSIDE a `[publish]` step, or in the npm or deploy jobs (which never
# run without a tag), cannot be cured by a dry run — that stays a human ci-grant.
#
# IT READS TAGS AND CREATES TAGS. IT NEVER WRITES A COMMIT. No step here commits; the refs
# pushed are the tags `colab release cut` / `colab release finalize` create (annotated, their
# checks recorded in the tag message) and — only on a repo granting unattended promotion — the
# promotion merge `colab promote --auto` pushes to main. The npm job never moves git either. `-rc.N` tags are published as
# pre-releases, never "Latest". The audit's pre-release deploy-trigger check (#332) still
# applies to your deploy workflows exactly as before.
#
# A REFUSAL IS NOT A FAILURE. `colab release cut --auto` refusing (nothing owed, a check
# failed) is the ordinary output of most runs; it is printed to the run summary as a
# warning and the job stays green, so a refusal never paints main red for `colab ship`.
# Only a run that produced no verdict at all (a crash, gh unusable, bad flags) fails.
# A STANDING refusal is still not a failure, but it is not a warning either (#467): one no
# later run clears by itself — no first final tag, a malformed colab:switch marker, a
# manifest that disagrees — is an `::error title=Release stalled::` annotation plus a
# summary banner, and `colab release-status` flags the repo. Still exit 0: a red run here
# would make main's head not-green and refuse the very ship that clears the stall.
# Every finalize run that makes no final says why, and lists each open candidate's reason
# and when its own test period ends (#468).
#
# THE CLI IGNORES THIS WORKFLOW'S OWN RUNS when it reads CI at a commit (GITHUB_WORKFLOW,
# #425) — otherwise its own in-progress run would read as "CI not finished" forever. So
# never fold these steps into the workflow that runs your test suite: that suite's runs
# would be ignored with it.
#
# NO TOOLCHAIN RESOLUTION. It runs the colab CLI (zero-dependency Node) on the runner's
# preinstalled Node and gh. Nothing of your project is built here — except in the opt-in
# `npm` job, which sets up its own Node for npm's trusted publishing (EDIT point there for
# a package that needs a build). The npm job needs a HANDBOOK_REF that carries #433; an
# older CLI gives no npm verdict and nothing is published to npm.
#
# RUNNERS — ON A PRIVATE REPO, YOUR OWN (#453). This workflow fires on every green CI run on main,
# so any of its jobs failing is a failed run at main's head, and `colab ship` reads that as main
# not green. On a PRIVATE (or internal) repo GitHub-hosted minutes are billed, and when the
# owner's billing fails GitHub refuses a hosted job before it starts: main goes red, every landing
# is refused until a human steps in — measured twice in a row on one adopting repo, where this was
# the only workflow on main still on hosted runners. So:
#   private / internal repo   `release`, `npm-record` (and `deploy`, if you enable it) run on the
#                             SAME self-hosted label your ci.yml's trunk jobs use. The runner needs
#                             git, node, gh and jq on its PATH (GitHub-hosted images have all four).
#   public repo               `ubuntu-latest` is fine — hosted minutes are free there.
#   the `npm` job             GitHub-hosted on every repo: npm trusted publishing requires it. It only
#                             runs on a public repo (a private one is refused outright, #432), so it
#                             is never billed.
# The trade-off, stated: a self-hosted release job queues behind your own runners, and an offline
# pool delays a candidate — it never paints main red the way a refused hosted job does. The label
# is a literal EDIT point, not an expression keyed on visibility: `github.event.repository` is not
# in a scheduled run's payload, so a visibility switch would silently pick hosted on exactly the
# daily run. `colab audit` flags a private repo whose release workflow still runs hosted, naming
# the label your other workflows already use.

name: Release (auto)

on:
  workflow_run:
    # EDIT: the `name:` of the workflow that runs your test suite on main.
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  schedule:
    # EDIT: when the daily finalize runs (UTC). Off the hour on purpose — the top of the
    # hour is when scheduled runs queue longest.
    - cron: "17 3 * * *"
  workflow_dispatch:
    # #474: a DRY RUN for a fix branch — see "DRY RUN ON A FIX BRANCH" in the header. A dispatch on
    # any ref other than main is dry whether or not this is set; on main it is opt-in.
    inputs:
      dry_run:
        description: "Dry run: decide everything, write nothing (no promotion, tag, Release or publish)"
        type: boolean
        default: false

# One release run at a time; a second one waits rather than racing the first for the same
# candidate number. Never cancelled mid-run: a half-finished run may have pushed a tag
# without publishing it.
concurrency:
  # A dry run (#474) gets a group of its own: GitHub cancels an older PENDING run in the same group,
  # so a shared one could let a branch's dry run displace a real release run waiting on main.
  group: release-auto${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run || github.ref_name != 'main') && format('-dry-{0}', github.ref_name) || '' }}
  cancel-in-progress: false

permissions: {}

env:
  # EDIT: the handbook ref whose colab CLI makes the release decisions — a CHANNEL or a
  # version tag (CONVENTIONS.md §6, *Release channels*, #445):
  #   stable     the newest final release — the default; it moves forward as finals are cut,
  #              and that release's notes say what changed
  #   next       the newest candidate (vX.Y.Z-rc.N) — the fast channel
  #   vX.Y.Z     an exact version tag — frozen; moving it is a deliberate act, like re-copying
  #              a template
  HANDBOOK_REF: "stable"
  HANDBOOK_REPO: "https://github.com/futurelastic/colab-handbook.git"
  # A TRANSIENT UPSTREAM ERROR NEVER TURNS MAIN RED (#464). This run fires on every landing, and a
  # red run at main's head blocks every `colab ship` — so a GitHub / registry 5xx, a 429, a timeout
  # or a dropped connection must not fail a step that a plain re-run would pass. Every step that
  # talks to the network runs its call through `retry_transient` (each step `eval`s this block):
  # the command is re-run with backoff while its output names a transient error, up to
  # RETRY_ATTEMPTS times, and the last attempt's output and exit code are what the step sees. A
  # persistent transient error still fails, with its message; anything else fails at once.
  # Retrying is only safe because every retried call is idempotent — a read, or a write whose
  # re-run after success is a no-op (`colab release cut/finalize/promote` read a head already done
  # as a no-op; a Release or npm version that already exists is a skip). Keep that true if you add one.
  RETRY_ATTEMPTS: "4" # EDIT: tries per call; backoff 5s, 10s, 20s between them.
  RETRY_TRANSIENT: |
    exec 3>&2
    TRANSIENT_PATTERN='HTTP (5[0-9][0-9]|429)|returned error: (5[0-9][0-9]|429)|No server is currently available|Service Unavailable|Bad Gateway|Gateway Time-?out|Internal Server Error|secondary rate limit|rate limit exceeded|ETIMEDOUT|ECONNRESET|EAI_AGAIN|socket hang up|i/o timeout|TLS handshake timeout|connection reset|Could not resolve host|remote end hung up|early EOF|RPC failed|code E(5[0-9][0-9]|429)'
    retry_transient() {
      local attempt=1 max="${RETRY_ATTEMPTS:-4}" delay="${RETRY_DELAY:-5}" rc out err
      out="$(mktemp)"; err="$(mktemp)"
      while :; do
        rc=0
        "$@" > "$out" 2> "$err" || rc=$?
        if [ "$rc" -eq 0 ] || [ "$attempt" -ge "$max" ] || ! cat "$err" "$out" | grep -Eiq "$TRANSIENT_PATTERN"; then
          cat "$out"; cat "$err" >&2; rm -f "$out" "$err"; return "$rc"
        fi
        echo "::warning::$1: transient error (attempt $attempt/$max), retrying in ${delay}s — $(cat "$err" "$out" | grep -Eim1 "$TRANSIENT_PATTERN")" >&3
        sleep "$delay"; attempt=$((attempt + 1)); delay=$((delay * 2))
      done
    }

jobs:
  release:
    name: Cut, finalize, publish
    # No job-level `if:` here, on purpose (#435): a red CI run is gated in the first step below,
    # so this run concludes success. A job-level `if:` would skip every job, GitHub would record
    # the whole run as `skipped` at that main sha, and `colab ship` reads any finished run that is
    # neither success nor cancelled as "not green". Re-run CI green on that sha and the skipped
    # Release (auto) row would still sit beside it, refusing every ship until main moves.
    # EDIT: PRIVATE repo → your ci.yml's self-hosted trunk label, e.g. [self-hosted, linux]
    # (RUNNERS, above). ubuntu-latest only on a public repo.
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tags (and, with promotion: main-loop, the promotion), publish the GitHub Release
      issues: write # finalize opens / comments on / closes the "release: vX.Y.Z" tracking issue
      actions: write # read the runs at a commit (ci-green, full-suite, trunk-green); dispatch CI after a promotion
    # What the npm job below needs (#433) — empty / publish=false unless this run tagged something
    # AND .github/project.yml opts in with release.npm.
    outputs:
      tags: ${{ steps.npm-target.outputs.tags }}
      npm: ${{ steps.npm-target.outputs.publish }}
      npm-dir: ${{ steps.npm-target.outputs.dir }}
      npm-gate: ${{ steps.npm-target.outputs.gate }}
      npm-package: ${{ steps.npm-target.outputs.package }}
      # What the deploy job below needs (#446) — empty unless this run tagged a deploy-tag-fast final.
      deploy-tag: ${{ steps.cut.outputs.final }}
      health-url: ${{ steps.cut.outputs.health-url }}
    env:
      GH_TOKEN: ${{ github.token }}
      # #474: 'true' on a dry run — a dispatch on any ref other than main, or one with dry_run set.
      # Never on workflow_run or schedule. Every write below is off when it is.
      # EDIT: if your trunk is not `main`, name it here too (the same branch as `ref:` below).
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run || github.ref_name != 'main') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # A dry run checks out the ref it was dispatched on — the fix being proven; every other run, main.
          ref: ${{ env.DRY_RUN == 'true' && github.sha || 'main' }}
          # Full history plus tags: versions, bumps and "previous final" are all read from
          # git, and the on-trunk check refuses a shallow checkout outright.
          fetch-depth: 0
          # Left on deliberately: `colab release cut` / `finalize` push their tag over the
          # checkout's origin. The token is this job's, scoped by `permissions:` above. Off on a dry
          # run (#474): nothing is pushed, so nothing should be able to push.
          persist-credentials: ${{ env.DRY_RUN != 'true' }}

      # #474: the marker ci-cure reads to recognise a dry run — its name must stay byte-identical to
      # DRY_RUN_STEP in the handbook's tools/lib/ci-cure.js. Skipped on every ordinary run.
      - name: Dry run — nothing is tagged, released or published
        if: env.DRY_RUN == 'true'
        run: |
          {
            echo "#### Dry run (#474)"
            echo
            echo "Dispatched on \`$GITHUB_REF_NAME\` @ \`$GITHUB_SHA\`. Every decision below runs with \`--dry\`; steps marked \`[publish]\` are skipped. Nothing is promoted, tagged, released or published."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # A red CI run on main is not a candidate. Gated here rather than by a job-level `if:` so
      # this run concludes success, never `skipped` (#435; the comment on the job above).
      - name: Gate on the triggering CI run
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_run" ] && [ "$CONCLUSION" != "success" ]; then
            echo "cut=false" >> "$GITHUB_OUTPUT"
            echo "CI concluded \`$CONCLUSION\` at $HEAD_SHA — nothing to cut." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "cut=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the colab CLI
        run: |
          set -euo pipefail
          eval "$RETRY_TRANSIENT"
          # A clone that died half-way leaves a directory a second clone refuses — start clean each try.
          fetch_cli() { rm -rf "$RUNNER_TEMP/colab-handbook"; git clone --quiet --depth 1 --branch "$HANDBOOK_REF" "$HANDBOOK_REPO" "$RUNNER_TEMP/colab-handbook"; }
          retry_transient fetch_cli
          echo "COLAB=$RUNNER_TEMP/colab-handbook/tools/colab" >> "$GITHUB_ENV"
          # The tags are annotated; git needs an identity to write one.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # #440: where project.yml grants `promotion: main-loop` on `deploy: tag`, promote a green dev
      # into main, then dispatch CI there — its green run fires this workflow again to cut the
      # candidate. Everywhere else the CLI answers a no-op. A refusal (dev CI not green, a push
      # rejected) is a warning; the job stays green.
      - name: Promote unattended (colab promote --auto)
        id: promote
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          # EDIT: your test-suite workflow — the same one `workflow_run.workflows` names above.
          CI_WORKFLOW: "CI"
        run: |
          set -uo pipefail
          eval "$RETRY_TRANSIENT"
          OUT="$RUNNER_TEMP/promote.json"
          rc=0
          DRY=(); [ "${DRY_RUN:-false}" = "true" ] && DRY=(--dry)
          retry_transient node "$COLAB" promote --auto ${DRY[@]+"${DRY[@]}"} --json > "$OUT" || rc=$?
          if ! jq -e 'has("promoted")' "$OUT" > /dev/null 2>&1; then
            echo "::warning::colab promote --auto gave no verdict (exit $rc; a HANDBOOK_REF older than #440?) — nothing was promoted"
            exit 0
          fi
          {
            echo "### colab promote --auto"
            echo
            jq -r '.checks[]? | "- \(if .ok then "✓" else "✗" end) **\(.condition)** — \(.detail)"' "$OUT"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${DRY_RUN:-false}" = "true" ]; then
            # #474: a dry run promotes nothing and dispatches nothing, whatever the verdict says.
            echo "Dry run — promote: $(jq -r 'if .promoted then "would promote" elif .noop then "no-op: \(.reason)" else "would refuse: \(.reason)" end' "$OUT")" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$(jq -r '.promoted' "$OUT")" = "true" ]; then
            echo "promoted=true" >> "$GITHUB_OUTPUT"
            echo "Promoted to main @ $(jq -r '.sha' "$OUT")" | tee -a "$GITHUB_STEP_SUMMARY"
            if retry_transient gh workflow run "$CI_WORKFLOW" --ref main; then
              echo "Dispatched $CI_WORKFLOW on main — its green run cuts the candidate." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::promoted, but could not dispatch $CI_WORKFLOW on main (does it declare workflow_dispatch:?) — run it by hand to cut the candidate"
            fi
          elif [ "$(jq -r '.noop' "$OUT")" = "true" ]; then
            echo "No promotion: $(jq -r '.reason' "$OUT")" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::colab promote --auto refused: $(jq -r '.reason' "$OUT")"
          fi

      # #443: the newest candidate always names main's head. The scheduled run cuts too, so a head a
      # declared release.candidates-per-day window held back is tagged once the window ends, even
      # with no new merge to fire workflow_run. A head already carrying a candidate is a no-op. Not
      # right after this run promoted: that head has no CI yet — the dispatched run cuts it.
      - name: Cut a candidate (colab release cut --auto)
        id: cut
        if: steps.gate.outputs.cut == 'true' && (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && steps.promote.outputs.promoted != 'true'
        run: |
          set -uo pipefail
          eval "$RETRY_TRANSIENT"
          OUT="$RUNNER_TEMP/cut.json"
          rc=0
          DRY=(); [ "${DRY_RUN:-false}" = "true" ] && DRY=(--dry)
          retry_transient node "$COLAB" release cut --auto ${DRY[@]+"${DRY[@]}"} --json > "$OUT" || rc=$?
          # A verdict is JSON carrying `ok`; anything else is a run that never decided.
          if ! jq -e 'has("ok")' "$OUT" > /dev/null 2>&1; then
            echo "::error::colab release cut produced no verdict (exit $rc)"
            echo "colab release cut produced no verdict (exit $rc) — the reason is in this step's log." >> "$GITHUB_STEP_SUMMARY"
            cat "$OUT"
            exit 1
          fi
          {
            echo "### colab release cut --auto"
            echo
            jq -r '.checks[]? | "- \(if .ok then "✓" else "✗" end) **\(.condition)** — \(.detail)"' "$OUT"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${DRY_RUN:-false}" = "true" ]; then
            # #474: a dry run never hands a tag to the publishing steps, whatever the verdict says.
            echo "Dry run — would cut: $(jq -r '.tag // "nothing"' "$OUT") (created: $(jq -r '.created' "$OUT"))" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$(jq -r '.created' "$OUT")" = "true" ]; then
            TAG="$(jq -r '.tag' "$OUT")"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Cut $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
            # #446: on route deploy-tag-fast the cut IS the final, and the deploy job deploys it in
            # this run (a tag pushed with GITHUB_TOKEN starts no `push: tags` workflow).
            if [ "$(jq -r '.final // false' "$OUT")" = "true" ]; then
              echo "final=$TAG" >> "$GITHUB_OUTPUT"
              echo "health-url=$(jq -r '.deploy.healthUrl // ""' "$OUT")" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$(jq -r '.noop' "$OUT")" = "true" ]; then
            echo "No-op: nothing owed, head already a candidate, inside a declared cadence window, or main's head is not a promotion." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$(jq -r '.ok' "$OUT")" = "true" ]; then
            echo "Verdict ok but nothing created." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            # #467: a refusal no later run clears by itself (no first final, a malformed marker, a
            # wrong manifest) is a STALL — an error annotation and a summary banner, still exit 0: a red
            # release run at main's head would make trunk not-green and refuse the very ship that fixes it.
            STANDING="$(jq -r '(.standing // []) | join(", ")' "$OUT")"
            if [ -n "$STANDING" ]; then
              echo "::error title=Release stalled::colab release cut refused on a condition that does not clear by itself: $(jq -r '. as $v | [$v.checks[]? | select(.ok | not) | select(.condition as $c | any(($v.standing // [])[]; . == $c)) | "\(.condition) — \(.detail)"] | join("; ")' "$OUT")"
              {
                echo "#### ⚠ Release stalled"
                echo
                echo "\`colab release cut --auto\` refused on **$STANDING** — the next run refuses the same way until a human acts (the ✗ rows above say what). The run stays green on purpose, so it never blocks the ship that fixes it."
                echo
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::colab release cut refused: $(jq -r '[.checks[]? | select(.ok | not) | .condition] | join(", ")' "$OUT")"
            fi
          fi

      - name: Finalize the newest clean candidate (colab release finalize --auto)
        id: finalize
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -uo pipefail
          eval "$RETRY_TRANSIENT"
          OUT="$RUNNER_TEMP/finalize.json"
          rc=0
          DRY=(); [ "${DRY_RUN:-false}" = "true" ] && DRY=(--dry)
          retry_transient node "$COLAB" release finalize --auto ${DRY[@]+"${DRY[@]}"} --json > "$OUT" || rc=$?
          if ! jq -e 'has("state")' "$OUT" > /dev/null 2>&1; then
            echo "::error::colab release finalize produced no verdict (exit $rc)"
            echo "colab release finalize produced no verdict (exit $rc) — the reason is in this step's log." >> "$GITHUB_STEP_SUMMARY"
            cat "$OUT"
            exit 1
          fi
          STATE="$(jq -r '.state' "$OUT")"
          # #468: why no final, and every other open candidate with its own reason — the checklist
          # above it is only the picked candidate's, which alone reads as "only the newest counts".
          WHY="$(jq -r '.why.line // empty' "$OUT")"
          {
            echo "### colab release finalize --auto — $STATE"
            echo
            jq -r '.checks[]? | "- \(if .ok then "✓" else "✗" end) **\(.condition)** — \(.detail)"' "$OUT"
            echo
            if [ -n "$WHY" ]; then echo "**Why no final:** $WHY"; echo; fi
            if [ "$(jq -r '(.skipped // []) | length' "$OUT")" != "0" ]; then
              echo "Other open candidates:"
              jq -r '(.skipped // [])[:10][] | "- \(.tag): \(.state)\(if .detail then " — \(.detail)" else "" end)"' "$OUT"
              jq -r '(.skipped // []) | if length > 10 then "- … \(length - 10) more" else empty end' "$OUT"
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "Dry run — finalize: $STATE (would tag: $(jq -r '.finalTag // "nothing"' "$OUT"))" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$(jq -r '.tagged' "$OUT")" = "true" ]; then
            TAG="$(jq -r '.finalTag' "$OUT")"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Finalized $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            case "$STATE" in
              refused|needs-new-candidate|held) echo "::warning::colab release finalize: $STATE${WHY:+ — $WHY}" ;;
              *) echo "Finalize: $STATE${WHY:+ — $WHY}" ;;
            esac
          fi

      # Whether the npm job publishes what this run tagged — `colab release npm` reads the
      # release: block (one reading, the same as cut/finalize). A CLI older than #433 gives no
      # verdict; that is a warning and no npm publish, never a failed release.
      - name: Read the npm target (colab release npm) [publish]
        id: npm-target
        if: env.DRY_RUN != 'true' && (steps.cut.outputs.tag != '' || steps.finalize.outputs.tag != '')
        env:
          TAGS: ${{ steps.cut.outputs.tag }} ${{ steps.finalize.outputs.tag }}
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/npm.json"
          node "$COLAB" release npm --json > "$OUT" 2> /dev/null || true
          if ! jq -e 'has("publish")' "$OUT" > /dev/null 2>&1; then
            echo "::warning::colab release npm gave no verdict (a HANDBOOK_REF older than #433?) — nothing is published to npm"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(jq -r '.publish' "$OUT")" != "true" ]; then
            if [ "$(jq -r '.findings | length' "$OUT")" != "0" ]; then
              echo "::warning::not publishing to npm: $(jq -r '.findings | join("; ")' "$OUT")"
            fi
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "publish=true"
            echo "tags=$(echo $TAGS)"
            echo "dir=$(jq -r '.dir' "$OUT")"
            echo "gate=$(jq -r '.gate' "$OUT")"
            echo "package=$(jq -r '.package' "$OUT")"
          } >> "$GITHUB_OUTPUT"

      # Publishes every tag THIS run created. In this run, never via a tag-push workflow:
      # see "PUBLISHING HAPPENS IN THIS RUN" in the header.
      - name: Publish GitHub Release (same run) [publish]
        if: env.DRY_RUN != 'true' && (steps.cut.outputs.tag != '' || steps.finalize.outputs.tag != '')
        env:
          TAGS: ${{ steps.cut.outputs.tag }} ${{ steps.finalize.outputs.tag }}
        run: |
          set -euo pipefail
          eval "$RETRY_TRANSIENT"
          for TAG in $TAGS; do
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "$TAG already has a Release — skipping"
              continue
            fi
            # Notes since the previous FINAL tag, candidate or final alike — never since an
            # earlier candidate (the same rule as release-tag.yml).
            PREV="$(git describe --tags --abbrev=0 --match 'v*.*.*' --exclude '*-*' "${TAG}^" 2>/dev/null || true)"
            NOTES="$RUNNER_TEMP/notes-$TAG.md"
            if [ -n "$PREV" ]; then
              node "$COLAB" release-notes "${PREV}..${TAG}" --out "$NOTES"
            else
              printf '## %s\n\nFirst release.\n' "$TAG" > "$NOTES"
            fi
            case "$TAG" in
              *-*) KIND=(--prerelease --latest=false) ;;
              *)   KIND=(--latest) ;;
            esac
            # The view above is a check, not a lock: `colab release cut` publishes a candidate's
            # pre-release itself, and the API can still answer 404 for it seconds later (#462 — a
            # trunk went red on exactly that 422). So a create refused because the Release already
            # exists is the skip case too, decided from the create's own answer. That also covers a
            # create the API applied but answered 5xx for: the retry's 422 is that skip (#464).
            ERR="$RUNNER_TEMP/create-$TAG.err"
            if ! retry_transient gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES" --generate-notes "${KIND[@]}" 2> "$ERR"; then
              cat "$ERR" >&2
              if grep -qiE 'already[ _]exists' "$ERR"; then
                echo "$TAG already has a Release (published while this step ran) — skipping"
                continue
              fi
              exit 1
            fi
            echo "Published $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  # ---------------------------------------------------------------------------------------------
  # npm (#433) — publishes what the release job tagged, in this same run. Opt-in: it runs only when
  # .github/project.yml declares release.npm + release.npm-gate on the public-tool route, so a repo
  # without them never gets this job.
  #
  #   candidate vX.Y.Z-rc.N  ->  npm publish --tag next   --provenance
  #   final     vX.Y.Z       ->  npm publish --tag latest --provenance   (latest never moves to an rc)
  #
  # TRUSTED PUBLISHING (OIDC) ONLY. No npm token is stored, read, or offered as a fallback — the
  # job refuses to run with one in its environment. npm ends direct publishing with 2FA-bypass
  # tokens in January 2027; this design never used one. One-time setup on npmjs.com: the package's
  # Settings -> Trusted publishing -> GitHub Actions, this repository, workflow file
  # `release-auto.yml` (the file's name, not its `name:`).
  #
  # GITHUB-HOSTED, ALWAYS. npm trusted publishing does not support self-hosted runners, so this job
  # stays on GitHub-hosted even where `release` above runs self-hosted (free on a public repo — the
  # only kind that publishes here; a private repo is refused outright, #432).
  #
  # IT NEVER MOVES GIT. It checks out the tag, stamps the version from the tag into package.json
  # (the manifest carries none — the tag is the version), runs the gate, publishes. Nothing is
  # committed or pushed. If it fails, the tag stands, `npm-record` writes "tagged, not published"
  # on the Release, and re-running the failed job publishes the existing tag; a version already on
  # npm is skipped, so a re-run never double-publishes.
  npm:
    name: Publish to npm (trusted publishing)
    needs: release
    if: needs.release.outputs.npm == 'true'
    runs-on: ubuntu-latest # NEVER self-hosted: npm trusted publishing does not support it.
    permissions:
      contents: read # check out the tag; read the repository's visibility
      id-token: write # the OIDC token npm exchanges for a one-time publish credential
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAGS: ${{ needs.release.outputs.tags }}
      PKG_DIR: ${{ needs.release.outputs.npm-dir }}
      GATE: ${{ needs.release.outputs.npm-gate }}
      PACKAGE: ${{ needs.release.outputs.npm-package }}
    steps:
      - name: Refuse a private repository, and any npm token
        run: |
          set -uo pipefail
          eval "$RETRY_TRANSIENT"
          # Visibility from the API, never assumed: unknown is refused like private. A transient
          # error on this read is retried (#464) — one 5xx here once turned a trunk red.
          ERR="$RUNNER_TEMP/visibility.err"
          PRIVATE="$(retry_transient gh api "repos/$REPO" --jq '.private' 2> "$ERR")" || PRIVATE=unknown
          if [ "$PRIVATE" != "false" ]; then
            WHY="$(grep -v '^::warning::' "$ERR" 2> /dev/null | tail -n 1)"
            echo "::error::$REPO is private (or its visibility could not be read: $PRIVATE${WHY:+ — $WHY}) — a private repository never publishes to public npm (#432). Remove release.npm, or install from git."
            exit 1
          fi
          if [ -n "${NODE_AUTH_TOKEN:-}${NPM_TOKEN:-}" ]; then
            echo "::error::an npm token is set in this job's environment — this workflow publishes through trusted publishing (OIDC) only and never with a token. Remove it."
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false # nothing here pushes

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24 # no registry-url: that writes an .npmrc expecting a token

      - name: npm new enough for trusted publishing (>= 11.5.1)
        run: |
          set -euo pipefail
          eval "$RETRY_TRANSIENT"
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"; then
            retry_transient npm install --global npm@11
          fi
          npm --version

      # EDIT: a package that needs a build step builds here, BEFORE the gate — the gate measures
      # what ships, and the publish below runs with --ignore-scripts so nothing changes after it.
      - name: Publish each tag (npm publish --provenance)
        run: |
          set -euo pipefail
          eval "$RETRY_TRANSIENT"
          for TAG in $TAGS; do
            VERSION="${TAG#v}"
            case "$VERSION" in
              *-*) DIST=next ;;
              *)   DIST=latest ;;
            esac
            # A 404 is "not published" and answers at once; a transient error is retried first (#464).
            if retry_transient npm view "$PACKAGE@$VERSION" version > /dev/null 2>&1; then
              echo "$PACKAGE@$VERSION is already on npm — skipping" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            git checkout --quiet --force "refs/tags/$TAG"
            git clean -fdxq
            (cd "$PKG_DIR" && npm pkg set "version=$VERSION")
            sh -c "$GATE"
            # The view above is a check, not a lock: a publish the registry applied but answered 5xx
            # for, or one that landed between the view and here, is refused as a republish — the skip
            # case again, decided from the publish's own answer (#464, the same shape as #462).
            ERR="$RUNNER_TEMP/npm-publish-$VERSION.err"
            if ! (cd "$PKG_DIR" && retry_transient npm publish --tag "$DIST" --provenance --access public --ignore-scripts) 2> "$ERR"; then
              cat "$ERR" >&2
              if grep -qiE 'EPUBLISHCONFLICT|cannot publish over (the )?previously published' "$ERR"; then
                echo "$PACKAGE@$VERSION is already on npm (published while this step ran) — skipping" | tee -a "$GITHUB_STEP_SUMMARY"
                continue
              fi
              exit 1
            fi
            echo "Published $PACKAGE@$VERSION to npm (dist-tag $DIST)" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  # Writes the npm outcome onto each GitHub Release the run published, replacing its own earlier
  # line on a re-run: "published" once it is, "tagged, not published" with the re-run hint until then.
  npm-record:
    name: Record the npm outcome on the Release
    needs: [release, npm]
    if: always() && needs.release.outputs.npm == 'true'
    # EDIT: the same label as `release` above — PRIVATE repo → self-hosted (RUNNERS, above).
    runs-on: ubuntu-latest
    permissions:
      contents: write # edit the Release notes
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAGS: ${{ needs.release.outputs.tags }}
      PACKAGE: ${{ needs.release.outputs.npm-package }}
      RESULT: ${{ needs.npm.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Record the npm outcome
        run: |
          set -euo pipefail
          eval "$RETRY_TRANSIENT"
          for TAG in $TAGS; do
            ERR="$RUNNER_TEMP/record-$TAG.err"
            BODY="$(retry_transient gh release view "$TAG" --repo "$REPO" --json body --jq '.body' 2> "$ERR")" || {
              # Only a Release that is not there is nothing to record on; a read that kept failing is a failure.
              if grep -qiE 'release not found|HTTP 404|Not Found' "$ERR"; then
                echo "$TAG has no Release — nothing to record on"
                continue
              fi
              cat "$ERR" >&2
              exit 1
            }
            VERSION="${TAG#v}"
            case "$VERSION" in *-*) DIST=next ;; *) DIST=latest ;; esac
            if [ "$RESULT" = "success" ]; then
              LINE="npm: published \`$PACKAGE@$VERSION\` (dist-tag \`$DIST\`)."
            else
              LINE="**npm: tagged, not published** (\`$PACKAGE@$VERSION\`, job $RESULT). Re-run the failed \`npm\` job of $RUN_URL — it publishes this existing tag; nothing in git moves."
            fi
            NOTES="$RUNNER_TEMP/notes-$TAG.md"
            printf '%s\n' "$BODY" | sed '/^<!-- colab:npm -->$/,/^<!-- \/colab:npm -->$/d' > "$NOTES"
            printf '\n<!-- colab:npm -->\n%s\n<!-- /colab:npm -->\n' "$LINE" >> "$NOTES"
            # Idempotent: the block between the colab:npm markers is replaced, never appended twice.
            retry_transient gh release edit "$TAG" --repo "$REPO" --notes-file "$NOTES" > /dev/null
            echo "$TAG: $LINE" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  # ---------------------------------------------------------------------------------------------
  # deploy (#446) — route deploy-tag-fast only: deploys the final the release job just tagged, in
  # this same run, then verifies it. Skipped on every other route (deploy-tag stays empty).
  #
  # Same run, never a tag-triggered deploy workflow: a tag pushed with GITHUB_TOKEN starts no
  # `push: tags` run, so a separate deploy-on-tag workflow would never fire for this final.
  #
  # The health check is the handbook's half of the "health-gated deploy with automatic rollback"
  # the route requires: it fails this job when release.health-url does not report the version in
  # time. The ROLLBACK is your deploy's own (release.rollback: auto is your statement that it has
  # one) — this job does not roll anything back. A failed deploy leaves the tag standing and this
  # run red; fix forward, or re-run the failed job to deploy the same tag again.
  deploy:
    name: Deploy the final (deploy-tag-fast)
    needs: release
    if: needs.release.outputs.deploy-tag != ''
    runs-on: ubuntu-latest # EDIT: the runner your deploy needs — self-hosted on a PRIVATE repo (RUNNERS, above).
    environment: production # EDIT: the GitHub environment holding your deploy secrets, or remove.
    permissions:
      contents: read # check out the tag
    env:
      TAG: ${{ needs.release.outputs.deploy-tag }}
      HEALTH_URL: ${{ needs.release.outputs.health-url }}
      HEALTH_TIMEOUT_SECONDS: "600" # EDIT: how long the new version may take to report itself.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: refs/tags/${{ needs.release.outputs.deploy-tag }}
          persist-credentials: false # nothing here pushes

      # EDIT: replace this step's body with your deploy of "$TAG" (an image push + rollout, an
      # SSH script, a platform CLI). It must roll back by itself when the new version fails its
      # health check — that is what release.rollback: auto declares. Until edited it fails, so a
      # final is never reported deployed when nothing deployed it.
      - name: Deploy the final (EDIT)
        run: |
          set -euo pipefail
          echo "::error::the deploy step of release-auto.yml was never edited — $TAG is tagged and published but NOT deployed. Replace this step with your deploy (templates/release-auto.yml, DEPLOYING IN THIS RUN)."
          exit 1

      - name: Verify the health endpoint reports the final
        run: |
          set -uo pipefail
          VERSION="${TAG#v}"
          # Boundary-aware, the same rule as deploy-container-run.mjs `reportsVersion` (#459): the
          # version (optionally `v`-prefixed) must not touch a digit or `.` before it, nor a digit or
          # `.`+digit after it — so 1.2.1 never matches 1.2.10, 11.2.1 or 1.2.1.4. A substring
          # `case` match accepted all three. grep is line-based; a newline is neither, so it agrees.
          PATTERN="(^|[^0-9.])v?${VERSION//./\\.}([^0-9.]|\\.([^0-9]|\$)|\$)"
          DEADLINE=$(( $(date +%s) + HEALTH_TIMEOUT_SECONDS ))
          while :; do
            BODY="$(curl -fsS --max-time 10 "$HEALTH_URL" 2> /dev/null || true)"
            if printf '%s\n' "$BODY" | grep -Eq -- "$PATTERN"; then
              echo "$HEALTH_URL reports $VERSION — $TAG is live" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::$HEALTH_URL did not report $VERSION within ${HEALTH_TIMEOUT_SECONDS}s — the deploy's own rollback should have restored the previous version; $TAG stays tagged"
              exit 1
            fi
            sleep 10
          done

  # ON deploy-container.yml (#452): replace the whole `deploy` job above with this one. It calls the
  # same workflow a human-pushed final runs (`push: tags`), so the fast route and route deploy-tag
  # share ONE deploy path — build once, run exactly the tag, verify release.health-url, roll back.
  # Commented because a live `uses:` of a file your repo does not have breaks this workflow.
  # A reusable workflow's permissions are capped by the calling job's, hence the three below.
  #
  # deploy:
  #   name: Deploy the final (deploy-tag-fast)
  #   needs: release
  #   if: needs.release.outputs.deploy-tag != ''
  #   permissions:
  #     contents: read
  #     packages: write
  #     issues: write
  #   uses: ./.github/workflows/deploy-container.yml
  #   with:
  #     tag: ${{ needs.release.outputs.deploy-tag }}
  #     health-url: ${{ needs.release.outputs.health-url }}
  #   secrets: inherit
