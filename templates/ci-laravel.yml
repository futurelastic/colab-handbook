# CI (Laravel) — TEMPLATE. Copy me into your repo at .github/workflows/ci.yml.
#
# This is a starting point, not a dependency. Once you copy it, YOU OWN THIS FILE.
# Edit it freely: rename jobs, add steps, drop the parts you do not need. Nothing
# calls this file remotely and nothing will update it for you — divergence between
# your copy and the handbook is expected and fine. If you find an improvement worth
# sharing, change the handbook template too, but that is a manual, deliberate act.
#
# EDIT POINTS are marked `# EDIT:` — walk them once after copying.
#
# For: Laravel + Inertia + React + Vite fullstack apps with a route/type codegen step.
#
# Two things here are NOT optional, and are the whole reason this is separate from
# ci-node.yml:
#
#   1. THE SQLITE BOOTSTRAP. The Vite build runs the Laravel wayfinder plugin, which
#      shells out to `php artisan wayfinder:generate`. That means the application must
#      actually BOOT on the runner. Our .env.example files ship DB_CONNECTION=mysql,
#      so without an override artisan tries to reach a MySQL server that does not
#      exist on the runner and the build dies. We copy .env.example, rewrite the
#      connection to sqlite, touch an empty database file, and generate a throwaway
#      APP_KEY. This .env is disposable and never leaves the runner.
#
#   2. RUNNING WAYFINDER EXPLICITLY, before Vite. The Vite plugin swallows stderr and
#      reports only "Command failed", which is unusable for debugging. Running the
#      artisan command ourselves first means a codegen failure shows its real error.
#
# A third job, `migrations`, round-trips the schema (migrate -> rollback -> migrate)
# on the TEST engine (sqlite) AND the DEPLOY engine (a MariaDB/MySQL service
# container). Every case below was measured, and the engines disagree on several of
# them — so either engine alone passes a migration the other refuses:
#
#   - A down() whose statements sqlite cannot run: only the sqlite leg goes red —
#     and only if down() is ever executed, which nothing else in CI does.
#   - A down() that does not undo its up(): the schema after the second migrate
#     differs from the first, on either leg.
#   - NOT NULL without a default: sqlite refuses the ALTER when the table holds
#     rows; MariaDB accepts it and silently fills '' into every existing row. Only
#     the sqlite leg goes red.
#   - A foreign key added over orphan rows, ->change() silently dropping a modifier
#     it did not restate (nullable, default, unsigned), lossy numeric conversion:
#     the deploy engine's strict mode refuses these. sqlite catches some of them
#     too, through its table rebuild — never count on it for the rest.
#
# The last two bullets fire ONLY when rows exist — on an empty table every one of
# them passes on both engines. Set ROUNDTRIP_SEEDER below, or they go unchecked.
#
# Not gated on RUN_TESTS: a bad migration is cheapest to fix on the branch that adds
# it, so this runs on every push, not only on main.

name: CI

on:
  push:
    # Every branch, not only trunk (#384). Sessions push branches without opening a
    # PR, so a trunk-only trigger leaves a candidate with no run of its own before the
    # merge: its first run is the post-merge trunk run, and a red there is everyone's
    # TRUNK RED instead of one implementer's hand-back (CONVENTIONS.md §4, "Branch
    # CI"). '**' also covers `ship-batch/**`, the batch-landing opt-in.
    #
    # EDIT: on ONE self-hosted agent shared with trunk, go back to trunk-only until
    # trunk has its own lane — branch runs queue ahead of the one trunk run a merge
    # waits for (CONVENTIONS.md §7, "Self-hosted runners", #355). GitHub-hosted
    # runners, a runner pool, or a trunk-only label picked in `runs-on` on
    # github.ref all have that capacity; keep '**' there. Trunk-only means the
    # branches this repo actually has — and never drop `dev` on a Tier A or C repo:
    # dev is the trunk, so a main-only trigger runs zero checks on the branch you
    # merge into, and nothing looks broken (CONVENTIONS.md §7).
    branches: ['**']
  pull_request:
    # EDIT: keep only the branches this repo actually has (Tier A and C: dev is the
    # trunk, main the release; Tier B: main only).
    branches: [main, dev]
  # A promotion pushed by the release workflow's token triggers no push run, so that workflow
  # dispatches this one on main instead (templates/release-auto.yml, #440). Harmless elsewhere.
  workflow_dispatch:

# One live run per branch: a new push cancels the superseded run on the same ref.
# Trunk is NEVER cancelled — every trunk sha keeps a completed run of its own, which
# is what the merge gate reads (CONVENTIONS.md §4, "Branch CI"). Pull-request runs
# group under refs/pull/<n>/merge, apart from the branch's push runs.
# EDIT: name exactly this repo's trunk (and release branch) here. A Tier C trunk
# may carry any name; one left off this list gets its trunk runs cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

env:
  # Light CI on the dev trunk (does it build at all, ~2 min); heavy CI on main, where
  # the Pest suite gates a release. On Tier C main IS production — promotion is the
  # deploy — so this suite is the last gate before users, not a release formality.
  # EDIT: set to a literal 'true' if this repo is Tier B (main is trunk) and you
  # always want the suite.
  RUN_TESTS: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
  # EDIT: bump deliberately, not automatically.
  GITLEAKS_VERSION: "8.30.1"
  # EDIT: match the app's APP_NAME. Leave empty if the build does not read it.
  VITE_APP_NAME: ""
  # EDIT: arguments passed to `php artisan wayfinder:generate`.
  WAYFINDER_ARGS: "--with-form"

# Self-hosted runner? The job layout below assumes GitHub-hosted capacity — a
# fresh machine per job. With few self-hosted agents every job is a queue slot,
# jobs from different runs interleave, and trunk can wait behind branch runs.
# Read CONVENTIONS.md §7, "Self-hosted runners", before choosing a label.
jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest # EDIT: self-hosted label if this repo needs one.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Full history: scan the commit log, not only the current tree.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned release binary)
        run: |
          # NOT gitleaks/gitleaks-action@v2 — it demands a paid GITLEAKS_LICENSE for
          # organization-owned repositories. The plain release binary is MIT.
          # Resolve OS/arch from uname — a hardcoded linux_x64 binary on a macOS
          # self-hosted runner cannot exec, and fails as a bare exit 126.
          case "$(uname -s)" in
            Darwin) os=darwin ;;
            Linux)  os=linux ;;
            *) echo "unsupported OS: $(uname -s)" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            arm64|aarch64) arch=arm64 ;;
            x86_64|amd64)  arch=x64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${os}_${arch}.tar.gz"
          # Into $RUNNER_TEMP, not /usr/local/bin: no sudo, no global write — the same
          # step then works on BOTH GitHub-hosted and shared self-hosted runners
          # (a shared runner is infrastructure; jobs must not mutate it).
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          rm -f gitleaks.tar.gz

      - name: gitleaks detect
        run: gitleaks detect --source . --no-banner

  build:
    name: Build (Laravel + Vite)
    runs-on: ubuntu-latest # EDIT: self-hosted label if this repo needs one.
    # Re-exported so the migrations job below resolves PHP exactly once, here.
    outputs:
      php-version: ${{ steps.toolchain.outputs.php-version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # ---------------------------------------------------------------------------
      # Toolchain resolution. Precedence, highest first:
      #   PHP :  1. .github/project.yml -> php:      2. composer.json -> require.php
      #   Node:  1. .github/project.yml -> node:     2. .nvmrc, else package.json engines.node
      #   ...and if neither declares it, FAIL.
      #
      # There is deliberately NO fallback default. A silent default is exactly how a
      # repo here ended up building on Node 20 in CI while deploying on Node 22 —
      # CI was green and proved nothing about what actually shipped. Keep these equal
      # to what the deploy target runs, or CI proves nothing.
      # ---------------------------------------------------------------------------
      - name: Resolve toolchain versions
        id: toolchain
        run: |
          set -euo pipefail

          # "^8.3" / ">=22.1" / "v22" / "8.4.*" -> "8.3" / "22.1" / "22" / "8.4"
          normalise() {
            printf '%s' "$1" \
              | tr -d '"' \
              | sed -E 's/^[^0-9]*//' \
              | sed -E 's/[[:space:]].*$//' \
              | sed -E 's/\.(x|\*)$//' \
              | sed -E 's/[^0-9.].*$//' \
              | sed -E 's/\.$//'
          }

          # Read a flat `key: value` out of .github/project.yml. That file is a
          # handful of top-level keys by design, so this is sufficient.
          from_project_yml() {
            [ -f .github/project.yml ] || return 0
            sed -nE "s/^[[:space:]]*$1:[[:space:]]*\"?([^\"#[:space:]]+)\"?.*/\1/p" .github/project.yml | head -1
          }

          # --- PHP ---------------------------------------------------------------
          PHP_VERSION=""; PHP_SOURCE=""
          V="$(from_project_yml php || true)"
          if [ -n "$V" ] && [ "$V" != "null" ]; then
            PHP_VERSION="$(normalise "$V")"; PHP_SOURCE=".github/project.yml (php:)"
          fi
          if [ -z "$PHP_VERSION" ] && [ -f composer.json ]; then
            V=""
            if command -v php >/dev/null 2>&1; then
              V="$(php -r '$c=json_decode(file_get_contents("composer.json"),true); echo $c["require"]["php"] ?? "";' || true)"
            elif command -v python3 >/dev/null 2>&1; then
              V="$(python3 -c "import json;print((json.load(open('composer.json')).get('require') or {}).get('php') or '')" || true)"
            elif command -v node >/dev/null 2>&1; then
              V="$(node -e "try{const r=require('./composer.json').require||{};process.stdout.write(String(r.php||''))}catch(_){}" || true)"
            fi
            if [ -n "$V" ]; then
              PHP_VERSION="$(normalise "$V")"; PHP_SOURCE="composer.json (require.php)"
            fi
          fi
          if [ -z "$PHP_VERSION" ]; then
            echo "::error::No PHP version is declared in this repository, and this workflow refuses to guess one."
            {
              echo "Declare it in ONE of:"
              echo "  1. .github/project.yml  ->  php: \"8.4\"   (preferred)"
              echo "  2. composer.json        ->  \"require\": { \"php\": \"^8.4\" }"
              echo "Use the version the DEPLOY target runs."
            } >&2
            exit 1
          fi

          # --- Node --------------------------------------------------------------
          NODE_VERSION=""; NODE_SOURCE=""
          V="$(from_project_yml node || true)"
          if [ -n "$V" ] && [ "$V" != "null" ]; then
            NODE_VERSION="$(normalise "$V")"; NODE_SOURCE=".github/project.yml (node:)"
          fi
          if [ -z "$NODE_VERSION" ] && [ -f .nvmrc ]; then
            V="$(grep -vE '^[[:space:]]*(#|$)' .nvmrc | head -1 | tr -d '[:space:]' || true)"
            if [ -n "$V" ]; then
              NODE_VERSION="$(normalise "$V")"; NODE_SOURCE=".nvmrc"
            fi
          fi
          if [ -z "$NODE_VERSION" ] && [ -f package.json ]; then
            V=""
            if command -v node >/dev/null 2>&1; then
              V="$(node -e "try{const e=require('./package.json').engines||{};process.stdout.write(String(e.node||''))}catch(_){}" || true)"
            elif command -v python3 >/dev/null 2>&1; then
              V="$(python3 -c "import json;print((json.load(open('package.json')).get('engines') or {}).get('node') or '')" || true)"
            fi
            if [ -n "$V" ]; then
              NODE_VERSION="$(normalise "$V")"; NODE_SOURCE="package.json (engines.node)"
            fi
          fi
          if [ -z "$NODE_VERSION" ]; then
            echo "::error::No Node version is declared in this repository, and this workflow refuses to guess one."
            {
              echo "Declare it in ONE of:"
              echo "  1. .github/project.yml  ->  node: \"22\"   (preferred)"
              echo "  2. .nvmrc  ->  22        or  package.json -> \"engines\": { \"node\": \">=22\" }"
              echo "Use the version the DEPLOY target runs."
            } >&2
            exit 1
          fi

          echo "php-version=$PHP_VERSION"   >> "$GITHUB_OUTPUT"
          echo "node-version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "PHP $PHP_VERSION (from: $PHP_SOURCE) / Node $NODE_VERSION (from: $NODE_SOURCE)"
          {
            echo "PHP **$PHP_VERSION** — resolved from \`$PHP_SOURCE\`"
            echo ""
            echo "Node **$NODE_VERSION** — resolved from \`$NODE_SOURCE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.toolchain.outputs.php-version }}
          # sqlite3 + pdo_sqlite are what the throwaway bootstrap below runs on.
          extensions: mbstring, sqlite3, pdo_sqlite, bcmath, intl # EDIT: add what this app needs.
          coverage: none

      - name: Composer install
        run: |
          # --no-scripts: the post-autoload-dump hook runs `package:discover`, which
          # boots the app — and the app cannot boot until the .env below exists.
          # Dev dependencies are installed only when the Pest suite will run; a build-
          # only job does not need them (wayfinder lives in require, not require-dev).
          if [ "$RUN_TESTS" = "true" ]; then
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts
          else
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts
          fi

      - name: Prepare throwaway env for build-time codegen (wayfinder)
        run: |
          # See the header: .env.example ships DB_CONNECTION=mysql, but there is no
          # MySQL on the runner. Rewrite to sqlite against an empty file so artisan
          # boots. This .env is disposable — deploy workflows rsync with --exclude
          # '.env', so it can never reach a server.
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan package:discover --ansi

          echo "=== PHP version on runner ==="
          php -v

          echo "=== wayfinder:generate (stderr visible) ==="
          # Run it here rather than letting the Vite plugin invoke it: the plugin hides
          # stderr and reports only "Command failed".
          php artisan wayfinder:generate $WAYFINDER_ARGS

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      - name: Build frontend assets (Vite)
        run: |
          npm ci
          npm run build

      - name: Run migrations against sqlite
        if: env.RUN_TESTS == 'true'
        run: |
          # Migrations must apply cleanly from zero. This is the cheapest way to catch
          # a migration that only works against an already-populated database.
          php artisan migrate --force

      - name: Test (Pest)
        if: env.RUN_TESTS == 'true'
        run: |
          if [ -f vendor/bin/pest ]; then
            vendor/bin/pest --ci
          elif [ -f vendor/bin/phpunit ]; then
            echo "::notice::No Pest binary — falling back to PHPUnit."
            vendor/bin/phpunit
          else
            echo "::error::RUN_TESTS is true but neither vendor/bin/pest nor vendor/bin/phpunit exists. Add a test runner, or set RUN_TESTS: false."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Migration round-trip — see the header for what each engine catches.
  #
  #   1. migrate            from zero                                (schema snapshot A)
  #   2. migrate:rollback   the migrations THIS change adds — every down() among them
  #                         runs (all migrations when the change adds none)
  #   3. seed               only if ROUNDTRIP_SEEDER is set, and only when the change
  #                         adds migrations: rows land at the PRE-change schema
  #   4. migrate            again — the new migrations land on those rows (snapshot B)
  #   5. compare            B must equal A — a down() that does not exactly undo its
  #                         up() leaves a schema that differs on the second pass
  #
  # Steps 2-4 are the shape of a real deploy: new migrations landing on tables that
  # already hold rows written before they existed. That is why the seed sits BETWEEN
  # the rollback and the second migrate — rows seeded after the new migrations would
  # already satisfy them (a NOT NULL column filled, a narrowed number in range) and
  # every data-dependent trap would pass.
  # ---------------------------------------------------------------------------
  migrations:
    name: Migration round-trip (${{ matrix.engine }})
    needs: build
    runs-on: ubuntu-latest # EDIT: self-hosted label if this repo needs one.
    strategy:
      fail-fast: false
      matrix:
        # EDIT: one row for the engine the tests run on, one for the engine PRODUCTION
        # runs on, at production's exact version. Deploy engine is sqlite too? Delete
        # the server row. MySQL, not MariaDB? Swap in the commented row. A server row
        # whose version differs from production proves nothing about production.
        include:
          - engine: sqlite
            connection: sqlite
            image: ''            # empty image = no service container for this row
            health: 'true'
          - engine: mariadb
            connection: mariadb  # Laravel 11+; use `mysql` on older frameworks
            image: mariadb:11.4  # EDIT: the version the deploy target runs
            health: healthcheck.sh --connect --innodb_initialized
          # - engine: mysql
          #   connection: mysql
          #   image: mysql:8.4   # EDIT: the version the deploy target runs
          #   health: mysqladmin ping -h 127.0.0.1 -proot
    services:
      db:
        image: ${{ matrix.image }}
        env:
          # A disposable server inside one job; this password never leaves the runner.
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: roundtrip
        # Container port only, no fixed host port: a shared self-hosted runner may
        # already listen on 3306 (README, "Self-hosted patterns"). The host port is
        # read back from job.services below.
        ports:
          - 3306
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      # EDIT: a seeder class that leaves REPRESENTATIVE rows — NULLs where a column
      # allows them, rows a new foreign key would orphan, numbers near a column's
      # limits. Empty = no seeding, and the data-dependent traps in the header pass.
      # It runs against the schema BEFORE this change, so it writes the way old data
      # looks: raw DB::table() inserts into long-lived columns, not factories that
      # fill whatever columns the models know about today.
      ROUNDTRIP_SEEDER: ""
      # EDIT: where this repo keeps migrations.
      MIGRATIONS_PATH: database/migrations
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Full history: step 3 counts the migrations this change adds against trunk.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.build.outputs.php-version }}
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_mysql, bcmath, intl # EDIT: add what this app needs.
          coverage: none

      - name: Composer install
        # Dev dependencies included: seeders usually build rows through factories.
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Point the app at this row's engine
        env:
          ENGINE: ${{ matrix.engine }}
          CONNECTION: ${{ matrix.connection }}
          DB_SERVICE_PORT: ${{ job.services.db.ports['3306'] }}
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate --force
          # Real environment variables win over .env (Laravel loads it immutably), so
          # the connection is set here rather than by rewriting .env.example's lines.
          # DB_URL is blanked: when set, it overrides every DB_* below.
          {
            echo "DB_CONNECTION=$CONNECTION"
            echo "DB_URL="
          } >> "$GITHUB_ENV"
          if [ "$ENGINE" = sqlite ]; then
            : > database/roundtrip.sqlite   # truncate: a reused workspace must still start from zero
            echo "DB_DATABASE=$PWD/database/roundtrip.sqlite" >> "$GITHUB_ENV"
          else
            {
              echo "DB_HOST=127.0.0.1"
              echo "DB_PORT=$DB_SERVICE_PORT"
              echo "DB_DATABASE=roundtrip"
              echo "DB_USERNAME=root"
              echo "DB_PASSWORD=root"
            } >> "$GITHUB_ENV"
          fi

      - name: Discover packages
        run: php artisan package:discover --ansi

      - name: Count the migrations this change adds
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Trunk from .github/project.yml, else the repo's default branch. A pull
          # request compares against its own base instead.
          trunk="$(sed -nE 's/^trunk:[[:space:]]*"?([^"#[:space:]]+)"?.*/\1/p' .github/project.yml 2>/dev/null | head -1 || true)"
          base_ref="origin/${GITHUB_BASE_REF:-${trunk:-$DEFAULT_BRANCH}}"
          base=""
          if git rev-parse -q --verify "$base_ref" >/dev/null; then
            base="$(git merge-base HEAD "$base_ref")"
            # On trunk itself the merge-base is HEAD: judge the commit that just landed.
            if [ "$base" = "$(git rev-parse HEAD)" ]; then
              base="$(git rev-parse -q --verify 'HEAD^' || true)"
            fi
          fi
          steps=0
          if [ -n "$base" ]; then
            steps="$(git diff --name-only --diff-filter=A "$base" HEAD -- "$MIGRATIONS_PATH" | grep -c '\.php$' || true)"
          fi
          echo "ROLLBACK_STEPS=$steps" >> "$GITHUB_ENV"
          if [ "$steps" -gt 0 ]; then
            echo "This change adds $steps migration(s) (vs ${base_ref}); step 3 rolls back exactly those."
          else
            echo "This change adds no migrations (vs ${base_ref:-nothing}); step 3 rolls back all of them."
          fi

      - name: Write the schema snapshot script
        run: |
          # Tables, columns, indexes and foreign keys through the framework's own schema
          # builder (Laravel 11+), so the same script reads sqlite and MariaDB/MySQL and
          # needs no mysqldump/sqlite3 client on the runner. The migrations table is
          # left out: its batch numbers differ between passes by design.
          cat > "$RUNNER_TEMP/schema-snapshot.php" <<'PHP'
          <?php
          require getcwd() . '/vendor/autoload.php';
          $app = require getcwd() . '/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $schema = Illuminate\Support\Facades\Schema::connection(null);
          $m = config('database.migrations');
          $skip = is_array($m) ? ($m['table'] ?? 'migrations') : ($m ?: 'migrations');
          $current = method_exists($schema, 'getCurrentSchemaName') ? $schema->getCurrentSchemaName() : null;
          $out = [];
          foreach ($schema->getTables() as $t) {
              $name = $t['name'];
              if ($name === $skip || str_starts_with($name, 'sqlite_')) continue;
              if ($current !== null && isset($t['schema']) && $t['schema'] !== $current) continue;
              $idx = $schema->getIndexes($name);
              usort($idx, fn ($a, $b) => strcmp($a['name'], $b['name']));
              $fks = $schema->getForeignKeys($name);
              usort($fks, fn ($a, $b) => strcmp(json_encode($a), json_encode($b)));
              $out[$name] = ['columns' => $schema->getColumns($name), 'indexes' => $idx, 'foreign_keys' => $fks];
          }
          ksort($out);
          echo json_encode($out, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), "\n";
          PHP

      - name: 1. migrate from zero
        run: |
          php artisan migrate --force
          php "$RUNNER_TEMP/schema-snapshot.php" > "$RUNNER_TEMP/schema-a.json"

      - name: 2. roll back
        run: |
          if [ "$ROLLBACK_STEPS" -gt 0 ]; then
            php artisan migrate:rollback --step="$ROLLBACK_STEPS" --force
          else
            # Everything ran in one batch at step 1, so this rolls all of it back.
            php artisan migrate:rollback --force
          fi

      - name: 3. seed rows at the pre-change schema
        # No new migrations = nothing lands on the rows, and the schema is empty anyway.
        if: env.ROUNDTRIP_SEEDER != '' && env.ROLLBACK_STEPS != '0'
        run: php artisan db:seed --class="$ROUNDTRIP_SEEDER" --force

      - name: 4. migrate again
        run: |
          php artisan migrate --force
          php "$RUNNER_TEMP/schema-snapshot.php" > "$RUNNER_TEMP/schema-b.json"

      - name: 5. the second pass must leave the same schema as the first
        run: |
          if ! diff -u "$RUNNER_TEMP/schema-a.json" "$RUNNER_TEMP/schema-b.json"; then
            echo "::error::Schema after rollback + re-migrate differs from the first migrate (${{ matrix.engine }}). A down() does not exactly undo its up(); the diff above shows what the second pass left different."
            exit 1
          fi
          echo "Round-trip clean on ${{ matrix.engine }}."
