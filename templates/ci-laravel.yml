# CI (Laravel) — TEMPLATE. Copy me into your repo at .github/workflows/ci.yml.
#
# This is a starting point, not a dependency. Once you copy it, YOU OWN THIS FILE.
# Edit it freely: rename jobs, add steps, drop the parts you do not need. Nothing
# calls this file remotely and nothing will update it for you — divergence between
# your copy and the handbook is expected and fine. If you find an improvement worth
# sharing, change the handbook template too, but that is a manual, deliberate act.
#
# EDIT POINTS are marked `# EDIT:` — walk them once after copying.
#
# For: Laravel + Inertia + React + Vite fullstack apps with a route/type codegen step.
#
# Two things here are NOT optional, and are the whole reason this is separate from
# ci-node.yml:
#
#   1. THE SQLITE BOOTSTRAP. The Vite build runs the Laravel wayfinder plugin, which
#      shells out to `php artisan wayfinder:generate`. That means the application must
#      actually BOOT on the runner. Our .env.example files ship DB_CONNECTION=mysql,
#      so without an override artisan tries to reach a MySQL server that does not
#      exist on the runner and the build dies. We copy .env.example, rewrite the
#      connection to sqlite, touch an empty database file, and generate a throwaway
#      APP_KEY. This .env is disposable and never leaves the runner.
#
#   2. RUNNING WAYFINDER EXPLICITLY, before Vite. The Vite plugin swallows stderr and
#      reports only "Command failed", which is unusable for debugging. Running the
#      artisan command ourselves first means a codegen failure shows its real error.
#
# A third job, `migrations`, round-trips the schema (migrate -> rollback -> migrate)
# on the TEST engine (sqlite) AND the DEPLOY engine (a MariaDB/MySQL service
# container). Every case below was measured, and the engines disagree on several of
# them — so either engine alone passes a migration the other refuses:
#
#   - A down() whose statements sqlite cannot run: only the sqlite leg goes red —
#     and only if down() is ever executed, which nothing else in CI does.
#   - A down() that does not undo its up(): the schema after the second migrate
#     differs from the first, on either leg.
#   - NOT NULL without a default: sqlite refuses the ALTER when the table holds
#     rows; MariaDB accepts it and silently fills '' into every existing row. Only
#     the sqlite leg goes red.
#   - A foreign key added over orphan rows, ->change() silently dropping a modifier
#     it did not restate (nullable, default, unsigned), lossy numeric conversion:
#     the deploy engine's strict mode refuses these. sqlite catches some of them
#     too, through its table rebuild — never count on it for the rest.
#
# The last two bullets fire ONLY when rows exist — on an empty table every one of
# them passes on both engines. Set ROUNDTRIP_SEEDER below, or they go unchecked.
#
# Not gated on RUN_TESTS: a bad migration is cheapest to fix on the branch that adds or
# modifies it, so this runs on every push, not only on main.

name: CI

on:
  push:
    # Every branch, not only trunk (#384). Sessions push branches without opening a
    # PR, so a trunk-only trigger leaves a candidate with no run of its own before the
    # merge: its first run is the post-merge trunk run, and a red there is everyone's
    # TRUNK RED instead of one implementer's hand-back (CONVENTIONS.md §4, "Branch
    # CI"). '**' also covers `ship-batch/**`, the batch-landing opt-in.
    #
    # EDIT: on ONE self-hosted agent shared with trunk, go back to trunk-only until
    # trunk has its own lane — branch runs queue ahead of the one trunk run a merge
    # waits for (CONVENTIONS.md §7, "Self-hosted runners", #355). GitHub-hosted
    # runners, a runner pool, or a trunk-only label picked in `runs-on` on
    # github.ref all have that capacity; keep '**' there. Trunk-only means the
    # branches this repo actually has — and never drop `dev` on a Tier A or C repo:
    # dev is the trunk, so a main-only trigger runs zero checks on the branch you
    # merge into, and nothing looks broken (CONVENTIONS.md §7).
    branches: ['**']
  # No `pull_request:` here (#512). A branch with an open PR in this repository already
  # has a push run at the same head, and a `pull_request` run beside it doubled the CI
  # per commit while testing a merge ref instead of the sha that lands. Readers keep only
  # the newest run per workflow at a sha, so that second run also decided the verdict.
  # EDIT: a copy that went back to trunk-only push (above) has no run on a branch until it
  # has a PR — restore `pull_request: branches: [<trunk>]` there; that PR run is then its
  # only branch run (CONVENTIONS.md §4, "Branch CI"), so also delete the fork-PR term
  # (`github.event_name != 'pull_request' || …`) from every job's `if:` below, or it skips that run.
  # EDIT: fork PRs (#514). A push to a fork never runs a workflow here, so a repo that takes
  # PRs from forks needs `pull_request`. Uncomment it there. Every suite job below already
  # carries `github.event.pull_request.head.repo.full_name != github.repository` for a PR
  # event, so a same-repo PR's run skips every job (its push run is the one that tests) and a
  # fork PR's run tests. A skipped run never stands for a workflow that has a run that ran
  # (CONVENTIONS.md §4, "Branch CI"). Check every reader of your CI agrees before you uncomment.
  # pull_request:
  #   branches: ['**']
  # A promotion pushed by the release workflow's token triggers no push run, so that workflow
  # dispatches this one on main instead (templates/release-auto.yml, #440). Harmless elsewhere.
  workflow_dispatch:

# One live run per branch: a new push cancels the superseded run on the same ref.
# Trunk is NEVER cancelled — every trunk sha keeps a completed run of its own, which
# is what the merge gate reads (CONVENTIONS.md §4, "Branch CI"). A trunk run also gets a
# group of its own (the run id): GitHub cancels an older run that is still PENDING in a
# group even when cancel-in-progress is false, so a third quick merge would otherwise
# drop the second one's run before it ever started (#512).
# EDIT: name exactly this repo's trunk (and release branch) here — in the group, in
# cancel-in-progress, and in the `dedupe` job's `if:`. A Tier C trunk may carry any
# name; one left off this list gets its trunk runs cancelled. `colab template` writes these
# from the `trunk:` in .github/project.yml and prints what it wrote (#526).
concurrency:
  group: ci-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

env:
  # Whether the Pest suite runs. 'auto' is decided by the "Decide the test tier" step in
  # `build` (#512). Light CI on a dev trunk and its branches (does it build at all,
  # ~2 min); heavy CI on main, where the Pest suite gates a release. On Tier C main IS
  # production — promotion is the deploy — so this suite is the last gate before users,
  # not a release formality. When main is the trunk (Tier B) every branch push runs the
  # suite too: this workflow has no `pull_request` run any more, and that run used to be
  # the only place a Tier B branch got its tests.
  # EDIT: set to a literal 'true' to always run the suite, 'false' to never run it.
  RUN_TESTS: auto
  # EDIT: bump deliberately, not automatically.
  GITLEAKS_VERSION: "8.30.1"
  # EDIT: match the app's APP_NAME. Leave empty if the build does not read it.
  VITE_APP_NAME: ""
  # EDIT: arguments passed to `php artisan wayfinder:generate`.
  WAYFINDER_ARGS: "--with-form"

# Self-hosted runner? The job layout below assumes GitHub-hosted capacity — a
# fresh machine per job. With few self-hosted agents every job is a queue slot,
# jobs from different runs interleave, and trunk can wait behind branch runs.
# Read CONVENTIONS.md §7, "Self-hosted runners", before choosing a label.
jobs:
  # Already tested at this sha? (#418) — the claim push.
  # A session's claim pushes its branch at the moment it is cut (CONVENTIONS.md §5, the
  # claim record), so the branch's first push sits on a sha trunk has usually already
  # run. Without this job that push re-runs the whole suite on a tested commit (~19% of
  # all runs, measured across five adopting repos). This job runs ONLY on a ref's first
  # push (`github.event.created`), checks nothing out, and asks one question: does THIS
  # workflow already have a completed, green, non-PR run at THIS exact sha? Yes → every
  # other job is skipped and the run concludes `success` — a branch-CI `green` that is
  # true, because the same workflow passed at the same sha. Anything else — trunk still
  # running, red, never run, `gh` missing, the API failing — and the suite runs as
  # before (fail-open: this job never fails the run). Every later push has
  # `created == false`, so a real commit always gets the full suite, with no extra hop.
  # Why not simply `if: !github.event.created` on every job: a run whose jobs are ALL
  # skipped concludes `skipped`, which `colab ship` reads as not-green (CONVENTIONS.md
  # §4, "Branch CI"). This job is the one that ends green.
  #
  # Already tested at this TREE? (#493) — the squash merge.
  # A ship squash-merges a branch whose green run already contained the current base, so
  # the trunk commit's TREE is byte-identical to the tree that branch run passed — only the
  # sha is new. On a non-creating push to trunk this job therefore also asks: does THIS
  # workflow have a green `push` run, on another ref of this repo, whose commit has THIS
  # exact tree? It confirms the tree through the git object, never only the run listing.
  # Yes → the suite is skipped and the run cites the run it relied on (a
  # `tree-already-green` notice that `colab ship` / `colab trunk-ci` read back). Equal
  # trees cover every committed byte, workflows and lockfiles included — NOT runner images,
  # unpinned downloads, secrets or `github.ref`-conditional steps; a repo whose suite
  # depends on those declares `tree-reuse: off` in .github/project.yml. Trunk only (the
  # descriptor's `trunk:`, read at this sha), never a release branch, never a dispatch;
  # any doubt (no descriptor, opt-out, an API error, no exact match) runs the full suite.
  # A green run at THIS sha on another ref (a `ship-batch/*` run trunk fast-forwarded to) is
  # asked for first, by an exact query, so a busy repo's 50-run listing cannot miss it (#552).
  # A cited run is reused only if it skipped no job but this one: a job gated on the trunk
  # ref is `skipped` on every branch push, and reusing that run would skip it on trunk too
  # (#511). Never put a trunk-only job (publish, deploy, release) behind this gate.
  dedupe:
    name: Already tested at this sha or tree?
    # EDIT: the trunk refs here mirror `concurrency`'s list above (#493).
    if: github.event_name == 'push' && (github.event.created || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest # EDIT: the same label as the jobs below; it needs `gh` (GitHub-hosted images have it).
    timeout-minutes: 5 # one `gh api` listing, a hung call must not hold the slot. EDIT: the default is 360.
    permissions:
      actions: read
      contents: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
      cited: ${{ steps.check.outputs.cited }}
    steps:
      - name: Look for a green run of this workflow at this sha or tree
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          CREATED: ${{ github.event.created }}
          REF_NAME: ${{ github.ref_name }}
          GUARD_NAME: Already tested at this sha or tree? # EDIT: this job's `name:`, if you rename it (#511).
        run: |
          tested=false
          cited=
          # #511: a cited run is reusable only if it skipped no job but this guard. A job gated on
          # the trunk ref is `skipped` on every branch push and a skipped job does not fail the
          # run, so citing that run would skip the trunk-only job on trunk a second time.
          reusable() {
            if ! SK="$(gh api "repos/$REPO/actions/runs/$1/jobs?per_page=100" \
                   --jq 'if .total_count > (.jobs | length) then "(more than 100 jobs)" else [.jobs[] | select(.conclusion == "skipped" and .name != env.GUARD_NAME) | .name] | join(", ") end' 2>/dev/null)"; then
              echo "::notice::Could not list the jobs of run $1 — running the full suite (#511)."
              return 1
            elif [ -n "$SK" ]; then
              echo "::notice::Run $1 skipped $SK, which this push may run — running the full suite (#511)."
              return 1
            fi
          }
          # The cited run, as "<id> <head sha> <url> <branch>": a green push run of this workflow on
          # another ref of this repo. #552: one at THIS sha first (a `ship-batch/*` run trunk
          # fast-forwarded to), an exact query; else one whose commit has THIS tree (#493).
          same_sha() {
            gh api "repos/$REPO/actions/workflows/$WFID/runs?head_sha=$SHA&event=push&status=success&per_page=20" \
              --jq "first(.workflow_runs[] | select(.id != $RUN_ID and .head_branch != \"$REF_NAME\" and .head_repository.full_name == \"$REPO\") | \"\\(.id) \\(.head_sha) \\(.html_url) \\(.head_branch)\") // empty" 2>/dev/null | grep .
          }
          same_tree() {
            gh api "repos/$REPO/actions/workflows/$WFID/runs?event=push&status=success&per_page=50" \
              --jq "first(.workflow_runs[] | select(.id != $RUN_ID and .head_branch != \"$REF_NAME\" and .head_repository.full_name == \"$REPO\" and .head_commit.tree_id == \"$OURS\") | \"\\(.id) \\(.head_sha) \\(.html_url) \\(.head_branch)\") // empty" 2>/dev/null
          }
          if ! command -v gh >/dev/null 2>&1; then
            echo "::notice::gh is not installed on this runner — running the full suite (#418)."
          elif ! WFID="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .workflow_id 2>/dev/null)" || [ -z "$WFID" ]; then
            echo "::notice::Could not read this run's workflow id — running the full suite (#418)."
          elif [ "${CREATED:-}" = "false" ]; then
            # A non-creating push: trunk tree mode (#493). Every branch below but one runs the suite.
            if ! DESC="$(gh api "repos/$REPO/contents/.github/project.yml?ref=$SHA" -H 'Accept: application/vnd.github.raw' 2>/dev/null)" || [ -z "$DESC" ]; then
              echo "::notice::Could not read .github/project.yml at $SHA — running the full suite (#493)."
            elif grep -Eq '^tree-reuse[[:space:]]*:' <<< "$DESC"; then
              echo "::notice::tree-reuse is declared in .github/project.yml — running the full suite (#493)."
            elif [ "$(printf '%s\n' "$DESC" | sed -nE "s/^trunk:[[:space:]]*[\"']?([A-Za-z0-9._/-]+).*/\\1/p" | head -n 1)" != "$REF_NAME" ]; then
              echo "::notice::$REF_NAME is not this repo's trunk — running the full suite (#493)."
            elif ! OURS="$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha 2>/dev/null)" || [ -z "$OURS" ]; then
              echo "::notice::Could not read the tree of $SHA — running the full suite (#493)."
            elif ! CAND="$(same_sha || same_tree)"; then
              echo "::notice::Could not list this workflow's green runs — running the full suite (#493)."
            elif [ -z "$CAND" ]; then
              echo "No green run of this workflow on another ref has sha $SHA or tree $OURS — running the full suite."
            else
              read -r CID CSHA URL BR <<< "$CAND"
              if ! CTREE="$(gh api "repos/$REPO/git/commits/$CSHA" --jq .tree.sha 2>/dev/null)" || [ "$CTREE" != "$OURS" ]; then
                echo "::notice::Could not confirm the tree of $CSHA — running the full suite (#493)."
              elif reusable "$CID"; then
                tested=true
                cited="$URL"
                echo "::notice title=tree-already-green::$URL tree=$OURS head=$CSHA branch=$BR"
                echo "Tree $OURS already passed this workflow at $CSHA on $BR ($URL) — skipping the suite (#493)."
                echo "Already tested: tree \`$OURS\` passed this workflow on \`$BR\` — [the run relied on]($URL); suite skipped (#493)." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          elif ! N="$(gh api "repos/$REPO/actions/workflows/$WFID/runs?head_sha=$SHA&status=success&per_page=20" \
                 --jq "[.workflow_runs[] | select(.id != $RUN_ID and .event != \"pull_request\")] | length" 2>/dev/null)"; then
            echo "::notice::Could not list this workflow's runs at $SHA — running the full suite (#418)."
          elif [ "${N:-0}" -ge 1 ] 2>/dev/null; then
            tested=true
            echo "This workflow already passed at $SHA ($N green run(s)) — skipping the suite (#418)."
            echo "Already tested: this workflow has a green run at \`$SHA\` — suite skipped (#418)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No green run of this workflow at $SHA yet — running the full suite."
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          [ -z "$cited" ] || echo "cited=$cited" >> "$GITHUB_OUTPUT"

  gitleaks:
    name: Secret scan (gitleaks)
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.tested != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest # EDIT: self-hosted label if this repo needs one.
    timeout-minutes: 15 # a scan of the checkout. EDIT: the default is 360.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Full history: scan the commit log, not only the current tree.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned release binary)
        run: |
          # NOT gitleaks/gitleaks-action@v2 — it demands a paid GITLEAKS_LICENSE for
          # organization-owned repositories. The plain release binary is MIT.
          # Resolve OS/arch from uname — a hardcoded linux_x64 binary on a macOS
          # self-hosted runner cannot exec, and fails as a bare exit 126.
          case "$(uname -s)" in
            Darwin) os=darwin ;;
            Linux)  os=linux ;;
            *) echo "unsupported OS: $(uname -s)" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            arm64|aarch64) arch=arm64 ;;
            x86_64|amd64)  arch=x64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${os}_${arch}.tar.gz"
          # Into $RUNNER_TEMP, not /usr/local/bin: no sudo, no global write — the same
          # step then works on BOTH GitHub-hosted and shared self-hosted runners
          # (a shared runner is infrastructure; jobs must not mutate it).
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          rm -f gitleaks.tar.gz

      - name: gitleaks detect
        run: gitleaks detect --source . --no-banner

  build:
    name: Build (Laravel + Vite)
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.tested != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest # EDIT: self-hosted label if this repo needs one.
    # Re-exported so the migrations job below resolves PHP exactly once, here.
    outputs:
      php-version: ${{ steps.toolchain.outputs.php-version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # Decide the test tier (#512). Not an `env:` expression, because the answer depends on
      # the repo's trunk (.github/project.yml), which only exists once the tree is checked out.
      #   RUN_TESTS 'true' / 'false'  → used as written.
      #   'auto', a pull_request run  → on when the PR targets main (copies that restore PRs).
      #   'auto', push or dispatch    → on for main, and for every branch when trunk is main
      #                                 (Tier B); off for a dev trunk and its branches (Tier C).
      - name: Decide the test tier
        id: tier
        env:
          DECLARED: ${{ env.RUN_TESTS }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$DECLARED" in
            true|false) run="$DECLARED" ;;
            *)
              trunk="$(sed -nE 's/^trunk:[[:space:]]*"?([^"#[:space:]]+)"?.*/\1/p' .github/project.yml 2>/dev/null | head -1 || true)"
              [ -n "$trunk" ] || trunk="$DEFAULT_BRANCH"
              if [ "$EVENT" = "pull_request" ]; then
                [ "$BASE_REF" = "main" ] && run=true || run=false
              elif [ "$REF" = "refs/heads/main" ] || [ "$trunk" = "main" ]; then
                run=true
              else
                run=false
              fi ;;
          esac
          echo "run_tests=$run" >> "$GITHUB_OUTPUT"
          echo "::notice::Pest suite: $run (RUN_TESTS=$DECLARED, event=$EVENT, ref=$REF)"

      # ---------------------------------------------------------------------------
      # Descriptor check (#416). A value `colab ship` cannot use does not fail there —
      # it fails closed to the safe default, silently. `ship-batch: 5` (the cap is 3)
      # once turned every landing in a busy repo back to serial while this CI stayed
      # green; only a ship dry run noticed. So the value fails HERE, where the person
      # who changed project.yml is looking. Same rule as `colab ship` and the audit
      # (tools/lib/ship-batch.js parseShipBatch): absent/empty/null, or 1–3. Why the
      # cap is 3: project.schema.md, `ship-batch`. `ship-batch-wait` (#555) the same way
      # (parseShipBatchWait): absent/empty/null, or a whole number with a unit (s, m, h).
      # `ci-wait-factor` (#564) too (tools/lib/ci-profile.js parseFactor): absent, or a number >= 1.
      # ---------------------------------------------------------------------------
      - name: Descriptor check (.github/project.yml)
        working-directory: ${{ github.workspace }}
        run: |
          [ -f .github/project.yml ] || exit 0
          # The scalar after `<key>:` — comment, trailing blanks and one level of quotes stripped.
          field() {
            grep -E "^$1[[:space:]]*:" .github/project.yml | head -1 \
              | sed -E -e "s/^$1[[:space:]]*:[[:space:]]*//" \
                -e 's/[[:space:]]+#.*$//' -e 's/[[:space:]]+$//' \
                -e 's/^"(.*)"$/\1/' -e "s/^'(.*)'\$/\\1/" || true
          }
          v="$(field ship-batch)"
          case "$v" in
            ''|'~'|null|1|2|3) echo "ship-batch: ${v:-absent} — ok" ;;
            *)
              echo "::error file=.github/project.yml::ship-batch is '$v', expected an integer 1-3 (omit for serial). colab ship ignores any other value and lands serially. Why the cap is 3: project.schema.md, ship-batch."
              exit 1 ;;
          esac
          # ship-batch-wait (#555): a whole number with a unit — 90s, 6m, 1h. No ceiling: the repo chooses.
          w="$(field ship-batch-wait)"
          case "$w" in
            ''|'~'|null) echo "ship-batch-wait: absent — ok" ;;
            *)
              if printf '%s\n' "$w" | grep -Eq '^[0-9]+[smh]$'; then
                echo "ship-batch-wait: $w — ok"
              else
                echo "::error file=.github/project.yml::ship-batch-wait is '$w', expected a whole number with a unit: 90s, 6m, 1h (omit for no wait). colab ship ignores any other value and does not wait."
                exit 1
              fi ;;
          esac
          # ci-wait-factor (#559): a number >= 1 — a multiple of the repo's measured CI duration. No ceiling.
          # Same reading as tools/lib/ci-profile.js parseFactor on the raw scalar the audit hands it.
          f="$(field ci-wait-factor)"
          case "$f" in
            ''|'~'|null) echo "ci-wait-factor: absent — ok (default 2)" ;;
            *)
              if printf '%s\n' "$f" | grep -Eq '^[0-9]+(\.[0-9]+)?$' && awk -v n="$f" 'BEGIN { exit !(n + 0 >= 1) }'; then
                echo "ci-wait-factor: $f — ok"
              else
                echo "::error file=.github/project.yml::ci-wait-factor is '$f', expected a number >= 1 (a multiple of the measured CI duration; omit for 2). colab ship and colab ci-wait ignore any other value and use 2. See project.schema.md, ci-wait-factor."
                exit 1
              fi ;;
          esac
          # thresholds (#560): one level of `name: whole number`, each name known and at or above its
          # floor (and, for a percent, at most 100) — the table in tools/lib/thresholds.js (SPEC),
          # which a test holds this list to.
          # A bad entry falls back to the default everywhere, silently, so it fails here.
          bad=0
          while IFS= read -r t; do
            case "$t" in =*)
              echo "::error file=.github/project.yml::thresholds is '${t#=}', expected a map of 'name: whole number' pairs. See project.schema.md, thresholds."
              bad=1; continue ;;
            esac
            k="${t%%:*}"
            n="$(printf '%s' "${t#*:}" | sed -E -e 's/^[[:space:]]+//' -e 's/^"(.*)"$/\1/' -e "s/^'(.*)'\$/\\1/")"
            max=999999999
            case "$k" in
              hot-file-count|claude-md-line-multiple) min=2 ;;
              dependents-count|hold-stale-days|smoke-minutes|claude-md-kb|transitional-days|batch-min-samples) min=1 ;;
              claude-md-line-floor-bytes|doc-budget-slack) min=0 ;;
              batch-first-green-pct-min|batch-eviction-pct-max|batch-overlap-pct) min=0 max=100 ;;
              *) echo "::error file=.github/project.yml::thresholds.$k is not a known threshold (colab thresholds lists them). See project.schema.md, thresholds."
                 bad=1; continue ;;
            esac
            case "$n" in ''|'~'|null) continue ;; esac
            if printf '%s\n' "$n" | grep -Eq '^[0-9]{1,9}$' && [ "$n" -ge "$min" ] && [ "$n" -le "$max" ]; then
              echo "thresholds.$k: $n — ok"
            else
              echo "::error file=.github/project.yml::thresholds.$k is '$n', expected a whole number from $min to $max. Every reader ignores it (a batch-* key is then not judged; any other uses its default). See project.schema.md, thresholds."
              bad=1
            fi
          done < <(awk '
            /^thresholds[[:space:]]*:/ { b = 1; v = $0
              sub(/^thresholds[[:space:]]*:[[:space:]]*/, "", v); sub(/[[:space:]]+#.*$/, "", v); sub(/[[:space:]]+$/, "", v)
              if (v != "" && v != "~" && v != "null") print "=" v
              next }
            b && /^[[:space:]]*(#|$)/ { next }
            b && /^[[:space:]]/ { l = $0; sub(/^[[:space:]]+/, "", l); sub(/[[:space:]]+#.*$/, "", l); sub(/[[:space:]]+$/, "", l); print l; next }
            { b = 0 }' .github/project.yml)
          [ "$bad" = 0 ] || exit 1

      # ---------------------------------------------------------------------------
      # Toolchain resolution. Precedence, highest first:
      #   PHP :  1. .github/project.yml -> php:      2. composer.json -> require.php
      #   Node:  1. .github/project.yml -> node:     2. .nvmrc, else package.json engines.node
      #   ...and if neither declares it, FAIL.
      #
      # There is deliberately NO fallback default. A silent default is exactly how a
      # repo here ended up building on Node 20 in CI while deploying on Node 22 —
      # CI was green and proved nothing about what actually shipped. Keep these equal
      # to what the deploy target runs, or CI proves nothing.
      # ---------------------------------------------------------------------------
      - name: Resolve toolchain versions
        id: toolchain
        run: |
          set -euo pipefail

          # "^8.3" / ">=22.1" / "v22" / "8.4.*" -> "8.3" / "22.1" / "22" / "8.4"
          normalise() {
            printf '%s' "$1" \
              | tr -d '"' \
              | sed -E 's/^[^0-9]*//' \
              | sed -E 's/[[:space:]].*$//' \
              | sed -E 's/\.(x|\*)$//' \
              | sed -E 's/[^0-9.].*$//' \
              | sed -E 's/\.$//'
          }

          # Read a flat `key: value` out of .github/project.yml. That file is a
          # handful of top-level keys by design, so this is sufficient.
          from_project_yml() {
            [ -f .github/project.yml ] || return 0
            sed -nE "s/^[[:space:]]*$1:[[:space:]]*\"?([^\"#[:space:]]+)\"?.*/\1/p" .github/project.yml | head -1
          }

          # --- PHP ---------------------------------------------------------------
          PHP_VERSION=""; PHP_SOURCE=""
          V="$(from_project_yml php || true)"
          if [ -n "$V" ] && [ "$V" != "null" ]; then
            PHP_VERSION="$(normalise "$V")"; PHP_SOURCE=".github/project.yml (php:)"
          fi
          if [ -z "$PHP_VERSION" ] && [ -f composer.json ]; then
            V=""
            if command -v php >/dev/null 2>&1; then
              V="$(php -r '$c=json_decode(file_get_contents("composer.json"),true); echo $c["require"]["php"] ?? "";' || true)"
            elif command -v python3 >/dev/null 2>&1; then
              V="$(python3 -c "import json;print((json.load(open('composer.json')).get('require') or {}).get('php') or '')" || true)"
            elif command -v node >/dev/null 2>&1; then
              V="$(node -e "try{const r=require('./composer.json').require||{};process.stdout.write(String(r.php||''))}catch(_){}" || true)"
            fi
            if [ -n "$V" ]; then
              PHP_VERSION="$(normalise "$V")"; PHP_SOURCE="composer.json (require.php)"
            fi
          fi
          if [ -z "$PHP_VERSION" ]; then
            echo "::error::No PHP version is declared in this repository, and this workflow refuses to guess one."
            {
              echo "Declare it in ONE of:"
              echo "  1. .github/project.yml  ->  php: \"8.4\"   (preferred)"
              echo "  2. composer.json        ->  \"require\": { \"php\": \"^8.4\" }"
              echo "Use the version the DEPLOY target runs."
            } >&2
            exit 1
          fi

          # --- Node --------------------------------------------------------------
          NODE_VERSION=""; NODE_SOURCE=""
          V="$(from_project_yml node || true)"
          if [ -n "$V" ] && [ "$V" != "null" ]; then
            NODE_VERSION="$(normalise "$V")"; NODE_SOURCE=".github/project.yml (node:)"
          fi
          if [ -z "$NODE_VERSION" ] && [ -f .nvmrc ]; then
            V="$(grep -vE '^[[:space:]]*(#|$)' .nvmrc | head -1 | tr -d '[:space:]' || true)"
            if [ -n "$V" ]; then
              NODE_VERSION="$(normalise "$V")"; NODE_SOURCE=".nvmrc"
            fi
          fi
          if [ -z "$NODE_VERSION" ] && [ -f package.json ]; then
            V=""
            if command -v node >/dev/null 2>&1; then
              V="$(node -e "try{const e=require('./package.json').engines||{};process.stdout.write(String(e.node||''))}catch(_){}" || true)"
            elif command -v python3 >/dev/null 2>&1; then
              V="$(python3 -c "import json;print((json.load(open('package.json')).get('engines') or {}).get('node') or '')" || true)"
            fi
            if [ -n "$V" ]; then
              NODE_VERSION="$(normalise "$V")"; NODE_SOURCE="package.json (engines.node)"
            fi
          fi
          if [ -z "$NODE_VERSION" ]; then
            echo "::error::No Node version is declared in this repository, and this workflow refuses to guess one."
            {
              echo "Declare it in ONE of:"
              echo "  1. .github/project.yml  ->  node: \"22\"   (preferred)"
              echo "  2. .nvmrc  ->  22        or  package.json -> \"engines\": { \"node\": \">=22\" }"
              echo "Use the version the DEPLOY target runs."
            } >&2
            exit 1
          fi

          echo "php-version=$PHP_VERSION"   >> "$GITHUB_OUTPUT"
          echo "node-version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "PHP $PHP_VERSION (from: $PHP_SOURCE) / Node $NODE_VERSION (from: $NODE_SOURCE)"
          {
            echo "PHP **$PHP_VERSION** — resolved from \`$PHP_SOURCE\`"
            echo ""
            echo "Node **$NODE_VERSION** — resolved from \`$NODE_SOURCE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.toolchain.outputs.php-version }}
          # sqlite3 + pdo_sqlite are what the throwaway bootstrap below runs on.
          extensions: mbstring, sqlite3, pdo_sqlite, bcmath, intl # EDIT: add what this app needs.
          coverage: none

      - name: Composer install
        env:
          RUN_TESTS: ${{ steps.tier.outputs.run_tests }}
        run: |
          # --no-scripts: the post-autoload-dump hook runs `package:discover`, which
          # boots the app — and the app cannot boot until the .env below exists.
          # Dev dependencies are installed only when the Pest suite will run; a build-
          # only job does not need them (wayfinder lives in require, not require-dev).
          if [ "$RUN_TESTS" = "true" ]; then
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts
          else
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts
          fi

      - name: Prepare throwaway env for build-time codegen (wayfinder)
        run: |
          # See the header: .env.example ships DB_CONNECTION=mysql, but there is no
          # MySQL on the runner. Rewrite to sqlite against an empty file so artisan
          # boots. This .env is disposable — deploy workflows rsync with --exclude
          # '.env', so it can never reach a server.
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan package:discover --ansi

          echo "=== PHP version on runner ==="
          php -v

          echo "=== wayfinder:generate (stderr visible) ==="
          # Run it here rather than letting the Vite plugin invoke it: the plugin hides
          # stderr and reports only "Command failed".
          php artisan wayfinder:generate $WAYFINDER_ARGS

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      - name: Build frontend assets (Vite)
        run: |
          npm ci
          npm run build

      - name: Run migrations against sqlite
        if: steps.tier.outputs.run_tests == 'true'
        run: |
          # Migrations must apply cleanly from zero. This is the cheapest way to catch
          # a migration that only works against an already-populated database.
          php artisan migrate --force

      - name: Test (Pest)
        if: steps.tier.outputs.run_tests == 'true'
        run: |
          if [ -f vendor/bin/pest ]; then
            vendor/bin/pest --ci
          elif [ -f vendor/bin/phpunit ]; then
            echo "::notice::No Pest binary — falling back to PHPUnit."
            vendor/bin/phpunit
          else
            echo "::error::RUN_TESTS is true but neither vendor/bin/pest nor vendor/bin/phpunit exists. Add a test runner, or set RUN_TESTS: false."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Migration round-trip — see the header for what each engine catches.
  #
  #   1. migrate            from zero                                (schema snapshot A)
  #   2. migrate:rollback   back to the OLDEST migration this change adds OR modifies —
  #                         every down() it touched runs, plus the untouched ones after
  #                         it (all migrations when the change touches none)
  #   3. seed               only if ROUNDTRIP_SEEDER is set, and only when the change
  #                         touches migrations: rows land at the PRE-change schema
  #   4. migrate            again — the touched migrations land on those rows (snapshot B)
  #   5. compare            B must equal A — a down() that does not exactly undo its
  #                         up() leaves a schema that differs on the second pass
  #
  # MODIFIED counts as touched, not only added (#507): a branch that only repairs an
  # existing down() must see that down() run, and a branch that adds one migration and
  # repairs an older one must roll back past the older one, not just the newest step.
  #
  # Steps 2-4 are the shape of a real deploy: new migrations landing on tables that
  # already hold rows written before they existed. That is why the seed sits BETWEEN
  # the rollback and the second migrate — rows seeded after the new migrations would
  # already satisfy them (a NOT NULL column filled, a narrowed number in range) and
  # every data-dependent trap would pass.
  # ---------------------------------------------------------------------------
  migrations:
    name: Migration round-trip (${{ matrix.engine }})
    needs: build
    # Explicit result check, not the implicit success(): success() reads EVERY ancestor,
    # including `dedupe`, which is skipped on every ordinary push — so the implicit
    # form would skip this job on exactly the runs it exists for (#418).
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest # EDIT: self-hosted label if this repo needs one.
    strategy:
      fail-fast: false
      matrix:
        # EDIT: one row for the engine the tests run on, one for the engine PRODUCTION
        # runs on, at production's exact version. Deploy engine is sqlite too? Delete
        # the server row. MySQL, not MariaDB? Swap in the commented row. A server row
        # whose version differs from production proves nothing about production.
        include:
          - engine: sqlite
            connection: sqlite
            image: ''            # empty image = no service container for this row
            health: 'true'
          - engine: mariadb
            connection: mariadb  # Laravel 11+; use `mysql` on older frameworks
            image: mariadb:11.4  # EDIT: the version the deploy target runs
            health: healthcheck.sh --connect --innodb_initialized
          # - engine: mysql
          #   connection: mysql
          #   image: mysql:8.4   # EDIT: the version the deploy target runs
          #   health: mysqladmin ping -h 127.0.0.1 -proot
    services:
      db:
        image: ${{ matrix.image }}
        env:
          # A disposable server inside one job; this password never leaves the runner.
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: roundtrip
        # Container port only, no fixed host port: a shared self-hosted runner may
        # already listen on 3306 (README, "Self-hosted patterns"). The host port is
        # read back from job.services below.
        ports:
          - 3306
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      # EDIT: a seeder class that leaves REPRESENTATIVE rows — NULLs where a column
      # allows them, rows a new foreign key would orphan, numbers near a column's
      # limits. Empty = no seeding, and the data-dependent traps in the header pass.
      # It runs against the schema BEFORE this change, so it writes the way old data
      # looks: raw DB::table() inserts into long-lived columns, not factories that
      # fill whatever columns the models know about today.
      ROUNDTRIP_SEEDER: ""
      # EDIT: where this repo keeps migrations.
      MIGRATIONS_PATH: database/migrations
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Full history: the count step diffs the migrations this change touches against trunk.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.build.outputs.php-version }}
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_mysql, bcmath, intl # EDIT: add what this app needs.
          coverage: none

      - name: Composer install
        # Dev dependencies included: seeders usually build rows through factories.
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Point the app at this row's engine
        env:
          ENGINE: ${{ matrix.engine }}
          CONNECTION: ${{ matrix.connection }}
          DB_SERVICE_PORT: ${{ job.services.db.ports['3306'] }}
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate --force
          # Real environment variables win over .env (Laravel loads it immutably), so
          # the connection is set here rather than by rewriting .env.example's lines.
          # DB_URL is blanked: when set, it overrides every DB_* below.
          {
            echo "DB_CONNECTION=$CONNECTION"
            echo "DB_URL="
          } >> "$GITHUB_ENV"
          if [ "$ENGINE" = sqlite ]; then
            : > database/roundtrip.sqlite   # truncate: a reused workspace must still start from zero
            echo "DB_DATABASE=$PWD/database/roundtrip.sqlite" >> "$GITHUB_ENV"
          else
            {
              echo "DB_HOST=127.0.0.1"
              echo "DB_PORT=$DB_SERVICE_PORT"
              echo "DB_DATABASE=roundtrip"
              echo "DB_USERNAME=root"
              echo "DB_PASSWORD=root"
            } >> "$GITHUB_ENV"
          fi

      - name: Discover packages
        run: php artisan package:discover --ansi

      - name: Find the migrations this change adds or modifies
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Trunk from .github/project.yml, else the repo's default branch. A pull
          # request compares against its own base instead.
          trunk="$(sed -nE 's/^trunk:[[:space:]]*"?([^"#[:space:]]+)"?.*/\1/p' .github/project.yml 2>/dev/null | head -1 || true)"
          base_ref="origin/${GITHUB_BASE_REF:-${trunk:-$DEFAULT_BRANCH}}"
          base=""
          if git rev-parse -q --verify "$base_ref" >/dev/null; then
            base="$(git merge-base HEAD "$base_ref")"
            # On trunk itself the merge-base is HEAD: judge the commit that just landed.
            if [ "$base" = "$(git rev-parse HEAD)" ]; then
              base="$(git rev-parse -q --verify 'HEAD^' || true)"
            fi
          fi
          # Added, Modified, and Renamed (a rename is a new name to the migrator) — not
          # added only (#507): a branch that only repairs an existing down() got a green
          # round-trip that never ran it.
          touched=""
          if [ -n "$base" ]; then
            touched="$(git diff --name-status --diff-filter=AMR "$base" HEAD -- "$MIGRATIONS_PATH" | awk -F'\t' '$NF ~ /\.php$/ { print substr($1,1,1) "\t" $NF }')"
          fi
          # The migrator orders by file name, so the oldest touched one is the smallest
          # base name; step 2 rolls back to it and everything after it.
          from="$(printf '%s\n' "$touched" | awk -F'\t' 'NF { n=$2; sub(/.*\//, "", n); sub(/\.php$/, "", n); print n }' | LC_ALL=C sort | head -1)"
          echo "ROUNDTRIP_FROM=$from" >> "$GITHUB_ENV"
          if [ -n "$from" ]; then
            added="$(printf '%s\n' "$touched" | grep -c '^A' || true)"
            modified="$(printf '%s\n' "$touched" | grep -c '^[MR]' || true)"
            echo "This change touches migrations (vs ${base_ref}): $added added, $modified modified. Step 2 rolls back to the oldest, $from, so every down() listed below runs:"
            printf '%s\n' "$touched" | sed 's/^A\t/  added     /; s/^[MR]\t/  modified  /'
          else
            echo "This change adds or modifies no migrations (vs ${base_ref:-nothing}); step 2 rolls back all of them."
          fi

      - name: Write the schema snapshot script
        run: |
          # Tables, columns, indexes and foreign keys through the framework's own schema
          # builder (Laravel 11+), so the same script reads sqlite and MariaDB/MySQL and
          # needs no mysqldump/sqlite3 client on the runner. The migrations table is
          # left out: its batch numbers differ between passes by design.
          cat > "$RUNNER_TEMP/schema-snapshot.php" <<'PHP'
          <?php
          require getcwd() . '/vendor/autoload.php';
          $app = require getcwd() . '/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $schema = Illuminate\Support\Facades\Schema::connection(null);
          $m = config('database.migrations');
          $skip = is_array($m) ? ($m['table'] ?? 'migrations') : ($m ?: 'migrations');
          $current = method_exists($schema, 'getCurrentSchemaName') ? $schema->getCurrentSchemaName() : null;
          $out = [];
          foreach ($schema->getTables() as $t) {
              $name = $t['name'];
              if ($name === $skip || str_starts_with($name, 'sqlite_')) continue;
              if ($current !== null && isset($t['schema']) && $t['schema'] !== $current) continue;
              $idx = $schema->getIndexes($name);
              usort($idx, fn ($a, $b) => strcmp($a['name'], $b['name']));
              $fks = $schema->getForeignKeys($name);
              usort($fks, fn ($a, $b) => strcmp(json_encode($a), json_encode($b)));
              $out[$name] = ['columns' => $schema->getColumns($name), 'indexes' => $idx, 'foreign_keys' => $fks];
          }
          ksort($out);
          echo json_encode($out, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), "\n";
          PHP
          # How many migrations step 2 must roll back to reach ROUNDTRIP_FROM: the rows of
          # the migrations table at or after it. Read from the table, not by counting
          # files, so migrations a package registers from another path are counted too.
          cat > "$RUNNER_TEMP/rollback-steps.php" <<'PHP'
          <?php
          require getcwd() . '/vendor/autoload.php';
          $app = require getcwd() . '/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $m = config('database.migrations');
          $table = is_array($m) ? ($m['table'] ?? 'migrations') : ($m ?: 'migrations');
          echo Illuminate\Support\Facades\DB::table($table)->where('migration', '>=', getenv('ROUNDTRIP_FROM'))->count(), "\n";
          PHP

      - name: 1. migrate from zero
        run: |
          php artisan migrate --force
          php "$RUNNER_TEMP/schema-snapshot.php" > "$RUNNER_TEMP/schema-a.json"

      - name: 2. roll back
        run: |
          set -euo pipefail
          steps=0
          if [ -n "$ROUNDTRIP_FROM" ]; then
            steps="$(php "$RUNNER_TEMP/rollback-steps.php")"
          fi
          if [ "$steps" -gt 0 ]; then
            echo "Rolling back $steps migration(s), down to $ROUNDTRIP_FROM."
            php artisan migrate:rollback --step="$steps" --force
          else
            # Everything ran in one batch at step 1, so this rolls all of it back.
            php artisan migrate:rollback --force
          fi

      - name: 3. seed rows at the pre-change schema
        # No touched migrations = nothing lands on the rows, and the schema is empty anyway.
        if: env.ROUNDTRIP_SEEDER != '' && env.ROUNDTRIP_FROM != ''
        run: php artisan db:seed --class="$ROUNDTRIP_SEEDER" --force

      - name: 4. migrate again
        run: |
          php artisan migrate --force
          php "$RUNNER_TEMP/schema-snapshot.php" > "$RUNNER_TEMP/schema-b.json"

      - name: 5. the second pass must leave the same schema as the first
        run: |
          if ! diff -u "$RUNNER_TEMP/schema-a.json" "$RUNNER_TEMP/schema-b.json"; then
            echo "::error::Schema after rollback + re-migrate differs from the first migrate (${{ matrix.engine }}). A down() does not exactly undo its up(); the diff above shows what the second pass left different."
            exit 1
          fi
          echo "Round-trip clean on ${{ matrix.engine }}."
