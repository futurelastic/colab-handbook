# CI (Laravel) — CALLER of the handbook's reusable workflow. Copy me into your repo at .github/workflows/ci.yml.
#
# A CALLER since #724, not a copy of the gate. The dedupe gate, the secret scan, the descriptor check
# of .github/project.yml, the toolchain resolution (project.yml, then the manifest, else FAIL — never a
# default), the package caches and the quick/full split live once, in the handbook's reusable
# .github/workflows/ci-light.yml, and a handbook release moves them. What stays yours, and is yours to
# edit: the triggers and `concurrency` (a called workflow cannot own either, CONVENTIONS.md §7, "One
# verdict per tree"), the `with:` block, and any job of your own beside the call. `colab template ci-laravel`
# writes this repo's trunk refs and pins the call to the handbook release it stamps the copy with;
# `colab update` moves a pristine copy's stamp and pin together.
#
# EDIT POINTS are marked `# EDIT:` — walk them once after copying.
#
# For: Laravel + Inertia + React + Vite fullstack apps with a route/type codegen step.
#
# Two things here are NOT optional, and are the whole reason this is separate from
# ci-node.yml:
#
#   1. THE SQLITE BOOTSTRAP. The Vite build runs the Laravel wayfinder plugin, which
#      shells out to `php artisan wayfinder:generate`. That means the application must
#      actually BOOT on the runner. Our .env.example files ship DB_CONNECTION=mysql,
#      so without an override artisan tries to reach a MySQL server that does not
#      exist on the runner and the build dies. We copy .env.example, rewrite the
#      connection to sqlite, touch an empty database file, and generate a throwaway
#      APP_KEY. This .env is disposable and never leaves the runner.
#
#   2. RUNNING WAYFINDER EXPLICITLY, before Vite. The Vite plugin swallows stderr and
#      reports only "Command failed", which is unusable for debugging. Running the
#      artisan command ourselves first means a codegen failure shows its real error.
#
# A job beside the call, `migrations`, round-trips the schema (migrate -> rollback -> migrate)
# on the TEST engine (sqlite) AND the DEPLOY engine (a MariaDB/MySQL service
# container). Every case below was measured, and the engines disagree on several of
# them — so either engine alone passes a migration the other refuses:
#
# Which defects each leg catches, and why the last ones need rows (ROUNDTRIP_SEEDER below):
# templates/README.md, "Migration round-trip". It stays in this light lane on purpose: a
# `migration-grant: reviewer` repo's ship reads this job by name (the R condition, #494).
#
# Not gated on RUN_TESTS: a bad migration is cheapest to fix on the branch that adds or
# modifies it, so this runs on every push, not only on main.
#
# What the call runs (ci-light.yml):
#   0. The gate: already tested at this sha or tree? Then the suite is skipped (one verdict per tree).
#   1. Secret scan with gitleaks (pinned release binary).
#   2. Quick: the descriptor check (ship-batch, #416; ship-batch-wait, #555; ci-wait-factor, #564).
#   3. Full: the `full` script below — the test tier, composer install, the throwaway sqlite .env,
#      wayfinder, the Vite build, then (on the tier) migrate + Pest. Install runs inside it, not in
#      `install`, so the quick job does not pay for a Composer and npm install it never uses.
#
# LIGHT LANE (#607): this file runs on every push and is what `colab ship` reads. Keep it
# fast — secret scan, build, typecheck/lint, the fast tests (target: under 5 minutes).
# The full suite, integration, e2e and load tests belong in the HEAVY lane,
# templates/ci-laravel-heavy.yml copied to .github/workflows/ci-heavy.yml: it runs nightly
# and on every release candidate/tag, never per merge. The heavy lane is still a copy (#724 kept it
# one: it is not what drifted). Tests are light unless marked heavy:
#   the Pest/PHPUnit group `heavy` (`->group('heavy')` or `#[Group('heavy')]`).
name: CI

on:
  push:
    # Every branch, not only trunk (#384). Sessions push branches without opening a
    # PR, so a trunk-only trigger leaves a candidate with no run of its own before the
    # merge: its first run is the post-merge trunk run, and a red there is everyone's
    # TRUNK RED instead of one implementer's hand-back (CONVENTIONS.md §4, "Branch
    # CI"). '**' also covers `ship-batch/**`, the batch-landing opt-in.
    #
    # EDIT: on ONE self-hosted agent shared with trunk, go back to trunk-only until
    # trunk has its own lane — branch runs queue ahead of the one trunk run a merge
    # waits for (CONVENTIONS.md §7, "Self-hosted runners", #355). GitHub-hosted
    # runners, a runner pool, or the `trunk` class picked in `runs-on` on
    # github.ref all have that capacity; keep '**' there. Trunk-only means the
    # branches this repo actually has — and never drop `dev` on a Tier A or C repo:
    # dev is the trunk, so a main-only trigger runs zero checks on the branch you
    # merge into, and nothing looks broken (CONVENTIONS.md §7).
    branches: ['**']
    # Optional (#607): skip documentation-only pushes here, if you like. `colab ship` decides a
    # docs-only change from the diff and lands it without waiting for CI (CONVENTIONS.md §4,
    # "Docs-only — no CI wait"), so a docs push with no run does not hold a merge.
    # paths-ignore: ['**/*.md', 'docs/**']
  # No `pull_request:` here (#512). A branch with an open PR in this repository already
  # has a push run at the same head, and a `pull_request` run beside it doubled the CI
  # per commit while testing a merge ref instead of the sha that lands. Readers keep only
  # the newest run per workflow at a sha, so that second run also decided the verdict.
  # EDIT: a copy that went back to trunk-only push (above) has no run on a branch until it
  # has a PR — restore `pull_request: branches: [<trunk>]` there; that PR run is then its
  # only branch run (CONVENTIONS.md §4, "Branch CI"). But the called workflow skips a SAME-repo
  # PR run (its jobs carry the fork-PR term), so with this caller that only helps fork PRs: on
  # trunk-only push a same-repo branch gets no run at all. Keep '**' with the caller.
  # EDIT: fork PRs (#514). A push to a fork never runs a workflow here, so a repo that takes
  # PRs from forks needs `pull_request`. Uncomment it there. Every job of the called workflow
  # carries `github.event.pull_request.head.repo.full_name != github.repository` for a PR
  # event, so a same-repo PR's run skips every job (its push run is the one that tests) and a
  # fork PR's run tests. A skipped run never stands for a workflow that has a run that ran
  # (CONVENTIONS.md §4, "Branch CI"). Check every reader of your CI agrees before you uncomment.
  # pull_request:
  #   branches: ['**']
  # A promotion pushed by the release workflow's token triggers no push run, so that workflow
  # dispatches this one on main instead (templates/release-auto.yml, #440). Harmless elsewhere.
  workflow_dispatch:

# One live run per branch: a new push cancels the superseded run on the same ref.
# Trunk is NEVER cancelled — every trunk sha keeps a completed run of its own, which
# is what the merge gate reads (CONVENTIONS.md §4, "Branch CI"). A trunk run also gets a
# group of its own (the run id): GitHub cancels an older run that is still PENDING in a
# group even when cancel-in-progress is false, so a third quick merge would otherwise
# drop the second one's run before it ever started (#512).
# EDIT: name exactly this repo's trunk (and release branch) here — in the group, in
# cancel-in-progress, and in the call's `trunk-branches` input below. A Tier C trunk may carry any
# name; one left off this list gets its trunk runs cancelled. `colab template` writes these
# from the `trunk:` in .github/project.yml and prints what it wrote (#526).
concurrency:
  group: ci-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

# The called jobs can only narrow these: the gate lists this workflow's runs and reads git objects.
permissions:
  actions: read
  contents: read

jobs:
  ci:
    # Pinned to a handbook release, never a branch: a caller tracking `main` would take every gate
    # change the moment it merges there, untested against this repo. Move the tag deliberately
    # (`colab update` refreshes a pristine copy to the current release).
    uses: futurelastic/colab-handbook/.github/workflows/ci-light.yml@HANDBOOK_TAG
    with:
      trunk-branches: '["main","dev"]'
      toolchain: php,node
      # sqlite3 + pdo_sqlite are what the throwaway bootstrap below runs on.
      php-extensions: mbstring, sqlite3, pdo_sqlite, bcmath, intl # EDIT: add what this app needs.
      install: "" # inside `full`: the test tier decides --no-dev, and the app must not boot before its .env
      full: |
        # EDIT: whether the Pest suite runs. 'auto' (#512): light CI on a dev trunk and its branches
        # (does it build at all, ~2 min); the suite on main, where it gates a release. On Tier C main
        # IS production — promotion is the deploy — so this suite is the last gate before users. When
        # main is the trunk (Tier B) every branch push runs the suite too. 'true' always, 'false' never.
        RUN_TESTS=auto
        # EDIT: match the app's APP_NAME. Leave empty if the build does not read it.
        export VITE_APP_NAME=""
        # EDIT: arguments passed to `php artisan wayfinder:generate`.
        WAYFINDER_ARGS="--with-form"

        # ── the test tier (#512) — from the repo's trunk (.github/project.yml), else the default branch.
        #   'auto', a pull_request run  → on when the PR targets main (copies that restore PRs).
        #   'auto', push or dispatch    → on for main, and for every branch when trunk is main
        #                                 (Tier B); off for a dev trunk and its branches (Tier C).
        EVENT="$GITHUB_EVENT_NAME"; REF="$GITHUB_REF"; BASE_REF="${GITHUB_BASE_REF:-}"
        case "$RUN_TESTS" in
          true|false) run="$RUN_TESTS" ;;
          *)
            trunk="$(sed -nE 's/^trunk:[[:space:]]*"?([^"#[:space:]]+)"?.*/\1/p' "$GITHUB_WORKSPACE/.github/project.yml" 2>/dev/null | head -1 || true)"
            [ -n "$trunk" ] || trunk="$(sed -nE 's/.*"default_branch":[[:space:]]*"([^"]+)".*/\1/p' "${GITHUB_EVENT_PATH:-/dev/null}" 2>/dev/null | head -1 || true)"
            if [ "$EVENT" = "pull_request" ]; then
              [ "$BASE_REF" = "main" ] && run=true || run=false
            elif [ "$REF" = "refs/heads/main" ] || [ "$trunk" = "main" ]; then
              run=true
            else
              run=false
            fi ;;
        esac
        echo "::notice::Pest suite: $run (RUN_TESTS=$RUN_TESTS, event=$EVENT, ref=$REF)"
        # ── end of the test tier

        # --no-scripts: the post-autoload-dump hook runs `package:discover`, which boots the app —
        # and the app cannot boot until the .env below exists. Dev dependencies only when the Pest
        # suite will run; a build-only job does not need them (wayfinder lives in require).
        if [ "$run" = true ]; then
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts
        else
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts
        fi

        # The throwaway env (see the header): .env.example ships DB_CONNECTION=mysql, but there is
        # no MySQL on the runner. Rewrite to sqlite against an empty file so artisan boots. This .env
        # is disposable — deploy workflows rsync with --exclude '.env', so it never reaches a server.
        cp .env.example .env
        sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
        touch database/database.sqlite
        php artisan key:generate --force
        php artisan package:discover --ansi
        php -v
        # Run it here rather than letting the Vite plugin invoke it: the plugin hides stderr and
        # reports only "Command failed".
        echo "=== wayfinder:generate (stderr visible) ==="
        # shellcheck disable=SC2086
        php artisan wayfinder:generate $WAYFINDER_ARGS

        npm ci
        npm run build

        if [ "$run" = true ]; then
          # Migrations must apply cleanly from zero — the cheapest catch for a migration that only
          # works against an already-populated database.
          php artisan migrate --force
          if [ -f vendor/bin/pest ]; then
            vendor/bin/pest --ci --exclude-group=heavy   # light lane; ci-heavy.yml runs the full suite
          elif [ -f vendor/bin/phpunit ]; then
            echo "::notice::No Pest binary — falling back to PHPUnit."
            vendor/bin/phpunit --exclude-group=heavy
          else
            echo "::error::RUN_TESTS is true but neither vendor/bin/pest nor vendor/bin/phpunit exists. Add a test runner, or set RUN_TESTS=false."
            exit 1
          fi
        fi
      # EDIT: measured (#572): the slowest Laravel adopter's build ran p99 20 / max 26 min. Keep this
      # well above YOUR p99 — below it a slow but healthy suite goes red (`gh run view <id>` per job).
      full-timeout-minutes: 45
      #
      # EDIT: self-hosted runners — `classes` runs each job on ["self-hosted", <class>]: `trunk` on a
      # trunk ref, else `quick` or `full` (CONVENTIONS.md §7, "Runner classes"). A public repo keeps
      # the default, ubuntu-latest. A bare label or a JSON label list also works.
      # runs-on: classes
      # runner-lane: my-repo-lane # only for a capped lane (rule 3)
      #
      # EDIT: name your trunk-only jobs below (deploy, publish) when they sit outside the gate (#717).
      # trunk-only-jobs: Deploy
      #
      # EDIT: bump deliberately, not automatically.
      # gitleaks-version: "8.30.1"

  # Your own jobs go here, beside the call. Behind the gate (they skip when the tree already passed):
  #   needs: ci
  #   if: ${{ !cancelled() && needs.ci.result == 'success' && needs.ci.outputs.tested != 'true' }}
  # Trunk-only and ungated: no `if:` on the guard, and list the job's name in `trunk-only-jobs` above.

  # ---------------------------------------------------------------------------
  # Migration round-trip — see the header for what each engine catches.
  #
  #   1. migrate            from zero                                (schema snapshot A)
  #   2. migrate:rollback   back to the OLDEST migration this change adds OR modifies —
  #                         every down() it touched runs, plus the untouched ones after
  #                         it (all migrations when the change touches none)
  #   3. seed               only if ROUNDTRIP_SEEDER is set, and only when the change
  #                         touches migrations: rows land at the PRE-change schema
  #   4. migrate            again — the touched migrations land on those rows (snapshot B)
  #   5. compare            B must equal A — a down() that does not exactly undo its
  #                         up() leaves a schema that differs on the second pass
  #
  # MODIFIED counts as touched, not only added (#507): a branch that only repairs an
  # existing down() must see that down() run, and a branch that adds one migration and
  # repairs an older one must roll back past the older one, not just the newest step.
  #
  # Steps 2-4 are the shape of a real deploy: new migrations landing on tables that
  # already hold rows written before they existed. That is why the seed sits BETWEEN
  # the rollback and the second migrate — rows seeded after the new migrations would
  # already satisfy them (a NOT NULL column filled, a narrowed number in range) and
  # every data-dependent trap would pass.
  # ---------------------------------------------------------------------------
  migrations:
    name: Migration round-trip (${{ matrix.engine }})
    needs: ci
    # Behind the gate: runs where the call tested this tree, skips where the gate reused a green
    # run of it. An explicit result check, not the implicit success() (#418).
    if: ${{ !cancelled() && needs.ci.result == 'success' && needs.ci.outputs.tested != 'true' }}
    runs-on: ubuntu-latest # EDIT: self-hosted → a class, never a host: e2e (service containers) (CONVENTIONS.md §7, "Runner classes").
    timeout-minutes: 15 # a hung round-trip must not hold the runner for the 360-minute default (#572).
    # EDIT: measured (#572): p99 under 4 min / max 5 min on every adopter. Keep it well above your own p99.
    strategy:
      fail-fast: false
      matrix:
        # EDIT: one row for the engine the tests run on, one for the engine PRODUCTION
        # runs on, at production's exact version. Deploy engine is sqlite too? Delete
        # the server row. MySQL, not MariaDB? Swap in the commented row. A server row
        # whose version differs from production proves nothing about production.
        include:
          - engine: sqlite
            connection: sqlite
            image: ''            # empty image = no service container for this row
            health: 'true'
          - engine: mariadb
            connection: mariadb  # Laravel 11+; use `mysql` on older frameworks
            image: mariadb:11.4  # EDIT: the version the deploy target runs
            health: healthcheck.sh --connect --innodb_initialized
          # - engine: mysql
          #   connection: mysql
          #   image: mysql:8.4   # EDIT: the version the deploy target runs
          #   health: mysqladmin ping -h 127.0.0.1 -proot
    services:
      db:
        image: ${{ matrix.image }}
        env:
          # A disposable server inside one job; this password never leaves the runner.
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: roundtrip
        # Container port only, no fixed host port: a shared self-hosted runner may
        # already listen on 3306 (README, "Self-hosted patterns"). The host port is
        # read back from job.services below.
        ports:
          - 3306
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      # EDIT: a seeder class that leaves REPRESENTATIVE rows — NULLs where a column
      # allows them, rows a new foreign key would orphan, numbers near a column's
      # limits. Empty = no seeding, and the data-dependent traps in the header pass.
      # It runs against the schema BEFORE this change, so it writes the way old data
      # looks: raw DB::table() inserts into long-lived columns, not factories that
      # fill whatever columns the models know about today.
      ROUNDTRIP_SEEDER: ""
      # EDIT: where this repo keeps migrations.
      MIGRATIONS_PATH: database/migrations
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Full history: the count step diffs the migrations this change touches against trunk.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.ci.outputs.php-version }}
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_mysql, bcmath, intl # EDIT: add what this app needs.
          coverage: none

      - name: Composer install
        # Dev dependencies included: seeders usually build rows through factories.
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Point the app at this row's engine
        env:
          ENGINE: ${{ matrix.engine }}
          CONNECTION: ${{ matrix.connection }}
          DB_SERVICE_PORT: ${{ job.services.db.ports['3306'] }}
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate --force
          # Real environment variables win over .env (Laravel loads it immutably), so
          # the connection is set here rather than by rewriting .env.example's lines.
          # DB_URL is blanked: when set, it overrides every DB_* below.
          {
            echo "DB_CONNECTION=$CONNECTION"
            echo "DB_URL="
          } >> "$GITHUB_ENV"
          if [ "$ENGINE" = sqlite ]; then
            : > database/roundtrip.sqlite   # truncate: a reused workspace must still start from zero
            echo "DB_DATABASE=$PWD/database/roundtrip.sqlite" >> "$GITHUB_ENV"
          else
            {
              echo "DB_HOST=127.0.0.1"
              echo "DB_PORT=$DB_SERVICE_PORT"
              echo "DB_DATABASE=roundtrip"
              echo "DB_USERNAME=root"
              echo "DB_PASSWORD=root"
            } >> "$GITHUB_ENV"
          fi

      - name: Discover packages
        run: php artisan package:discover --ansi

      - name: Find the migrations this change adds or modifies
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Trunk from .github/project.yml, else the repo's default branch. A pull
          # request compares against its own base instead.
          trunk="$(sed -nE 's/^trunk:[[:space:]]*"?([^"#[:space:]]+)"?.*/\1/p' .github/project.yml 2>/dev/null | head -1 || true)"
          base_ref="origin/${GITHUB_BASE_REF:-${trunk:-$DEFAULT_BRANCH}}"
          base=""
          if git rev-parse -q --verify "$base_ref" >/dev/null; then
            base="$(git merge-base HEAD "$base_ref")"
            # On trunk itself the merge-base is HEAD: judge the commit that just landed.
            if [ "$base" = "$(git rev-parse HEAD)" ]; then
              base="$(git rev-parse -q --verify 'HEAD^' || true)"
            fi
          fi
          # Added, Modified, and Renamed (a rename is a new name to the migrator) — not
          # added only (#507): a branch that only repairs an existing down() got a green
          # round-trip that never ran it.
          touched=""
          if [ -n "$base" ]; then
            touched="$(git diff --name-status --diff-filter=AMR "$base" HEAD -- "$MIGRATIONS_PATH" | awk -F'\t' '$NF ~ /\.php$/ { print substr($1,1,1) "\t" $NF }')"
          fi
          # The migrator orders by file name, so the oldest touched one is the smallest
          # base name; step 2 rolls back to it and everything after it.
          from="$(printf '%s\n' "$touched" | awk -F'\t' 'NF { n=$2; sub(/.*\//, "", n); sub(/\.php$/, "", n); print n }' | LC_ALL=C sort | head -1)"
          echo "ROUNDTRIP_FROM=$from" >> "$GITHUB_ENV"
          if [ -n "$from" ]; then
            added="$(printf '%s\n' "$touched" | grep -c '^A' || true)"
            modified="$(printf '%s\n' "$touched" | grep -c '^[MR]' || true)"
            echo "This change touches migrations (vs ${base_ref}): $added added, $modified modified. Step 2 rolls back to the oldest, $from, so every down() listed below runs:"
            printf '%s\n' "$touched" | sed 's/^A\t/  added     /; s/^[MR]\t/  modified  /'
          else
            echo "This change adds or modifies no migrations (vs ${base_ref:-nothing}); step 2 rolls back all of them."
          fi

      - name: Write the schema snapshot script
        run: |
          # Tables, columns, indexes and foreign keys through the framework's own schema
          # builder (Laravel 11+), so the same script reads sqlite and MariaDB/MySQL and
          # needs no mysqldump/sqlite3 client on the runner. The migrations table is
          # left out: its batch numbers differ between passes by design.
          cat > "$RUNNER_TEMP/schema-snapshot.php" <<'PHP'
          <?php
          require getcwd() . '/vendor/autoload.php';
          $app = require getcwd() . '/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $schema = Illuminate\Support\Facades\Schema::connection(null);
          $m = config('database.migrations');
          $skip = is_array($m) ? ($m['table'] ?? 'migrations') : ($m ?: 'migrations');
          $current = method_exists($schema, 'getCurrentSchemaName') ? $schema->getCurrentSchemaName() : null;
          $out = [];
          foreach ($schema->getTables() as $t) {
              $name = $t['name'];
              if ($name === $skip || str_starts_with($name, 'sqlite_')) continue;
              if ($current !== null && isset($t['schema']) && $t['schema'] !== $current) continue;
              $idx = $schema->getIndexes($name);
              usort($idx, fn ($a, $b) => strcmp($a['name'], $b['name']));
              $fks = $schema->getForeignKeys($name);
              usort($fks, fn ($a, $b) => strcmp(json_encode($a), json_encode($b)));
              $out[$name] = ['columns' => $schema->getColumns($name), 'indexes' => $idx, 'foreign_keys' => $fks];
          }
          ksort($out);
          echo json_encode($out, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), "\n";
          PHP
          # How many migrations step 2 must roll back to reach ROUNDTRIP_FROM: the rows of
          # the migrations table at or after it. Read from the table, not by counting
          # files, so migrations a package registers from another path are counted too.
          cat > "$RUNNER_TEMP/rollback-steps.php" <<'PHP'
          <?php
          require getcwd() . '/vendor/autoload.php';
          $app = require getcwd() . '/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $m = config('database.migrations');
          $table = is_array($m) ? ($m['table'] ?? 'migrations') : ($m ?: 'migrations');
          echo Illuminate\Support\Facades\DB::table($table)->where('migration', '>=', getenv('ROUNDTRIP_FROM'))->count(), "\n";
          PHP

      - name: 1. migrate from zero
        run: |
          php artisan migrate --force
          php "$RUNNER_TEMP/schema-snapshot.php" > "$RUNNER_TEMP/schema-a.json"

      - name: 2. roll back
        run: |
          set -euo pipefail
          steps=0
          if [ -n "$ROUNDTRIP_FROM" ]; then
            steps="$(php "$RUNNER_TEMP/rollback-steps.php")"
          fi
          if [ "$steps" -gt 0 ]; then
            echo "Rolling back $steps migration(s), down to $ROUNDTRIP_FROM."
            php artisan migrate:rollback --step="$steps" --force
          else
            # Everything ran in one batch at step 1, so this rolls all of it back.
            php artisan migrate:rollback --force
          fi

      - name: 3. seed rows at the pre-change schema
        # No touched migrations = nothing lands on the rows, and the schema is empty anyway.
        if: env.ROUNDTRIP_SEEDER != '' && env.ROUNDTRIP_FROM != ''
        run: php artisan db:seed --class="$ROUNDTRIP_SEEDER" --force

      - name: 4. migrate again
        run: |
          php artisan migrate --force
          php "$RUNNER_TEMP/schema-snapshot.php" > "$RUNNER_TEMP/schema-b.json"

      - name: 5. the second pass must leave the same schema as the first
        run: |
          if ! diff -u "$RUNNER_TEMP/schema-a.json" "$RUNNER_TEMP/schema-b.json"; then
            echo "::error::Schema after rollback + re-migrate differs from the first migrate (${{ matrix.engine }}). A down() does not exactly undo its up(); the diff above shows what the second pass left different."
            exit 1
          fi
          echo "Round-trip clean on ${{ matrix.engine }}."
