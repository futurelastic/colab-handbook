# Deploy (container, platform adapter) — TEMPLATE. Copy me into your repo at .github/workflows/deploy-container.yml.
#
# This is a starting point, not a dependency. Once you copy it, YOU OWN THIS FILE.
# Edit it freely; nothing calls this file remotely and nothing will update it for you.
#
# EDIT POINTS are marked `# EDIT:` — walk them once after copying.
#
# It needs its two scripts beside each other in your repo (copy-and-own as well):
#   colab template deploy-container-run.mjs     --dest .github/deploy/deploy-container-run.mjs
#   colab template deploy-adapter-portainer.mjs --dest .github/deploy/deploy-adapter-portainer.mjs
#
# For: a container app whose host runs a platform with an API (Portainer today). ONE CONTRACT,
# every host (colab-handbook #452):
#   1. build every image ONCE per final tag — tagged vX.Y.Z and the commit sha — and push it;
#   2. run your pre-deploy hook (a database snapshot, say) — a failure stops before anything changes;
#   3. tell the platform "run exactly vX.Y.Z", all images in one call;
#   4. green only on a verified running version: the platform's own state (the stack settled, the
#      commit it deployed, the image its containers run), then release.health-url reporting X.Y.Z;
#   5. a failure after the platform accepted the call rolls back to what ran before and still fails
#      the run. ROLLBACK BY HAND = run this workflow (Actions → Run workflow) with the previous tag.
# The outcome — "running vX.Y.Z at <time>", or the failure — is written to the run summary and to
# the release issue when there is one.
#
# NOT for: shared hosting without a container runtime (templates/deploy-xserver.yml), or a host
#      that pulls its own updates (a platform polling a branch) — that is a different shape.
#
# ─────────────────────────────────────────────────────────────────────────────
# THIS FILE DOES NOT CHANGE YOUR REPO'S EXPOSURE (OR LEGACY TIER).
#
# It is the `deploy: tag` shape with an in-repo deploy workflow (`channels: [workflow]`). A tag
# push deploys only where project.yml already says `deploy: tag`; adopting this file is not the
# checklist that changes that (CONVENTIONS.md §9).
#
# TWO ENTRY POINTS, ONE DEPLOY PATH:
#   - route deploy-tag: a human pushes (or the Releases page creates) the final vX.Y.Z → the
#     `push: tags` trigger below.
#   - route deploy-tag-fast: release-auto.yml tags the final itself, and a tag pushed with
#     GITHUB_TOKEN starts no `push: tags` run — so its `deploy` job calls THIS file through
#     `workflow_call` (templates/release-auto.yml shows the job to paste). Same steps, same checks.
#
# SECRETS ARE NAMED HERE, NEVER VALUED.
#   - `secrets.PORTAINER_API_KEY` — ONE KEY PER APP, the access token of a NON-ADMIN platform user
#     that owns only this app's stack. Never an admin key: a leaked deploy key must reach one app.
#   - `secrets.REGISTRY_PASSWORD` — optional; the registry login falls back to the job's
#     `github.token`, which is enough for GHCR with `packages: write`.
# Everything else is configuration in the env block of the last step.
#
# TOPOLOGY. Every server runs its own Portainer — there is no central panel and no Portainer
# Agent. So the per-app configuration is THAT host's Portainer URL + endpointId + stack id + key.
# Hosts are named by DNS name, never by address. The runner reaches the platform directly on the
# LAN or over a VPN — this file does not care which, as long as `runs-on` is a runner that can.
#
# EVERY REDEPLOY RECREATES THE CONTAINERS, even when the compose file did not change (measured on
# Portainer CE 2.45.1) — expect a short restart on every deploy, a rollback included.
#
# YOUR COMPOSE FILE names each image as `<image-ref>:${IMAGE_TAG}`. The adapter sets IMAGE_TAG in
# the stack's environment and sends the WHOLE current environment back — the platform replaces the
# list wholesale, so a partial list would delete your other variables.

name: Deploy (container)

on:
  push:
    tags: ["v*.*.*", "!v*.*.*-*"] # finals only — a candidate vX.Y.Z-rc.N never deploys
  workflow_dispatch:
    inputs:
      tag:
        description: "Final tag to deploy (vX.Y.Z) — the previous one rolls back by hand"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Final tag to deploy (vX.Y.Z)"
        required: true
        type: string
      health-url:
        description: "Version URL (release.health-url); read from .github/project.yml when empty"
        required: false
        type: string
        default: ""
    secrets:
      PORTAINER_API_KEY:
        required: false
      REGISTRY_PASSWORD:
        required: false

# One deploy at a time per repo, never cancelled half-way: a cancelled deploy is a stack in an
# unknown state. A fixed group, because under workflow_call `github.workflow` is the CALLER's name.
concurrency:
  group: deploy-container-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy the final
    runs-on: ubuntu-latest # EDIT: a runner that reaches your platform (LAN or VPN) and has docker.
    environment: production # EDIT: the GitHub environment holding PORTAINER_API_KEY, or remove.
    permissions:
      contents: read # check out the tag
      packages: write # push the images (GHCR); drop it for another registry
      issues: write # record the outcome on the release issue
    timeout-minutes: 45
    steps:
      - name: Resolve the tag to deploy
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$TAG\" is not a final tag vX.Y.Z — a candidate (-rc.N) or a branch never deploys"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0 # every tag: the rollback target is the previous final
          persist-credentials: false # nothing here pushes to git

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Log in to the image registry
        env:
          REGISTRY: ghcr.io # EDIT: your registry host
          REGISTRY_USER: ${{ github.actor }} # EDIT: the registry user, when not GHCR
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD || github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Build once, run exactly this tag, verify (deploy-container-run)
        env:
          DEPLOY_ADAPTER: portainer
          # EDIT: every image this stack runs, one per line: <image-ref> <build-context> [<dockerfile>].
          DEPLOY_IMAGES: |
            ghcr.io/${{ github.repository }} .
          # EDIT: optional — runs before the platform is called, with TAG and PREVIOUS_TAG set; a
          # non-zero exit stops the deploy before anything changes (a database snapshot, say).
          PRE_DEPLOY: ""
          PORTAINER_URL: https://portainer.app.example.com # EDIT: this host's own Portainer
          PORTAINER_ENDPOINT_ID: "1" # EDIT
          PORTAINER_STACK_ID: "1" # EDIT
          PORTAINER_STACK_KIND: git # EDIT: git (the stack pulls this repo at the tag) | file
          PORTAINER_COMPOSE_FILE: docker-compose.yml # file stacks only: sent as the stack content
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          HEALTH_URL: ${{ inputs.health-url }} # empty → release.health-url in .github/project.yml
          VERIFY_TIMEOUT_SECONDS: "600" # EDIT: how long the new version may take to report itself
          DEPLOY_TIMEOUT_SECONDS: "600"
          BUSY_TIMEOUT_SECONDS: "600"
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: node .github/deploy/deploy-container-run.mjs --tag "$TAG"
