# CI (Python) — TEMPLATE. Copy me into your repo at .github/workflows/ci.yml.
#
# This is a starting point, not a dependency. Once you copy it, YOU OWN THIS FILE.
# Edit it freely: rename jobs, add steps, drop the parts you do not need. Nothing
# calls this file remotely and nothing will update it for you — divergence between
# your copy and the handbook is expected and fine. If you find an improvement worth
# sharing, change the handbook template too, but that is a manual, deliberate act.
#
# EDIT POINTS are marked `# EDIT:` — walk them once after copying.
#
# For: Python projects — FastAPI/Flask services, CLI tools, libraries.
#
# HYBRID REPOS (a Python backend plus a Node/Vite frontend in one repo) are a real
# and common shape here, and this template covers HALF of one. Do not copy the Node
# template and graft a Python job into it: the header then lies about what the file
# is, and that is exactly how a repo ended up with `python-version: "3.13"` hardcoded
# — the Node template's own rule 1 forbids hardcoding, but there was nowhere to
# declare a Python version, so the repo had no honest alternative. Instead:
#
#   1. copy THIS file to .github/workflows/ci.yml,
#   2. copy the `build:` job out of ci-node.yml and paste it in alongside,
#   3. keep BOTH "Resolve … version" steps — each ecosystem resolves independently,
#      and neither may be hardcoded,
#   4. stamp the file with whichever template you copied first, and say in a comment
#      that the other job came from the other template.
#
# NOT for: Laravel + Inertia fullstack apps — use ci-laravel.yml.
#
# What it does:
#   0. Fail on a .github/project.yml value colab would silently ignore (ship-batch, #416).
#   1. Resolve the Python version from declared sources — never a hardcoded default.
#   2. Secret scan with gitleaks (pinned release binary, see note at the step).
#   3. Install dependencies from whichever manifest the repo actually has.
#   4. Byte-compile — the cheapest possible "does it even parse" gate.
#   5. Run lint / tests only if the repo has them, so a repo without a suite is not
#      forced to add placeholders to keep CI green.

name: CI

on:
  push:
    # Every branch, not only trunk (#384). Sessions push branches without opening a
    # PR, so a trunk-only trigger leaves a candidate with no run of its own before the
    # merge: its first run is the post-merge trunk run, and a red there is everyone's
    # TRUNK RED instead of one implementer's hand-back (CONVENTIONS.md §4, "Branch
    # CI"). '**' also covers `ship-batch/**`, the batch-landing opt-in.
    #
    # EDIT: on ONE self-hosted agent shared with trunk, go back to trunk-only until
    # trunk has its own lane — branch runs queue ahead of the one trunk run a merge
    # waits for (CONVENTIONS.md §7, "Self-hosted runners", #355). GitHub-hosted
    # runners, a runner pool, or a trunk-only label picked in `runs-on` on
    # github.ref all have that capacity; keep '**' there. Trunk-only means the
    # branches this repo actually has — and never drop `dev` on a Tier A or C repo:
    # dev is the trunk, so a main-only trigger runs zero checks on the branch you
    # merge into, and nothing looks broken (CONVENTIONS.md §7).
    branches: ['**']
  pull_request:
    # EDIT: keep only the branches this repo actually has (Tier A and C: dev is the
    # trunk, main the release; Tier B: main only).
    branches: [main, dev]
  # A promotion pushed by the release workflow's token triggers no push run, so that workflow
  # dispatches this one on main instead (templates/release-auto.yml, #440). Harmless elsewhere.
  workflow_dispatch:

# One live run per branch: a new push cancels the superseded run on the same ref.
# Trunk is NEVER cancelled — every trunk sha keeps a completed run of its own, which
# is what the merge gate reads (CONVENTIONS.md §4, "Branch CI"). Pull-request runs
# group under refs/pull/<n>/merge, apart from the branch's push runs.
# EDIT: name exactly this repo's trunk (and release branch) here. A Tier C trunk
# may carry any name; one left off this list gets its trunk runs cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

env:
  # EDIT: bump deliberately, not automatically.
  GITLEAKS_VERSION: "8.30.1"
  # EDIT: the importable package/directory to byte-compile. Often `src` or the app name.
  PACKAGE_DIR: "."

# Self-hosted runner? The job layout below assumes GitHub-hosted capacity — a
# fresh machine per job. With few self-hosted agents every job is a queue slot,
# jobs from different runs interleave, and trunk can wait behind branch runs.
# Read CONVENTIONS.md §7, "Self-hosted runners", before choosing a label.
jobs:
  # Already tested at this sha? (#418) — the claim push.
  # A session's claim pushes its branch at the moment it is cut (CONVENTIONS.md §5, the
  # claim record), so the branch's first push sits on a sha trunk has usually already
  # run. Without this job that push re-runs the whole suite on a tested commit (~19% of
  # all runs, measured across five adopting repos). This job runs ONLY on a ref's first
  # push (`github.event.created`), checks nothing out, and asks one question: does THIS
  # workflow already have a completed, green, non-PR run at THIS exact sha? Yes → every
  # other job is skipped and the run concludes `success` — a branch-CI `green` that is
  # true, because the same workflow passed at the same sha. Anything else — trunk still
  # running, red, never run, `gh` missing, the API failing — and the suite runs as
  # before (fail-open: this job never fails the run). Every later push has
  # `created == false`, so a real commit always gets the full suite, with no extra hop.
  # Why not simply `if: !github.event.created` on every job: a run whose jobs are ALL
  # skipped concludes `skipped`, which `colab ship` reads as not-green (CONVENTIONS.md
  # §4, "Branch CI"). This job is the one that ends green.
  dedupe:
    name: Already tested at this sha?
    if: github.event_name == 'push' && github.event.created
    runs-on: ubuntu-latest # EDIT: the same label as the jobs below; it needs `gh` (GitHub-hosted images have it).
    permissions:
      actions: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - name: Look for a green run of this workflow at this sha
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          tested=false
          if ! command -v gh >/dev/null 2>&1; then
            echo "::notice::gh is not installed on this runner — running the full suite (#418)."
          elif ! WFID="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .workflow_id 2>/dev/null)" || [ -z "$WFID" ]; then
            echo "::notice::Could not read this run's workflow id — running the full suite (#418)."
          elif ! N="$(gh api "repos/$REPO/actions/workflows/$WFID/runs?head_sha=$SHA&status=success&per_page=20" \
                 --jq "[.workflow_runs[] | select(.id != $RUN_ID and .event != \"pull_request\")] | length" 2>/dev/null)"; then
            echo "::notice::Could not list this workflow's runs at $SHA — running the full suite (#418)."
          elif [ "${N:-0}" -ge 1 ] 2>/dev/null; then
            tested=true
            echo "This workflow already passed at $SHA ($N green run(s)) — skipping the suite (#418)."
            echo "Already tested: this workflow has a green run at \`$SHA\` — suite skipped (#418)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No green run of this workflow at $SHA yet — running the full suite."
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  gitleaks:
    name: Secret scan (gitleaks)
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.tested != 'true' }}
    runs-on: ubuntu-latest # EDIT: self-hosted label if this repo needs one.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Full history: gitleaks scans commits, not just the working tree, so a
          # secret that was committed and later removed is still caught.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned release binary)
        run: |
          # Deliberately NOT gitleaks/gitleaks-action@v2: that action requires a paid
          # GITLEAKS_LICENSE for repositories owned by an organization (free only for
          # personal repos). The release binary itself is MIT and has no such gate.
          # Repos also carry a local pre-commit gitleaks hook; this is the second layer.
          # The asset is OS/arch-specific, so resolve both from uname instead of
          # assuming the GitHub-hosted default: a hardcoded linux_x64 binary on a
          # macOS self-hosted runner is an ELF the kernel cannot exec, and the step
          # fails with exit 126 rather than anything mentioning the platform.
          case "$(uname -s)" in
            Darwin) os=darwin ;;
            Linux)  os=linux ;;
            *) echo "unsupported OS: $(uname -s)" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            arm64|aarch64) arch=arm64 ;;
            x86_64|amd64)  arch=x64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${os}_${arch}.tar.gz"
          # Into $RUNNER_TEMP, not /usr/local/bin: no sudo, no global write — the same
          # step then works on BOTH GitHub-hosted and shared self-hosted runners
          # (a shared runner is infrastructure; jobs must not mutate it).
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          rm -f gitleaks.tar.gz

      - name: gitleaks detect
        run: gitleaks detect --source . --no-banner

  build:
    name: Build (Python)
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.tested != 'true' }}
    runs-on: ubuntu-latest # EDIT: self-hosted label if this repo needs one.
    defaults:
      run:
        # EDIT: set to the directory holding the Python project if it is not at the root.
        working-directory: .
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # ---------------------------------------------------------------------------
      # Descriptor check (#416). A value `colab ship` cannot use does not fail there —
      # it fails closed to the safe default, silently. `ship-batch: 5` (the cap is 3)
      # once turned every landing in a busy repo back to serial while this CI stayed
      # green; only a ship dry run noticed. So the value fails HERE, where the person
      # who changed project.yml is looking. Same rule as `colab ship` and the audit
      # (tools/lib/ship-batch.js parseShipBatch): absent/empty/null, or 1–3. Why the
      # cap is 3: project.schema.md, `ship-batch`.
      # ---------------------------------------------------------------------------
      - name: Descriptor check (.github/project.yml)
        working-directory: ${{ github.workspace }}
        run: |
          [ -f .github/project.yml ] || exit 0
          line="$(grep -E '^ship-batch[[:space:]]*:' .github/project.yml | head -1 || true)"
          [ -n "$line" ] || exit 0
          v="$(printf '%s\n' "$line" | sed -E -e 's/^ship-batch[[:space:]]*:[[:space:]]*//' \
                -e 's/[[:space:]]+#.*$//' -e 's/[[:space:]]+$//' \
                -e 's/^"(.*)"$/\1/' -e "s/^'(.*)'\$/\\1/")"
          case "$v" in
            ''|'~'|null|1|2|3) echo "ship-batch: ${v:-absent} — ok" ;;
            *)
              echo "::error file=.github/project.yml::ship-batch is '$v', expected an integer 1-3 (omit for serial). colab ship ignores any other value and lands serially. Why the cap is 3: project.schema.md, ship-batch."
              exit 1 ;;
          esac

      # ---------------------------------------------------------------------------
      # Toolchain resolution. Precedence, highest first:
      #   1. .github/project.yml    ->  python: <version>
      #   2. .python-version        (pyenv; also what most local tooling reads)
      #   3. pyproject.toml         ->  [project] requires-python
      #   4. FAIL.
      #
      # NOTE what is NOT on that list: requirements.txt. It pins DEPENDENCIES, never
      # the interpreter — a repo with only a requirements.txt has declared nothing
      # about which Python it runs on, and this workflow will (correctly) stop and
      # say so. Add `python:` to project.yml or a `.python-version`; do not paper
      # over it with a hardcoded version here.
      #
      # There is deliberately NO fallback default. A silent default is exactly how a
      # repo here ended up building on Node 20 in CI while deploying on Node 22 —
      # CI was green and proved nothing about what actually shipped. Python has the
      # same failure with sharper edges: a minor is a real feature release, so 3.12
      # vs 3.13 is not a cosmetic difference.
      # ---------------------------------------------------------------------------
      - name: Resolve Python version
        id: toolchain
        run: |
          set -euo pipefail

          # ">=3.13" / "~=3.12" / "3.13.1" / "3.13" -> "3.13" / "3.12" / "3.13.1"
          normalise() {
            printf '%s' "$1" \
              | tr -d '"' \
              | sed -E 's/^[^0-9]*//' \
              | sed -E 's/[[:space:],].*$//' \
              | sed -E 's/\.(x|\*)$//' \
              | sed -E 's/[^0-9.].*$//' \
              | sed -E 's/\.$//'
          }

          PY_VERSION=""
          SOURCE=""

          # 1. project.yml wins. Flat `python: 3.13` mapping; good enough, this file
          #    is a handful of keys by design.
          if [ -f .github/project.yml ]; then
            V="$(sed -nE 's/^[[:space:]]*python:[[:space:]]*"?([^"#[:space:]]+)"?.*/\1/p' .github/project.yml | head -1 || true)"
            if [ -n "$V" ] && [ "$V" != "null" ]; then
              PY_VERSION="$(normalise "$V")"; SOURCE=".github/project.yml (python:)"
            fi
          fi

          # 2. .python-version
          if [ -z "$PY_VERSION" ] && [ -f .python-version ]; then
            V="$(grep -vE '^[[:space:]]*(#|$)' .python-version | head -1 | tr -d '[:space:]' || true)"
            if [ -n "$V" ]; then
              PY_VERSION="$(normalise "$V")"; SOURCE=".python-version"
            fi
          fi

          # 3. pyproject.toml -> [project] requires-python. Read with a line match, not
          #    a TOML parser: the field is a single top-level string and the runner is
          #    not guaranteed to have tomllib available before setup-python has run.
          if [ -z "$PY_VERSION" ] && [ -f pyproject.toml ]; then
            V="$(sed -nE 's/^[[:space:]]*requires-python[[:space:]]*=[[:space:]]*["'"'"']([^"'"'"']+)["'"'"'].*/\1/p' pyproject.toml | head -1 || true)"
            if [ -n "$V" ]; then
              PY_VERSION="$(normalise "$V")"; SOURCE="pyproject.toml (requires-python)"
            fi
          fi

          # 4. No declared source -> stop. Do not guess.
          if [ -z "$PY_VERSION" ]; then
            echo "::error::No Python version is declared in this repository, and this workflow refuses to guess one."
            {
              echo ""
              echo "Declare it in ONE of these places (checked in this order):"
              echo "  1. .github/project.yml  ->  python: \"3.13\"   (preferred: one descriptor for the whole repo)"
              echo "  2. .python-version      ->  3.13              (also drives local dev via pyenv)"
              echo "  3. pyproject.toml       ->  [project] requires-python = \">=3.13\""
              echo ""
              echo "requirements.txt does NOT count — it pins dependencies, not the interpreter."
              echo "Pick the version your DEPLOY target runs. CI on a different minor than"
              echo "production proves less than you think."
            } >&2
            exit 1
          fi

          echo "python-version=$PY_VERSION" >> "$GITHUB_OUTPUT"
          echo "Python $PY_VERSION (resolved from: $SOURCE)"
          echo "Python **$PY_VERSION** — resolved from \`$SOURCE\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ steps.toolchain.outputs.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Whichever manifest the repo actually has. A packaged project (pyproject)
          # installs itself so imports resolve the way they will in production;
          # a plain requirements.txt service just installs its pins.
          if [ -f pyproject.toml ]; then
            pip install -e .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "::warning::No pyproject.toml or requirements.txt — nothing to install."
          fi

      - name: Byte-compile
        # The cheapest gate there is: every module parses. Catches the syntax error
        # that only ever runs on a code path nobody tests.
        run: python -m compileall -q "$PACKAGE_DIR"

      - name: Detect optional tooling
        id: tools
        run: |
          # EDIT: add the tools this repo uses. Each is optional so a repo without it
          # is not forced to adopt one to keep CI green.
          # Because a tool missing here SKIPS its step and the job still concludes
          # `success`, the files installed from above and here are part of the
          # instrument: `colab ship`'s cure rule refuses a branch that changes them
          # while trunk is red (CONVENTIONS.md §5, cure rule condition 6, #377). Installing
          # from a file this template does not name (a lockfile, a new include)?
          # Extend that rule's list, or accept that the cure rule cannot see it.
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          for t in ruff mypy pytest; do
            if python -m "$t" --version >/dev/null 2>&1; then
              echo "$t=true" >> "$GITHUB_OUTPUT"
            else
              echo "$t=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$t not installed — skipping."
            fi
          done

      - name: Lint (ruff)
        if: steps.tools.outputs.ruff == 'true'
        run: python -m ruff check .

      - name: Typecheck (mypy)
        if: steps.tools.outputs.mypy == 'true'
        run: python -m mypy "$PACKAGE_DIR"

      - name: Test (pytest)
        if: steps.tools.outputs.pytest == 'true'
        run: python -m pytest -q
