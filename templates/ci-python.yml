# CI (Python) — TEMPLATE. Copy me into your repo at .github/workflows/ci.yml.
#
# This is a starting point, not a dependency. Once you copy it, YOU OWN THIS FILE.
# Edit it freely: rename jobs, add steps, drop the parts you do not need. Nothing
# calls this file remotely and nothing will update it for you — divergence between
# your copy and the handbook is expected and fine. If you find an improvement worth
# sharing, change the handbook template too, but that is a manual, deliberate act.
#
# EDIT POINTS are marked `# EDIT:` — walk them once after copying.
#
# For: Python projects — FastAPI/Flask services, CLI tools, libraries.
#
# HYBRID REPOS (a Python backend plus a Node/Vite frontend in one repo) are a real
# and common shape here, and this template covers HALF of one. Do not copy the Node
# template and graft a Python job into it — the header then lies about what the file
# is, and the Python version ends up hardcoded. Instead:
#
#   1. copy THIS file to .github/workflows/ci.yml,
#   2. copy the `build:` job out of ci-node.yml and paste it in alongside,
#   3. keep BOTH "Resolve … version" steps — each ecosystem resolves independently,
#      and neither may be hardcoded,
#   4. stamp the file with whichever template you copied first, and say in a comment
#      that the other job came from the other template.
#
# NOT for: Laravel + Inertia fullstack apps — use ci-laravel.yml.
#
# What it does:
#   0. Fail on a .github/project.yml value colab would silently ignore (ship-batch, #416;
#      ship-batch-wait, #555; ci-wait-factor, #564).
#   1. Resolve the Python version from declared sources — never a hardcoded default.
#   2. Secret scan with gitleaks (pinned release binary, see note at the step).
#   3. Install dependencies from whichever manifest the repo actually has.
#   4. Byte-compile — the cheapest possible "does it even parse" gate.
#   5. Run lint / tests only if the repo has them, so a repo without a suite is not
#      forced to add placeholders to keep CI green.
#   6. Opt-in, commented: a Migration round-trip for `migration-grant: reviewer` (#625) —
#      `colab template ci-python --roundtrip` writes it live at copy.
#
# LIGHT LANE (#607): this file runs on every push and is what `colab ship` reads. Keep it
# fast — secret scan, build, typecheck/lint, the fast tests (target: under 5 minutes).
# The full suite, integration, e2e and load tests belong in the HEAVY lane,
# templates/ci-python-heavy.yml copied to .github/workflows/ci-heavy.yml: it runs nightly
# and on every release candidate/tag, never per merge. Tests are light unless marked heavy:
#   the pytest marker `@pytest.mark.heavy` (register it in pytest.ini / pyproject.toml).

name: CI

on:
  push:
    # Every branch, not only trunk (#384). Sessions push branches without opening a
    # PR, so a trunk-only trigger leaves a candidate with no run of its own before the
    # merge: its first run is the post-merge trunk run, and a red there is everyone's
    # TRUNK RED instead of one implementer's hand-back (CONVENTIONS.md §4, "Branch
    # CI"). '**' also covers `ship-batch/**`, the batch-landing opt-in.
    #
    # EDIT: on ONE self-hosted agent shared with trunk, go back to trunk-only until
    # trunk has its own lane — branch runs queue ahead of the one trunk run a merge
    # waits for (CONVENTIONS.md §7, "Self-hosted runners", #355). GitHub-hosted
    # runners, a runner pool, or a trunk-only label picked in `runs-on` on
    # github.ref all have that capacity; keep '**' there. Trunk-only means the
    # branches this repo actually has — and never drop `dev` on a Tier A or C repo:
    # dev is the trunk, so a main-only trigger runs zero checks on the branch you
    # merge into, and nothing looks broken (CONVENTIONS.md §7).
    branches: ['**']
    # Optional (#607): skip documentation-only pushes here, if you like. `colab ship` decides a
    # docs-only change from the diff and lands it without waiting for CI (CONVENTIONS.md §4,
    # "Docs-only — no CI wait"), so a docs push with no run does not hold a merge.
    # paths-ignore: ['**/*.md', 'docs/**']
  # No `pull_request:` here (#512). A branch with an open PR in this repository already
  # has a push run at the same head, and a `pull_request` run beside it doubled the CI
  # per commit while testing a merge ref instead of the sha that lands. Readers keep only
  # the newest run per workflow at a sha, so that second run also decided the verdict.
  # EDIT: a copy that went back to trunk-only push (above) has no run on a branch until it
  # has a PR — restore `pull_request: branches: [<trunk>]` there; that PR run is then its
  # only branch run (CONVENTIONS.md §4, "Branch CI"), so also delete the fork-PR term
  # (`github.event_name != 'pull_request' || …`) from every job's `if:` below, or it skips that run.
  # EDIT: fork PRs (#514). A push to a fork never runs a workflow here, so a repo that takes
  # PRs from forks needs `pull_request`. Uncomment it there. Every suite job below already
  # carries `github.event.pull_request.head.repo.full_name != github.repository` for a PR
  # event, so a same-repo PR's run skips every job (its push run is the one that tests) and a
  # fork PR's run tests. A skipped run never stands for a workflow that has a run that ran
  # (CONVENTIONS.md §4, "Branch CI"). Check every reader of your CI agrees before you uncomment.
  # pull_request:
  #   branches: ['**']
  # A promotion pushed by the release workflow's token triggers no push run, so that workflow
  # dispatches this one on main instead (templates/release-auto.yml, #440). Harmless elsewhere.
  workflow_dispatch:

# One live run per branch: a new push cancels the superseded run on the same ref.
# Trunk is NEVER cancelled — every trunk sha keeps a completed run of its own, which
# is what the merge gate reads (CONVENTIONS.md §4, "Branch CI"). A trunk run also gets a
# group of its own (the run id): GitHub cancels an older run that is still PENDING in a
# group even when cancel-in-progress is false, so a third quick merge would otherwise
# drop the second one's run before it ever started (#512).
# EDIT: name exactly this repo's trunk (and release branch) here — in the group, in
# cancel-in-progress, and in the `dedupe` job's `if:`. A Tier C trunk may carry any
# name; one left off this list gets its trunk runs cancelled. `colab template` writes these
# from the `trunk:` in .github/project.yml and prints what it wrote (#526).
concurrency:
  group: ci-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

env:
  # EDIT: bump deliberately, not automatically.
  GITLEAKS_VERSION: "8.30.1"
  # EDIT: the importable package/directory to byte-compile. Often `src` or the app name.
  PACKAGE_DIR: "."
  ##>>> migration round-trip (opt-in, #625) — uncomment to the closing fence
  # # EDIT: the command that applies every pending migration to $DATABASE_URL — e.g.
  # # `alembic upgrade head`, `python manage.py migrate --noinput`, `yoyo apply --batch -d "$DATABASE_URL" migrations`.
  # # Empty = the round-trip job is SKIPPED, and a skipped job never passes R: migrations ship
  # # on a human grant until this is set (#625). Here, not in the job, because a job-level
  # # `if:` cannot read `env` — the build job hands it on as an output.
  # ROUNDTRIP_APPLY: ""
  ##<<< migration round-trip

# Self-hosted runner? The job layout below assumes GitHub-hosted capacity — a
# fresh machine per job. With few self-hosted agents every job is a queue slot,
# jobs from different runs interleave, and trunk can wait behind branch runs.
# Read CONVENTIONS.md §7, "Self-hosted runners", before choosing a label.
jobs:
  # Already tested? This job is the one that concludes `success` when the suite is skipped: a
  # run whose jobs ALL skip concludes `skipped`, which `colab ship` reads as not-green.
  #   - At this SHA (#418): on a ref's first push (a claim push), a green non-PR run of this
  #     workflow at the same sha means the suite already ran.
  #   - At this TREE (#493): on a push to trunk, a green push run elsewhere whose commit has the
  #     byte-identical tree (a squash of a branch that already contained its base) is reused and
  #     cited in a `tree-already-green` notice. `tree-reuse: off` in .github/project.yml opts out.
  #     A run that skipped a job (a trunk-only job skips on branches) is never reused (#511), so
  #     never put a trunk-only job (publish, deploy, release) behind this gate.
  # Any doubt — no run, red, an API error — runs the full suite; this job never fails the run.
  dedupe:
    name: Already tested at this sha or tree?
    # EDIT: the trunk refs here mirror `concurrency`'s list above (#493).
    if: github.event_name == 'push' && (github.event.created || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest # EDIT: the same label as the jobs below; it needs `gh` (GitHub-hosted images have it).
    timeout-minutes: 5 # one `gh api` listing, a hung call must not hold the slot. EDIT: the default is 360.
    permissions:
      actions: read
      contents: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
      cited: ${{ steps.check.outputs.cited }}
    steps:
      - name: Look for a green run of this workflow at this sha or tree
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          CREATED: ${{ github.event.created }}
          REF_NAME: ${{ github.ref_name }}
          GUARD_NAME: Already tested at this sha or tree? # EDIT: this job's `name:`, if you rename it (#511).
        run: |
          tested=false
          cited=
          # #511: a cited run is reusable only if it skipped no job but this guard. A job gated on
          # the trunk ref is `skipped` on every branch push and a skipped job does not fail the
          # run, so citing that run would skip the trunk-only job on trunk a second time.
          reusable() {
            if ! SK="$(gh api "repos/$REPO/actions/runs/$1/jobs?per_page=100" \
                   --jq 'if .total_count > (.jobs | length) then "(more than 100 jobs)" else [.jobs[] | select(.conclusion == "skipped" and .name != env.GUARD_NAME) | .name] | join(", ") end' 2>/dev/null)"; then
              echo "::notice::Could not list the jobs of run $1 — running the full suite (#511)."
              return 1
            elif [ -n "$SK" ]; then
              echo "::notice::Run $1 skipped $SK, which this push may run — running the full suite (#511)."
              return 1
            fi
          }
          # The candidate runs, one per line as "<id> <head sha> <url> <branch>", newest first: green
          # push runs of this workflow on another ref of this repo. #552: those at THIS sha first (a
          # `ship-batch/*` run trunk fast-forwarded to), an exact query; then those whose commit has
          # THIS tree (#493). The query's own per_page bounds the walk (#592).
          same_sha() {
            gh api "repos/$REPO/actions/workflows/$WFID/runs?head_sha=$SHA&event=push&status=success&per_page=20" \
              --jq ".workflow_runs[] | select(.id != $RUN_ID and .head_branch != \"$REF_NAME\" and .head_repository.full_name == \"$REPO\") | \"\\(.id) \\(.head_sha) \\(.html_url) \\(.head_branch)\"" 2>/dev/null
          }
          same_tree() {
            gh api "repos/$REPO/actions/workflows/$WFID/runs?event=push&status=success&per_page=50" \
              --jq ".workflow_runs[] | select(.id != $RUN_ID and .head_branch != \"$REF_NAME\" and .head_repository.full_name == \"$REPO\" and .head_commit.tree_id == \"$OURS\") | \"\\(.id) \\(.head_sha) \\(.html_url) \\(.head_branch)\"" 2>/dev/null
          }
          # #592: cite the newest candidate on stdin that passes every check. One that fails a check
          # is passed over, not the end of the search: the newest green run can be a skip-chained one
          # (#511) while an older run at the same sha or tree ran every job. A run already tried (the
          # sha query's runs reappear in the tree listing) is not tried twice.
          cite() {
            local CID CSHA URL BR CTREE
            while read -r CID CSHA URL BR; do
              [ -n "$CID" ] || continue
              case " $TRIED " in *" $CID "*) continue ;; esac
              TRIED="$TRIED $CID"
              if ! CTREE="$(gh api "repos/$REPO/git/commits/$CSHA" --jq .tree.sha 2>/dev/null)" || [ "$CTREE" != "$OURS" ]; then
                echo "::notice::Could not confirm the tree of $CSHA — passing over run $CID (#493)."
              elif reusable "$CID"; then
                tested=true
                cited="$URL"
                echo "::notice title=tree-already-green::$URL tree=$OURS head=$CSHA branch=$BR"
                echo "Tree $OURS already passed this workflow at $CSHA on $BR ($URL) — skipping the suite (#493)."
                echo "Already tested: tree \`$OURS\` passed this workflow on \`$BR\` — [the run relied on]($URL); suite skipped (#493)." >> "$GITHUB_STEP_SUMMARY"
                return 0
              fi
            done
            return 1
          }
          if ! command -v gh >/dev/null 2>&1; then
            echo "::notice::gh is not installed on this runner — running the full suite (#418)."
          elif ! WFID="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .workflow_id 2>/dev/null)" || [ -z "$WFID" ]; then
            echo "::notice::Could not read this run's workflow id — running the full suite (#418)."
          elif [ "${CREATED:-}" = "false" ]; then
            # A non-creating push: trunk tree mode (#493). Every branch below but one runs the suite.
            if ! DESC="$(gh api "repos/$REPO/contents/.github/project.yml?ref=$SHA" -H 'Accept: application/vnd.github.raw' 2>/dev/null)" || [ -z "$DESC" ]; then
              echo "::notice::Could not read .github/project.yml at $SHA — running the full suite (#493)."
            elif grep -Eq '^tree-reuse[[:space:]]*:' <<< "$DESC"; then
              echo "::notice::tree-reuse is declared in .github/project.yml — running the full suite (#493)."
            elif [ "$(printf '%s\n' "$DESC" | sed -nE "s/^trunk:[[:space:]]*[\"']?([A-Za-z0-9._/-]+).*/\\1/p" | head -n 1)" != "$REF_NAME" ]; then
              echo "::notice::$REF_NAME is not this repo's trunk — running the full suite (#493)."
            elif ! OURS="$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha 2>/dev/null)" || [ -z "$OURS" ]; then
              echo "::notice::Could not read the tree of $SHA — running the full suite (#493)."
            else
              TRIED=
              SC="$(same_sha)" || SC=    # the sha query failing falls through to the tree listing (#552)
              if [ -n "$SC" ] && cite <<< "$SC"; then
                :
              elif ! TC="$(same_tree)"; then
                echo "::notice::Could not list this workflow's green runs — running the full suite (#493)."
              elif [ -z "$SC$TC" ]; then
                echo "No green run of this workflow on another ref has sha $SHA or tree $OURS — running the full suite."
              elif ! cite <<< "$TC"; then
                echo "No green run of this workflow at sha $SHA or tree $OURS can be cited — running the full suite (#592)."
              fi
            fi
          elif ! N="$(gh api "repos/$REPO/actions/workflows/$WFID/runs?head_sha=$SHA&status=success&per_page=20" \
                 --jq "[.workflow_runs[] | select(.id != $RUN_ID and .event != \"pull_request\")] | length" 2>/dev/null)"; then
            echo "::notice::Could not list this workflow's runs at $SHA — running the full suite (#418)."
          elif [ "${N:-0}" -ge 1 ] 2>/dev/null; then
            tested=true
            echo "This workflow already passed at $SHA ($N green run(s)) — skipping the suite (#418)."
            echo "Already tested: this workflow has a green run at \`$SHA\` — suite skipped (#418)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No green run of this workflow at $SHA yet — running the full suite."
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          [ -z "$cited" ] || echo "cited=$cited" >> "$GITHUB_OUTPUT"

  gitleaks:
    name: Secret scan (gitleaks)
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.tested != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest # EDIT: self-hosted label if this repo needs one.
    timeout-minutes: 15 # a scan of the checkout. EDIT: the default is 360.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Full history: gitleaks scans commits, not just the working tree, so a
          # secret that was committed and later removed is still caught.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned release binary)
        run: |
          # Deliberately NOT gitleaks/gitleaks-action@v2: that action requires a paid
          # GITLEAKS_LICENSE for repositories owned by an organization (free only for
          # personal repos). The release binary itself is MIT and has no such gate.
          # Repos also carry a local pre-commit gitleaks hook; this is the second layer.
          # The asset is OS/arch-specific, so resolve both from uname instead of
          # assuming the GitHub-hosted default: a hardcoded linux_x64 binary on a
          # macOS self-hosted runner is an ELF the kernel cannot exec, and the step
          # fails with exit 126 rather than anything mentioning the platform.
          case "$(uname -s)" in
            Darwin) os=darwin ;;
            Linux)  os=linux ;;
            *) echo "unsupported OS: $(uname -s)" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            arm64|aarch64) arch=arm64 ;;
            x86_64|amd64)  arch=x64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${os}_${arch}.tar.gz"
          # Into $RUNNER_TEMP, not /usr/local/bin: no sudo, no global write — the same
          # step then works on BOTH GitHub-hosted and shared self-hosted runners
          # (a shared runner is infrastructure; jobs must not mutate it).
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          rm -f gitleaks.tar.gz

      - name: gitleaks detect
        run: gitleaks detect --source . --no-banner

  build:
    name: Build (Python)
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.tested != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest # EDIT: self-hosted label if this repo needs one.
    timeout-minutes: 30 # a hung build must not hold the runner for the 360-minute default (#572).
    # EDIT: NOT a measured fit (#572) — one Python adopter, whose build is a byte-compile (p99
    # under 1 min). Set it well above YOUR p99 — below it a slow but healthy suite goes red.
    # Re-exported so the opt-in round-trip job below resolves Python exactly once, here.
    outputs:
      python-version: ${{ steps.toolchain.outputs.python-version }}
  ##>>> migration round-trip (opt-in, #625) — uncomment to the closing fence
  #     # `on` once ROUNDTRIP_APPLY is set; the round-trip job runs only then (#625).
  #     roundtrip: ${{ env.ROUNDTRIP_APPLY != '' && 'on' || 'off' }}
  ##<<< migration round-trip
    defaults:
      run:
        # EDIT: set to the directory holding the Python project if it is not at the root.
        working-directory: .
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # ---------------------------------------------------------------------------
      # Descriptor check (#416). A value `colab ship` cannot use does not fail there —
      # it fails closed to the safe default, silently. `ship-batch: 5` (the cap was 3)
      # once turned every landing in a busy repo back to serial while this CI stayed
      # green; only a ship dry run noticed. So the value fails HERE, where the person
      # who changed project.yml is looking. Same rule as `colab ship` and the audit
      # (tools/lib/ship-batch.js parseShipBatch): absent/empty/null, or 1–8. Why the
      # cap is 8: project.schema.md, `ship-batch`. `ship-batch-wait` (#555) the same way
      # (parseShipBatchWait): absent/empty/null, or a whole number with a unit (s, m, h).
      # `ship-batch-steps` (#557, parseShipBatchSteps): absent/empty/null, or ascending
      # whole numbers within ship-batch — 2,4,8 or [2, 4, 8].
      # `ci-wait-factor` (#564) too (tools/lib/ci-profile.js parseFactor): absent, or a number >= 1.
      # ---------------------------------------------------------------------------
      - name: Descriptor check (.github/project.yml)
        working-directory: ${{ github.workspace }}
        run: |
          [ -f .github/project.yml ] || exit 0
          # The scalar after `<key>:` — comment, trailing blanks and one level of quotes stripped.
          field() {
            grep -E "^$1[[:space:]]*:" .github/project.yml | head -1 \
              | sed -E -e "s/^$1[[:space:]]*:[[:space:]]*//" \
                -e 's/[[:space:]]+#.*$//' -e 's/[[:space:]]+$//' \
                -e 's/^"(.*)"$/\1/' -e "s/^'(.*)'\$/\\1/" || true
          }
          v="$(field ship-batch)"
          case "$v" in
            ''|'~'|null|1|2|3|4|5|6|7|8) echo "ship-batch: ${v:-absent} — ok" ;;
            *)
              echo "::error file=.github/project.yml::ship-batch is '$v', expected an integer 1-8 (omit for serial). colab ship ignores any other value and lands serially. Why the cap is 8: project.schema.md, ship-batch."
              exit 1 ;;
          esac
          # ship-batch-steps (#557): ascending whole numbers, each within ship-batch (the ceiling read above).
          s="$(field ship-batch-steps)"
          case "$s" in
            ''|'~'|null) echo "ship-batch-steps: absent — ok (fixed size)" ;;
            *)
              case "$v" in ''|'~'|null) ceil=1 ;; *) ceil="$v" ;; esac
              list="$(printf '%s' "$s" | sed -E -e 's/^\[(.*)\]$/\1/' -e 's/^[[:space:]]+//' -e 's/[[:space:]]+$//' -e 's/[[:space:]]*,[[:space:]]*/,/g')"
              if printf '%s\n' "$list" | grep -Eq '^[1-9][0-9]*(,[1-9][0-9]*)*$' \
                && printf '%s\n' "$list" | tr ',' '\n' | awk -v n="$ceil" '{ if ($1 + 0 <= p || $1 + 0 > n + 0) bad = 1; p = $1 + 0 } END { exit bad }'; then
                echo "ship-batch-steps: $list — ok"
              else
                echo "::error file=.github/project.yml::ship-batch-steps is '$s', expected strictly ascending whole numbers within ship-batch ($ceil), like 2,4,8 (omit for a fixed size). colab ship ignores any other value and uses the fixed size. See project.schema.md, ship-batch-steps."
                exit 1
              fi ;;
          esac
          # ship-batch-wait (#555): a whole number with a unit — 90s, 6m, 1h. No ceiling: the repo chooses.
          w="$(field ship-batch-wait)"
          case "$w" in
            ''|'~'|null) echo "ship-batch-wait: absent — ok" ;;
            *)
              if printf '%s\n' "$w" | grep -Eq '^[0-9]+[smh]$'; then
                echo "ship-batch-wait: $w — ok"
              else
                echo "::error file=.github/project.yml::ship-batch-wait is '$w', expected a whole number with a unit: 90s, 6m, 1h (omit for no wait). colab ship ignores any other value and does not wait."
                exit 1
              fi ;;
          esac
          # ci-wait-factor (#559): a number >= 1 — a multiple of the repo's measured CI duration. No ceiling.
          # Same reading as tools/lib/ci-profile.js parseFactor on the raw scalar the audit hands it.
          f="$(field ci-wait-factor)"
          case "$f" in
            ''|'~'|null) echo "ci-wait-factor: absent — ok (default 2)" ;;
            *)
              if printf '%s\n' "$f" | grep -Eq '^[0-9]+(\.[0-9]+)?$' && awk -v n="$f" 'BEGIN { exit !(n + 0 >= 1) }'; then
                echo "ci-wait-factor: $f — ok"
              else
                echo "::error file=.github/project.yml::ci-wait-factor is '$f', expected a number >= 1 (a multiple of the measured CI duration; omit for 2). colab ship and colab ci-wait ignore any other value and use 2. See project.schema.md, ci-wait-factor."
                exit 1
              fi ;;
          esac
          # thresholds (#560): one level of `name: whole number`, each name known and at or above its
          # floor (and, for a percent, at most 100) — the table in tools/lib/thresholds.js (SPEC),
          # which a test holds this list to.
          # A bad entry falls back to the default everywhere, silently, so it fails here.
          bad=0
          while IFS= read -r t; do
            case "$t" in =*)
              echo "::error file=.github/project.yml::thresholds is '${t#=}', expected a map of 'name: whole number' pairs. See project.schema.md, thresholds."
              bad=1; continue ;;
            esac
            k="${t%%:*}"
            n="$(printf '%s' "${t#*:}" | sed -E -e 's/^[[:space:]]+//' -e 's/^"(.*)"$/\1/' -e "s/^'(.*)'\$/\\1/")"
            max=999999999
            case "$k" in
              hot-file-count|claude-md-line-multiple) min=2 ;;
              dependents-count|hold-stale-days|smoke-minutes|claude-md-kb|transitional-days|batch-min-samples) min=1 ;;
              claude-md-line-floor-bytes|doc-budget-slack) min=0 ;;
              batch-first-green-pct-min|batch-eviction-pct-max|batch-overlap-pct) min=0 max=100 ;;
              *) echo "::error file=.github/project.yml::thresholds.$k is not a known threshold (colab thresholds lists them). See project.schema.md, thresholds."
                 bad=1; continue ;;
            esac
            case "$n" in ''|'~'|null) continue ;; esac
            if printf '%s\n' "$n" | grep -Eq '^[0-9]{1,9}$' && [ "$n" -ge "$min" ] && [ "$n" -le "$max" ]; then
              echo "thresholds.$k: $n — ok"
            else
              echo "::error file=.github/project.yml::thresholds.$k is '$n', expected a whole number from $min to $max. Every reader ignores it (a batch-* key is then not judged; any other uses its default). See project.schema.md, thresholds."
              bad=1
            fi
          done < <(awk '
            /^thresholds[[:space:]]*:/ { b = 1; v = $0
              sub(/^thresholds[[:space:]]*:[[:space:]]*/, "", v); sub(/[[:space:]]+#.*$/, "", v); sub(/[[:space:]]+$/, "", v)
              if (v != "" && v != "~" && v != "null") print "=" v
              next }
            b && /^[[:space:]]*(#|$)/ { next }
            b && /^[[:space:]]/ { l = $0; sub(/^[[:space:]]+/, "", l); sub(/[[:space:]]+#.*$/, "", l); sub(/[[:space:]]+$/, "", l); print l; next }
            { b = 0 }' .github/project.yml)
          [ "$bad" = 0 ] || exit 1

      # ---------------------------------------------------------------------------
      # Toolchain resolution. Precedence, highest first:
      #   1. .github/project.yml    ->  python: <version>
      #   2. .python-version        (pyenv; also what most local tooling reads)
      #   3. pyproject.toml         ->  [project] requires-python
      #   4. FAIL.
      #
      # NOTE what is NOT on that list: requirements.txt. It pins DEPENDENCIES, never
      # the interpreter — a repo with only a requirements.txt has declared nothing
      # about which Python it runs on, and this workflow will (correctly) stop and
      # say so. Add `python:` to project.yml or a `.python-version`; do not paper
      # over it with a hardcoded version here.
      #
      # There is deliberately NO fallback default. A silent default is exactly how a
      # repo here ended up building on Node 20 in CI while deploying on Node 22 —
      # CI was green and proved nothing about what actually shipped. Python has the
      # same failure with sharper edges: a minor is a real feature release, so 3.12
      # vs 3.13 is not a cosmetic difference.
      # ---------------------------------------------------------------------------
      - name: Resolve Python version
        id: toolchain
        run: |
          set -euo pipefail

          # ">=3.13" / "~=3.12" / "3.13.1" / "3.13" -> "3.13" / "3.12" / "3.13.1"
          normalise() {
            printf '%s' "$1" \
              | tr -d '"' \
              | sed -E 's/^[^0-9]*//' \
              | sed -E 's/[[:space:],].*$//' \
              | sed -E 's/\.(x|\*)$//' \
              | sed -E 's/[^0-9.].*$//' \
              | sed -E 's/\.$//'
          }

          PY_VERSION=""
          SOURCE=""

          # 1. project.yml wins. Flat `python: 3.13` mapping; good enough, this file
          #    is a handful of keys by design.
          if [ -f .github/project.yml ]; then
            V="$(sed -nE 's/^[[:space:]]*python:[[:space:]]*"?([^"#[:space:]]+)"?.*/\1/p' .github/project.yml | head -1 || true)"
            if [ -n "$V" ] && [ "$V" != "null" ]; then
              PY_VERSION="$(normalise "$V")"; SOURCE=".github/project.yml (python:)"
            fi
          fi

          # 2. .python-version
          if [ -z "$PY_VERSION" ] && [ -f .python-version ]; then
            V="$(grep -vE '^[[:space:]]*(#|$)' .python-version | head -1 | tr -d '[:space:]' || true)"
            if [ -n "$V" ]; then
              PY_VERSION="$(normalise "$V")"; SOURCE=".python-version"
            fi
          fi

          # 3. pyproject.toml -> [project] requires-python. Read with a line match, not
          #    a TOML parser: the field is a single top-level string and the runner is
          #    not guaranteed to have tomllib available before setup-python has run.
          if [ -z "$PY_VERSION" ] && [ -f pyproject.toml ]; then
            V="$(sed -nE 's/^[[:space:]]*requires-python[[:space:]]*=[[:space:]]*["'"'"']([^"'"'"']+)["'"'"'].*/\1/p' pyproject.toml | head -1 || true)"
            if [ -n "$V" ]; then
              PY_VERSION="$(normalise "$V")"; SOURCE="pyproject.toml (requires-python)"
            fi
          fi

          # 4. No declared source -> stop. Do not guess.
          if [ -z "$PY_VERSION" ]; then
            echo "::error::No Python version is declared in this repository, and this workflow refuses to guess one."
            {
              echo ""
              echo "Declare it in ONE of these places (checked in this order):"
              echo "  1. .github/project.yml  ->  python: \"3.13\"   (preferred: one descriptor for the whole repo)"
              echo "  2. .python-version      ->  3.13              (also drives local dev via pyenv)"
              echo "  3. pyproject.toml       ->  [project] requires-python = \">=3.13\""
              echo ""
              echo "requirements.txt does NOT count — it pins dependencies, not the interpreter."
              echo "Pick the version your DEPLOY target runs. CI on a different minor than"
              echo "production proves less than you think."
            } >&2
            exit 1
          fi

          echo "python-version=$PY_VERSION" >> "$GITHUB_OUTPUT"
          echo "Python $PY_VERSION (resolved from: $SOURCE)"
          echo "Python **$PY_VERSION** — resolved from \`$SOURCE\`" >> "$GITHUB_STEP_SUMMARY"

      # Package cache (#571): pip's wheel cache, on only on a GitHub-hosted runner AND with a
      # dependency manifest present. Both halves are load-bearing:
      #   - No requirements*.txt / pyproject.toml → setup-python's `cache: pip` fails the step
      #     ("No file ... matched"), and this template allows a repo with neither.
      #   - Self-hosted → off. A persistent runner already keeps ~/.cache/pip between jobs; a
      #     remote cache on top was measured as a loss, not a saving (#512).
      # The cache holds downloaded wheels, never a resolution: it cannot change which versions
      # install, so a repo without a pinned lockfile is no less reproducible with it on.
      # EDIT: self-hosted runners are already off; to turn caching off everywhere, replace the
      # `cache:` expression with ''. Manifests outside the root → widen cache-dependency-path
      # and the hashFiles() to match.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ steps.toolchain.outputs.python-version }}
          cache: ${{ runner.environment == 'github-hosted' && hashFiles('requirements*.txt', 'pyproject.toml') != '' && 'pip' || '' }}
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Whichever manifest the repo actually has. A packaged project (pyproject)
          # installs itself so imports resolve the way they will in production;
          # a plain requirements.txt service just installs its pins.
          if [ -f pyproject.toml ]; then
            pip install -e .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "::warning::No pyproject.toml or requirements.txt — nothing to install."
          fi

      - name: Byte-compile
        # The cheapest gate there is: every module parses. Catches the syntax error
        # that only ever runs on a code path nobody tests.
        run: python -m compileall -q "$PACKAGE_DIR"

      - name: Detect optional tooling
        id: tools
        run: |
          # EDIT: add the tools this repo uses. Each is optional so a repo without it
          # is not forced to adopt one to keep CI green.
          # Because a tool missing here SKIPS its step and the job still concludes
          # `success`, the files installed from above and here are part of the
          # instrument: `colab ship`'s cure rule refuses a branch that changes them
          # while trunk is red (CONVENTIONS.md §5, cure rule condition 6, #377). Installing
          # from a file this template does not name (a lockfile, a new include)?
          # Extend that rule's list, or accept that the cure rule cannot see it.
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          for t in ruff mypy pytest; do
            if python -m "$t" --version >/dev/null 2>&1; then
              echo "$t=true" >> "$GITHUB_OUTPUT"
            else
              echo "$t=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$t not installed — skipping."
            fi
          done

      - name: Lint (ruff)
        if: steps.tools.outputs.ruff == 'true'
        run: python -m ruff check .

      - name: Typecheck (mypy)
        if: steps.tools.outputs.mypy == 'true'
        run: python -m mypy "$PACKAGE_DIR"

      - name: Test (pytest)
        if: steps.tools.outputs.pytest == 'true'
        # Everything not marked heavy; ci-heavy.yml runs the rest. Exit 5 = no test selected.
        run: python -m pytest -q -m "not heavy" || [ $? -eq 5 ]
