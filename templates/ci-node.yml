  #   1. fresh       apply every migration to an empty database          (schema A)
  #   2. re-apply    apply again on the same database — nothing changes  (must equal A)
  #   3. on base     empty database, apply the BASE's migrations (+ ROUNDTRIP_SEED rows),
  #                  then this change's on top                           (must equal A)
