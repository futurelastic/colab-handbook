  #     # `npx knex migrate:latest`, `npx dbmate --no-dump-schema up`, `node scripts/migrate.mjs`.
  #     # Empty = the round-trip job is SKIPPED, and a skipped job never passes R: migrations ship
  #     # on a human grant until this is set (#625).
