# CI (Node) — TEMPLATE. Copy me into your repo at .github/workflows/ci.yml.
#
# This is a starting point, not a dependency. Once you copy it, YOU OWN THIS FILE.
# Edit it freely: rename jobs, add steps, drop the parts you do not need. Nothing
# calls this file remotely and nothing will update it for you — divergence between
# your copy and the handbook is expected and fine. If you find an improvement worth
# sharing, change the handbook template too, but that is a manual, deliberate act.
#
# EDIT POINTS are marked `# EDIT:` — walk them once after copying.
#
# For: pure Node projects (Vite SPA, node libs, Astro static sites, Capacitor apps).
# NOT for: Laravel + Inertia fullstack apps — their Vite build shells out to
# `php artisan wayfinder:generate` and needs PHP on the runner. Use ci-laravel.yml.
#
# What it does:
#   0. Fail on a .github/project.yml value colab would silently ignore (ship-batch, #416;
#      ship-batch-wait, #555; ci-wait-factor, #564).
#   1. Resolve the Node version from declared sources — never a hardcoded default.
#   2. Secret scan with gitleaks (pinned release binary, see note at the step).
#   3. Install dependencies with the package manager the lockfile implies.
#   4. Run typecheck / lint / test only if package.json declares those scripts, so a
#      repo without them is not forced to add placeholders to keep CI green.
#   5. Build, if package.json declares the BUILD_COMMAND script.
#   6. Opt-in, commented: a Migration round-trip for `migration-grant: reviewer` (#494).

name: CI

on:
  push:
    # Every branch, not only trunk (#384). Sessions push branches without opening a
    # PR, so a trunk-only trigger leaves a candidate with no run of its own before the
    # merge: its first run is the post-merge trunk run, and a red there is everyone's
    # TRUNK RED instead of one implementer's hand-back (CONVENTIONS.md §4, "Branch
    # CI"). '**' also covers `ship-batch/**`, the batch-landing opt-in.
    #
    # EDIT: on ONE self-hosted agent shared with trunk, go back to trunk-only until
    # trunk has its own lane — branch runs queue ahead of the one trunk run a merge
    # waits for (CONVENTIONS.md §7, "Self-hosted runners", #355). GitHub-hosted
    # runners, a runner pool, or a trunk-only label picked in `runs-on` on
    # github.ref all have that capacity; keep '**' there. Trunk-only means the
    # branches this repo actually has — and never drop `dev` on a Tier A or C repo:
    # dev is the trunk, so a main-only trigger runs zero checks on the branch you
    # merge into, and nothing looks broken (CONVENTIONS.md §7).
    branches: ['**']
  # No `pull_request:` here (#512). A branch with an open PR in this repository already
  # has a push run at the same head, and a `pull_request` run beside it doubled the CI
  # per commit while testing a merge ref instead of the sha that lands. Readers keep only
  # the newest run per workflow at a sha, so that second run also decided the verdict.
  # EDIT: a copy that went back to trunk-only push (above) has no run on a branch until it
  # has a PR — restore `pull_request: branches: [<trunk>]` there; that PR run is then its
  # only branch run (CONVENTIONS.md §4, "Branch CI"), so also delete the fork-PR term
  # (`github.event_name != 'pull_request' || …`) from every job's `if:` below, or it skips that run.
  # EDIT: fork PRs (#514). A push to a fork never runs a workflow here, so a repo that takes
  # PRs from forks needs `pull_request`. Uncomment it there. Every suite job below already
  # carries `github.event.pull_request.head.repo.full_name != github.repository` for a PR
  # event, so a same-repo PR's run skips every job (its push run is the one that tests) and a
  # fork PR's run tests. A skipped run never stands for a workflow that has a run that ran
  # (CONVENTIONS.md §4, "Branch CI"). Check every reader of your CI agrees before you uncomment.
  # pull_request:
  #   branches: ['**']
  # A promotion pushed by the release workflow's token triggers no push run, so that workflow
  # dispatches this one on main instead (templates/release-auto.yml, #440). Harmless elsewhere.
  workflow_dispatch:

# One live run per branch: a new push cancels the superseded run on the same ref.
# Trunk is NEVER cancelled — every trunk sha keeps a completed run of its own, which
# is what the merge gate reads (CONVENTIONS.md §4, "Branch CI"). A trunk run also gets a
# group of its own (the run id): GitHub cancels an older run that is still PENDING in a
# group even when cancel-in-progress is false, so a third quick merge would otherwise
# drop the second one's run before it ever started (#512).
# EDIT: name exactly this repo's trunk (and release branch) here — in the group, in
# cancel-in-progress, and in the `dedupe` job's `if:`. A Tier C trunk may carry any
# name; one left off this list gets its trunk runs cancelled. `colab template` writes these
# from the `trunk:` in .github/project.yml and prints what it wrote (#526).
concurrency:
  group: ci-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

env:
  # EDIT: bump deliberately, not automatically.
  GITLEAKS_VERSION: "8.30.1"
  # EDIT: npm script to build. Change for monorepos or non-standard scripts. Empty, or a
  # script package.json does not declare, skips the build with a notice (#526).
  BUILD_COMMAND: "build"

# Self-hosted runner? The job layout below assumes GitHub-hosted capacity — a
# fresh machine per job. With few self-hosted agents every job is a queue slot,
# jobs from different runs interleave, and trunk can wait behind branch runs.
# Read CONVENTIONS.md §7, "Self-hosted runners", before choosing a label.
jobs:
  # Already tested at this sha? (#418) — the claim push.
  # A session's claim pushes its branch at the moment it is cut (CONVENTIONS.md §5, the
  # claim record), so the branch's first push sits on a sha trunk has usually already
  # run. Without this job that push re-runs the whole suite on a tested commit (~19% of
  # all runs, measured across five adopting repos). This job runs ONLY on a ref's first
  # push (`github.event.created`), checks nothing out, and asks one question: does THIS
  # workflow already have a completed, green, non-PR run at THIS exact sha? Yes → every
  # other job is skipped and the run concludes `success` — a branch-CI `green` that is
  # true, because the same workflow passed at the same sha. Anything else — trunk still
  # running, red, never run, `gh` missing, the API failing — and the suite runs as
  # before (fail-open: this job never fails the run). Every later push has
  # `created == false`, so a real commit always gets the full suite, with no extra hop.
  # Why not simply `if: !github.event.created` on every job: a run whose jobs are ALL
  # skipped concludes `skipped`, which `colab ship` reads as not-green (CONVENTIONS.md
  # §4, "Branch CI"). This job is the one that ends green.
  #
  # Already tested at this TREE? (#493) — the squash merge.
  # A ship squash-merges a branch whose green run already contained the current base, so
  # the trunk commit's TREE is byte-identical to the tree that branch run passed — only the
  # sha is new. On a non-creating push to trunk this job therefore also asks: does THIS
  # workflow have a green `push` run, on another ref of this repo, whose commit has THIS
  # exact tree? It confirms the tree through the git object, never only the run listing.
  # Yes → the suite is skipped and the run cites the run it relied on (a
  # `tree-already-green` notice that `colab ship` / `colab trunk-ci` read back). Equal
  # trees cover every committed byte, workflows and lockfiles included — NOT runner images,
  # unpinned downloads, secrets or `github.ref`-conditional steps; a repo whose suite
  # depends on those declares `tree-reuse: off` in .github/project.yml. Trunk only (the
  # descriptor's `trunk:`, read at this sha), never a release branch, never a dispatch;
  # any doubt (no descriptor, opt-out, an API error, no exact match) runs the full suite.
  # A green run at THIS sha on another ref (a `ship-batch/*` run trunk fast-forwarded to) is
  # asked for first, by an exact query, so a busy repo's 50-run listing cannot miss it (#552).
  # A cited run is reused only if it skipped no job but this one: a job gated on the trunk
  # ref is `skipped` on every branch push, and reusing that run would skip it on trunk too
  # (#511). Never put a trunk-only job (publish, deploy, release) behind this gate.
  #
  # Only documentation changed? (#570) — opt-in, `ci-docs-skip:` in .github/project.yml.
  # When the two modes above find nothing, a repo that declared `ci-docs-skip` at THIS sha
  # asks a third question: is every path changed since the base documentation, by the rule
  # `colab ship` applies (CONVENTIONS.md §2, the docs-only exception: .md/.mdx/.txt or under
  # docs/, never agent rules, config, a symlink, a submodule or a binary), and does the base
  # have a green run of this workflow? The base is the merge base with trunk on a ref-creating
  # push, and the previous tip on a push to trunk. Yes → the suite is skipped and the run
  # leaves a `docs-only-skip` notice naming the base and its green run. A path the suite reads
  # (docs/api/ feeding a generator) is listed in `ci-docs-skip` and always runs the suite. Any
  # doubt (no opt-in, a red or unrun base, an API or fetch failure) runs the full suite. A run
  # skipped this way is never cited as tree-reuse proof: it skipped every job (#511).
  dedupe:
    name: Already tested at this sha or tree?
    # EDIT: the trunk refs here mirror `concurrency`'s list above (#493).
    if: github.event_name == 'push' && (github.event.created || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest # EDIT: the same label as the jobs below; it needs `gh` (GitHub-hosted images have it).
    timeout-minutes: 5 # one `gh api` listing, a hung call must not hold the slot. EDIT: the default is 360.
    permissions:
      actions: read
      contents: read
    outputs:
      tested: ${{ steps.docs.outputs.tested == 'true' && 'true' || steps.check.outputs.tested }}
      cited: ${{ steps.check.outputs.cited }}
    steps:
      - name: Look for a green run of this workflow at this sha or tree
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          CREATED: ${{ github.event.created }}
          REF_NAME: ${{ github.ref_name }}
          GUARD_NAME: Already tested at this sha or tree? # EDIT: this job's `name:`, if you rename it (#511).
        run: |
          tested=false
          cited=
          # #511: a cited run is reusable only if it skipped no job but this guard. A job gated on
          # the trunk ref is `skipped` on every branch push and a skipped job does not fail the
          # run, so citing that run would skip the trunk-only job on trunk a second time.
          reusable() {
            if ! SK="$(gh api "repos/$REPO/actions/runs/$1/jobs?per_page=100" \
                   --jq 'if .total_count > (.jobs | length) then "(more than 100 jobs)" else [.jobs[] | select(.conclusion == "skipped" and .name != env.GUARD_NAME) | .name] | join(", ") end' 2>/dev/null)"; then
              echo "::notice::Could not list the jobs of run $1 — running the full suite (#511)."
              return 1
            elif [ -n "$SK" ]; then
              echo "::notice::Run $1 skipped $SK, which this push may run — running the full suite (#511)."
              return 1
            fi
          }
          # The cited run, as "<id> <head sha> <url> <branch>": a green push run of this workflow on
          # another ref of this repo. #552: one at THIS sha first (a `ship-batch/*` run trunk
          # fast-forwarded to), an exact query; else one whose commit has THIS tree (#493).
          same_sha() {
            gh api "repos/$REPO/actions/workflows/$WFID/runs?head_sha=$SHA&event=push&status=success&per_page=20" \
              --jq "first(.workflow_runs[] | select(.id != $RUN_ID and .head_branch != \"$REF_NAME\" and .head_repository.full_name == \"$REPO\") | \"\\(.id) \\(.head_sha) \\(.html_url) \\(.head_branch)\") // empty" 2>/dev/null | grep .
          }
          same_tree() {
            gh api "repos/$REPO/actions/workflows/$WFID/runs?event=push&status=success&per_page=50" \
              --jq "first(.workflow_runs[] | select(.id != $RUN_ID and .head_branch != \"$REF_NAME\" and .head_repository.full_name == \"$REPO\" and .head_commit.tree_id == \"$OURS\") | \"\\(.id) \\(.head_sha) \\(.html_url) \\(.head_branch)\") // empty" 2>/dev/null
          }
          if ! command -v gh >/dev/null 2>&1; then
            echo "::notice::gh is not installed on this runner — running the full suite (#418)."
          elif ! WFID="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .workflow_id 2>/dev/null)" || [ -z "$WFID" ]; then
            echo "::notice::Could not read this run's workflow id — running the full suite (#418)."
          elif [ "${CREATED:-}" = "false" ]; then
            # A non-creating push: trunk tree mode (#493). Every branch below but one runs the suite.
            if ! DESC="$(gh api "repos/$REPO/contents/.github/project.yml?ref=$SHA" -H 'Accept: application/vnd.github.raw' 2>/dev/null)" || [ -z "$DESC" ]; then
              echo "::notice::Could not read .github/project.yml at $SHA — running the full suite (#493)."
            elif grep -Eq '^tree-reuse[[:space:]]*:' <<< "$DESC"; then
              echo "::notice::tree-reuse is declared in .github/project.yml — running the full suite (#493)."
            elif [ "$(printf '%s\n' "$DESC" | sed -nE "s/^trunk:[[:space:]]*[\"']?([A-Za-z0-9._/-]+).*/\\1/p" | head -n 1)" != "$REF_NAME" ]; then
              echo "::notice::$REF_NAME is not this repo's trunk — running the full suite (#493)."
            elif ! OURS="$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha 2>/dev/null)" || [ -z "$OURS" ]; then
              echo "::notice::Could not read the tree of $SHA — running the full suite (#493)."
            elif ! CAND="$(same_sha || same_tree)"; then
              echo "::notice::Could not list this workflow's green runs — running the full suite (#493)."
            elif [ -z "$CAND" ]; then
              echo "No green run of this workflow on another ref has sha $SHA or tree $OURS — running the full suite."
            else
              read -r CID CSHA URL BR <<< "$CAND"
              if ! CTREE="$(gh api "repos/$REPO/git/commits/$CSHA" --jq .tree.sha 2>/dev/null)" || [ "$CTREE" != "$OURS" ]; then
                echo "::notice::Could not confirm the tree of $CSHA — running the full suite (#493)."
              elif reusable "$CID"; then
                tested=true
                cited="$URL"
                echo "::notice title=tree-already-green::$URL tree=$OURS head=$CSHA branch=$BR"
                echo "Tree $OURS already passed this workflow at $CSHA on $BR ($URL) — skipping the suite (#493)."
                echo "Already tested: tree \`$OURS\` passed this workflow on \`$BR\` — [the run relied on]($URL); suite skipped (#493)." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          elif ! N="$(gh api "repos/$REPO/actions/workflows/$WFID/runs?head_sha=$SHA&status=success&per_page=20" \
                 --jq "[.workflow_runs[] | select(.id != $RUN_ID and .event != \"pull_request\")] | length" 2>/dev/null)"; then
            echo "::notice::Could not list this workflow's runs at $SHA — running the full suite (#418)."
          elif [ "${N:-0}" -ge 1 ] 2>/dev/null; then
            tested=true
            echo "This workflow already passed at $SHA ($N green run(s)) — skipping the suite (#418)."
            echo "Already tested: this workflow has a green run at \`$SHA\` — suite skipped (#418)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No green run of this workflow at $SHA yet — running the full suite."
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          [ -z "$cited" ] || echo "cited=$cited" >> "$GITHUB_OUTPUT"
      # Docs-only (#570) — the two steps below run only when the step above found nothing.
      - name: Find the base a docs-only change would rely on
        id: docs_base
        if: steps.check.outputs.tested != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          CREATED: ${{ github.event.created }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          base=
          # The opt-in at THIS sha (project.schema.md "ci-docs-skip"). A list, flow or block; any
          # doubt about it reads as "not opted in". Adding the key is itself not a docs-only change.
          optin() {
            local v items
            v="$(printf '%s\n' "$DESC" | sed -nE 's/^ci-docs-skip[[:space:]]*:[[:space:]]*//p' | head -n 1 | sed -E 's/[[:space:]]+#.*$//; s/[[:space:]]+$//')"
            if [ -z "$v" ]; then
              items="$(printf '%s\n' "$DESC" | awk '/^ci-docs-skip[[:space:]]*:/{f=1;next} f&&/^[[:space:]]+-/{sub(/^[[:space:]]+-[[:space:]]*/,"");sub(/[[:space:]]+#.*$/,"");print;next} f&&/^[[:space:]]*(#.*)?$/{next} {f=0}')"
              [ -n "$items" ] || return 1
            elif [ "${v#[}" != "$v" ] && [ "${v%]}" != "$v" ]; then
              v="${v#[}"; v="${v%]}"
              items="$(printf '%s' "$v" | tr ',' '\n')"
            else
              return 1
            fi
            EXCLUDE=
            while IFS= read -r it; do
              it="$(printf '%s' "$it" | sed -E "s/^[[:space:]]*[\"']?//; s/[\"']?[[:space:]]*$//")"
              [ -n "$it" ] || continue
              case "/$it/" in */../*|*/./*|//*) return 1 ;; esac
              printf '%s' "$it" | grep -Eq '^[A-Za-z0-9._/-]+$' || return 1
              EXCLUDE="$EXCLUDE ${it%/}"
            done <<< "$items"
          }
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh is not installed on this runner — docs-only mode is off (#570)."
          elif [ "${REF#refs/heads/}" = "$REF" ]; then
            echo "$REF is not a branch — docs-only mode is off (#570)."
          elif ! DESC="$(gh api "repos/$REPO/contents/.github/project.yml?ref=$SHA" -H 'Accept: application/vnd.github.raw' 2>/dev/null)" || [ -z "$DESC" ]; then
            echo "::notice::Could not read .github/project.yml at $SHA — running the full suite (#570)."
          elif ! grep -Eq '^ci-docs-skip[[:space:]]*:' <<< "$DESC"; then
            echo "ci-docs-skip is not declared in .github/project.yml — docs-only mode is off (#570)."
          elif ! optin; then
            echo "::notice::ci-docs-skip in .github/project.yml is not a list of repo paths — running the full suite (#570)."
          else
            TRUNK="$(printf '%s\n' "$DESC" | sed -nE "s/^trunk:[[:space:]]*[\"']?([A-Za-z0-9._/-]+).*/\\1/p" | head -n 1)"
            if [ -z "$TRUNK" ]; then
              echo "::notice::.github/project.yml declares no trunk — running the full suite (#570)."
            elif [ "${CREATED:-}" = "true" ] && [ "$REF_NAME" != "$TRUNK" ]; then
              # A new branch: the change is everything since it left trunk (the diff the squash lands).
              base="$(gh api "repos/$REPO/compare/$TRUNK...$SHA" --jq .merge_base_commit.sha 2>/dev/null)" || base=
              [ -n "$base" ] || echo "::notice::Could not read the merge base of $SHA with $TRUNK — running the full suite (#570)."
            elif [ "${CREATED:-}" = "false" ] && [ "$REF_NAME" = "$TRUNK" ] && [ -n "${BEFORE//0/}" ]; then
              base="$BEFORE"   # a push to trunk: the change is what this push added
            else
              echo "Not a new branch and not a push to trunk — docs-only mode is off (#570)."
            fi
            # The base must itself be green: a docs-only change cannot make a red suite green.
            if [ -n "$base" ]; then
              if ! WFID="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .workflow_id 2>/dev/null)" || [ -z "$WFID" ] \
                 || ! URL="$(gh api "repos/$REPO/actions/workflows/$WFID/runs?head_sha=$base&status=success&per_page=20" \
                      --jq "first(.workflow_runs[] | select(.id != $RUN_ID and .event != \"pull_request\") | .html_url) // empty" 2>/dev/null)"; then
                echo "::notice::Could not list this workflow's runs at $base — running the full suite (#570)."
                base=
              elif [ -z "$URL" ]; then
                echo "Base $base has no green run of this workflow — running the full suite (#570)."
                base=
              fi
            fi
          fi
          if [ -n "$base" ]; then
            echo "base=$base" >> "$GITHUB_OUTPUT"
            echo "base_run=$URL" >> "$GITHUB_OUTPUT"
            echo "exclude=${EXCLUDE# }" >> "$GITHUB_OUTPUT"
          fi
      - name: Is every changed path documentation?
        id: docs
        if: steps.docs_base.outputs.base != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BASE: ${{ steps.docs_base.outputs.base }}
          BASE_RUN: ${{ steps.docs_base.outputs.base_run }}
          EXCLUDE: ${{ steps.docs_base.outputs.exclude }}
        run: |
          tested=false
          # Mirrors tools/lib/docs-only.js pathReason — the rule `colab ship` applies (CONVENTIONS.md
          # §2, the docs-only exception). Prints why a path is NOT documentation; nothing if it is.
          # Kept equal to that module by tools/lib/ci-template-docs-only.test.js; edit both or neither.
          reason() {
            local p="$1" base dir x
            base="${p##*/}"; dir=; [ "$base" = "$p" ] || dir="${p%/*}"
            case "$p" in \"*) echo "quoted path"; return ;; esac
            for x in $EXCLUDE; do
              case "$p" in "$x"|"$x"/*) echo "listed in ci-docs-skip"; return ;; esac
            done
            case "$base" in CLAUDE.md|CLAUDE.local.md|AGENTS.md) echo "agent rules"; return ;; esac
            case "/$dir/" in */.claude/*|*/.github/*|*/.githooks/*) echo "config"; return ;; */.colab/skills/*) echo "skill local policy"; return ;; esac
            case "$p" in docs/*) return ;; esac
            case "$base" in ?*.md|?*.mdx|?*.txt) return ;; esac
            echo "not .md/.mdx/.txt and not under docs/"
          }
          # Both commits, trees only; blobs come on demand for the binary check. No checkout (#418).
          G="$RUNNER_TEMP/docs-only-$GITHUB_RUN_ID"
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          if ! { git init -q "$G" && git -C "$G" remote add origin "$SERVER_URL/$REPO" \
                 && git -C "$G" config remote.origin.promisor true && git -C "$G" config remote.origin.partialclonefilter blob:none \
                 && git -C "$G" config http.extraheader "$AUTH" \
                 && git -C "$G" fetch -q --no-tags --depth=1 --filter=blob:none origin "$BASE" "$SHA"; } >/dev/null 2>&1; then
            echo "::notice::Could not fetch $BASE and $SHA — running the full suite (#570)."
          elif ! RAW="$(git -C "$G" diff --raw --no-renames --no-abbrev "$BASE" "$SHA" 2>/dev/null)" \
               || ! NUM="$(git -C "$G" diff --numstat --no-renames "$BASE" "$SHA" 2>/dev/null)"; then
            echo "::notice::Could not diff $BASE..$SHA — running the full suite (#570)."
          elif [ -z "$RAW" ]; then
            echo "Empty diff from $BASE — nothing to call documentation; running the full suite (#570)."
          else
            bad=; n=0
            while IFS= read -r line; do
              meta="${line%%$'\t'*}"; p="${line#*$'\t'}"; n=$((n + 1))
              why="$(reason "$p")"
              set -- $meta
              case "${1#:} $2" in *120000*) why="${why:+$why, }symlink change" ;; esac
              case "${1#:} $2" in *160000*) why="${why:+$why, }submodule change" ;; esac
              [ -z "$why" ] || bad="${bad:+$bad; }$p ($why)"
            done <<< "$RAW"
            while IFS=$'\t' read -r a d p; do
              if [ "$a" = "-" ] && [ "$d" = "-" ]; then bad="${bad:+$bad; }$p (binary change)"; fi
            done <<< "$NUM"
            if [ -n "$bad" ]; then
              echo "Not docs-only since $BASE: $bad — running the full suite (#570)."
            else
              tested=true
              echo "::notice title=docs-only-skip::base=$BASE files=$n run=$BASE_RUN"
              echo "Every one of $n changed path(s) since $BASE is documentation, and $BASE is green ($BASE_RUN) — skipping the suite (#570)."
              echo "Docs-only: $n path(s) since \`$BASE\`, which [passed this workflow]($BASE_RUN); suite skipped (#570)." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          rm -rf "$G"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  gitleaks:
    name: Secret scan (gitleaks)
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.tested != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest # EDIT: self-hosted label if this repo needs one.
    timeout-minutes: 15 # a scan of the checkout. EDIT: the default is 360.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Full history: gitleaks scans commits, not just the working tree, so a
          # secret that was committed and later removed is still caught.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned release binary)
        run: |
          # Deliberately NOT gitleaks/gitleaks-action@v2: that action requires a paid
          # GITLEAKS_LICENSE for repositories owned by an organization (free only for
          # personal repos). The release binary itself is MIT and has no such gate.
          # Repos also carry a local pre-commit gitleaks hook; this is the second layer.
          # The asset is OS/arch-specific, so resolve both from uname instead of
          # assuming the GitHub-hosted default: a hardcoded linux_x64 binary on a
          # macOS self-hosted runner is an ELF the kernel cannot exec, and the step
          # fails with exit 126 rather than anything mentioning the platform.
          case "$(uname -s)" in
            Darwin) os=darwin ;;
            Linux)  os=linux ;;
            *) echo "unsupported OS: $(uname -s)" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            arm64|aarch64) arch=arm64 ;;
            x86_64|amd64)  arch=x64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${os}_${arch}.tar.gz"
          # Into $RUNNER_TEMP, not /usr/local/bin: no sudo, no global write — the same
          # step then works on BOTH GitHub-hosted and shared self-hosted runners
          # (a shared runner is infrastructure; jobs must not mutate it).
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          rm -f gitleaks.tar.gz

      - name: gitleaks detect
        run: gitleaks detect --source . --no-banner

  build:
    name: Build
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.tested != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    # A repo can adopt this template before it has any application code at all —
    # a fresh Tier B scaffold with decisions locked and a backlog filed, nothing
    # else. Unguarded, every step below still runs: "Install dependencies" warns
    # and falls through to `npm install` with no package.json to install, then
    # "Build" fails outright trying to read it — turning trunk CI red as the
    # first consequence of adopting, not of anything about the repo changing.
    # Skip the package.json-dependent steps instead, the same way the generic
    # scaffold workflow guards it (`if [ -f package.json ]; then node=true; else
    # node=false; fi`). gitleaks above stays unconditional — a repo with no code
    # can still commit a secret.
    #
    # NOTE (#245): this guard used to sit here, at job level — `if:
    # hashFiles('package.json') != ''`. `hashFiles()` is NOT among the functions
    # GitHub allows in `jobs.<job_id>.if` (only `github` / `needs` / `vars` /
    # `inputs` plus always()/cancelled()/success()/failure()); a job-level `if:`
    # using it is rejected at workflow-VALIDATION time, before any job runs — the
    # whole workflow file fails with "0 jobs created" and a message that names
    # neither the key nor the expression. It is valid in a step-level `if:`,
    # which is why it looked right when written (a042cea, fixing #73). Moved the
    # guard onto every step below that assumes package.json exists instead — the
    # workspace isn't even checked out yet at job level, so a job-level
    # hashFiles() would have been testing an empty directory even if it were
    # allowed.
    runs-on: ubuntu-latest # EDIT: self-hosted label if this repo needs one.
    timeout-minutes: 60 # a hung build must not hold the runner for the 360-minute default (#572).
    # EDIT: measured (#572): the slowest Node adopter's build ran p99 37 / max 43 min. Keep this
    # well above YOUR p99 — below it a slow but healthy suite goes red (`gh run view <id>` per job).
    # Re-exported so the opt-in round-trip job below resolves Node exactly once, here.
    outputs:
      node-version: ${{ steps.toolchain.outputs.node-version }}
    defaults:
      run:
        # EDIT: set to the directory holding package.json if the app is not at the root.
        working-directory: .
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # ---------------------------------------------------------------------------
      # Descriptor check (#416). A value `colab ship` cannot use does not fail there —
      # it fails closed to the safe default, silently. `ship-batch: 5` (the cap is 3)
      # once turned every landing in a busy repo back to serial while this CI stayed
      # green; only a ship dry run noticed. So the value fails HERE, where the person
      # who changed project.yml is looking. Same rule as `colab ship` and the audit
      # (tools/lib/ship-batch.js parseShipBatch): absent/empty/null, or 1–3. Why the
      # cap is 3: project.schema.md, `ship-batch`. `ship-batch-wait` (#555) the same way
      # (parseShipBatchWait): absent/empty/null, or a whole number with a unit (s, m, h).
      # `ci-wait-factor` (#564) too (tools/lib/ci-profile.js parseFactor): absent, or a number >= 1.
      # ---------------------------------------------------------------------------
      - name: Descriptor check (.github/project.yml)
        working-directory: ${{ github.workspace }}
        run: |
          [ -f .github/project.yml ] || exit 0
          # The scalar after `<key>:` — comment, trailing blanks and one level of quotes stripped.
          field() {
            grep -E "^$1[[:space:]]*:" .github/project.yml | head -1 \
              | sed -E -e "s/^$1[[:space:]]*:[[:space:]]*//" \
                -e 's/[[:space:]]+#.*$//' -e 's/[[:space:]]+$//' \
                -e 's/^"(.*)"$/\1/' -e "s/^'(.*)'\$/\\1/" || true
          }
          v="$(field ship-batch)"
          case "$v" in
            ''|'~'|null|1|2|3) echo "ship-batch: ${v:-absent} — ok" ;;
            *)
              echo "::error file=.github/project.yml::ship-batch is '$v', expected an integer 1-3 (omit for serial). colab ship ignores any other value and lands serially. Why the cap is 3: project.schema.md, ship-batch."
              exit 1 ;;
          esac
          # ship-batch-wait (#555): a whole number with a unit — 90s, 6m, 1h. No ceiling: the repo chooses.
          w="$(field ship-batch-wait)"
          case "$w" in
            ''|'~'|null) echo "ship-batch-wait: absent — ok" ;;
            *)
              if printf '%s\n' "$w" | grep -Eq '^[0-9]+[smh]$'; then
                echo "ship-batch-wait: $w — ok"
              else
                echo "::error file=.github/project.yml::ship-batch-wait is '$w', expected a whole number with a unit: 90s, 6m, 1h (omit for no wait). colab ship ignores any other value and does not wait."
                exit 1
              fi ;;
          esac
          # ci-wait-factor (#559): a number >= 1 — a multiple of the repo's measured CI duration. No ceiling.
          # Same reading as tools/lib/ci-profile.js parseFactor on the raw scalar the audit hands it.
          f="$(field ci-wait-factor)"
          case "$f" in
            ''|'~'|null) echo "ci-wait-factor: absent — ok (default 2)" ;;
            *)
              if printf '%s\n' "$f" | grep -Eq '^[0-9]+(\.[0-9]+)?$' && awk -v n="$f" 'BEGIN { exit !(n + 0 >= 1) }'; then
                echo "ci-wait-factor: $f — ok"
              else
                echo "::error file=.github/project.yml::ci-wait-factor is '$f', expected a number >= 1 (a multiple of the measured CI duration; omit for 2). colab ship and colab ci-wait ignore any other value and use 2. See project.schema.md, ci-wait-factor."
                exit 1
              fi ;;
          esac
          # thresholds (#560): one level of `name: whole number`, each name known and at or above its
          # floor (and, for a percent, at most 100) — the table in tools/lib/thresholds.js (SPEC),
          # which a test holds this list to.
          # A bad entry falls back to the default everywhere, silently, so it fails here.
          bad=0
          while IFS= read -r t; do
            case "$t" in =*)
              echo "::error file=.github/project.yml::thresholds is '${t#=}', expected a map of 'name: whole number' pairs. See project.schema.md, thresholds."
              bad=1; continue ;;
            esac
            k="${t%%:*}"
            n="$(printf '%s' "${t#*:}" | sed -E -e 's/^[[:space:]]+//' -e 's/^"(.*)"$/\1/' -e "s/^'(.*)'\$/\\1/")"
            max=999999999
            case "$k" in
              hot-file-count|claude-md-line-multiple) min=2 ;;
              dependents-count|hold-stale-days|smoke-minutes|claude-md-kb|transitional-days|batch-min-samples) min=1 ;;
              claude-md-line-floor-bytes|doc-budget-slack) min=0 ;;
              batch-first-green-pct-min|batch-eviction-pct-max|batch-overlap-pct) min=0 max=100 ;;
              *) echo "::error file=.github/project.yml::thresholds.$k is not a known threshold (colab thresholds lists them). See project.schema.md, thresholds."
                 bad=1; continue ;;
            esac
            case "$n" in ''|'~'|null) continue ;; esac
            if printf '%s\n' "$n" | grep -Eq '^[0-9]{1,9}$' && [ "$n" -ge "$min" ] && [ "$n" -le "$max" ]; then
              echo "thresholds.$k: $n — ok"
            else
              echo "::error file=.github/project.yml::thresholds.$k is '$n', expected a whole number from $min to $max. Every reader ignores it (a batch-* key is then not judged; any other uses its default). See project.schema.md, thresholds."
              bad=1
            fi
          done < <(awk '
            /^thresholds[[:space:]]*:/ { b = 1; v = $0
              sub(/^thresholds[[:space:]]*:[[:space:]]*/, "", v); sub(/[[:space:]]+#.*$/, "", v); sub(/[[:space:]]+$/, "", v)
              if (v != "" && v != "~" && v != "null") print "=" v
              next }
            b && /^[[:space:]]*(#|$)/ { next }
            b && /^[[:space:]]/ { l = $0; sub(/^[[:space:]]+/, "", l); sub(/[[:space:]]+#.*$/, "", l); sub(/[[:space:]]+$/, "", l); print l; next }
            { b = 0 }' .github/project.yml)
          [ "$bad" = 0 ] || exit 1

      # ---------------------------------------------------------------------------
      # Toolchain resolution. Precedence, highest first:
      #   1. .github/project.yml  ->  node: <version>
      #   2. .nvmrc, else package.json -> engines.node
      #   3. FAIL.
      #
      # There is deliberately NO fallback default. A silent default is exactly how a
      # repo here ended up building on Node 20 in CI while deploying on Node 22 —
      # CI was green and proved nothing about what actually shipped. If the version
      # is not declared anywhere, that is a bug in the repo, and the build says so.
      # ---------------------------------------------------------------------------
      - name: Resolve Node version
        id: toolchain
        if: hashFiles('package.json') != ''
        run: |
          set -euo pipefail

          # Normalise "^22", ">=22.1", "v22", "22.x" -> "22.1" / "22". setup-node
          # accepts a partial version and picks the newest matching release.
          normalise() {
            printf '%s' "$1" \
              | tr -d '"' \
              | sed -E 's/^[^0-9]*//' \
              | sed -E 's/[[:space:]].*$//' \
              | sed -E 's/\.x$//' \
              | sed -E 's/[^0-9.].*$//' \
              | sed -E 's/\.$//'
          }

          NODE_VERSION=""
          SOURCE=""

          # 1. project.yml wins. Flat `node: 22` mapping; good enough, this file is
          #    a handful of keys by design.
          if [ -f .github/project.yml ]; then
            V="$(sed -nE 's/^[[:space:]]*node:[[:space:]]*"?([^"#[:space:]]+)"?.*/\1/p' .github/project.yml | head -1 || true)"
            if [ -n "$V" ] && [ "$V" != "null" ]; then
              NODE_VERSION="$(normalise "$V")"; SOURCE=".github/project.yml (node:)"
            fi
          fi

          # 2a. .nvmrc
          if [ -z "$NODE_VERSION" ] && [ -f .nvmrc ]; then
            V="$(grep -vE '^[[:space:]]*(#|$)' .nvmrc | head -1 | tr -d '[:space:]' || true)"
            if [ -n "$V" ]; then
              NODE_VERSION="$(normalise "$V")"; SOURCE=".nvmrc"
            fi
          fi

          # 2b. package.json -> engines.node
          if [ -z "$NODE_VERSION" ] && [ -f package.json ]; then
            V=""
            if command -v node >/dev/null 2>&1; then
              V="$(node -e "try{const e=require('./package.json').engines||{};process.stdout.write(String(e.node||''))}catch(_){}" || true)"
            elif command -v python3 >/dev/null 2>&1; then
              V="$(python3 -c "import json;print((json.load(open('package.json')).get('engines') or {}).get('node') or '')" || true)"
            fi
            if [ -n "$V" ]; then
              NODE_VERSION="$(normalise "$V")"; SOURCE="package.json (engines.node)"
            fi
          fi

          # 3. No declared source -> stop. Do not guess.
          if [ -z "$NODE_VERSION" ]; then
            echo "::error::No Node version is declared in this repository, and this workflow refuses to guess one."
            {
              echo ""
              echo "Declare it in ONE of these places (checked in this order):"
              echo "  1. .github/project.yml  ->  node: \"22\"   (preferred: one descriptor for the whole repo)"
              echo "  2. .nvmrc               ->  22            (also drives local dev via nvm/fnm)"
              echo "     or package.json      ->  \"engines\": { \"node\": \">=22\" }"
              echo ""
              echo "Pick the version your DEPLOY target runs. CI on a different major than"
              echo "production proves nothing."
            } >&2
            exit 1
          fi

          echo "node-version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Node $NODE_VERSION (resolved from: $SOURCE)"
          echo "Node **$NODE_VERSION** — resolved from \`$SOURCE\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: hashFiles('package.json') != ''
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: |
          # Lockfile decides the package manager. `npm ci` / `--frozen-lockfile` are
          # intentional: CI must fail on a stale lockfile rather than silently resolve
          # a different dependency tree than the developer had.
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::No lockfile found — falling back to 'npm install'. Commit a lockfile so CI is reproducible."
            npm install
          fi

      - name: Detect optional scripts
        id: scripts
        if: hashFiles('package.json') != ''
        run: |
          # package.json's `scripts` decides what this job MEASURES: a missing script
          # skips its step and the job still concludes success. So `colab ship`'s cure
          # rule treats a scripts change as an instrument change and never lets such a
          # branch cure a red trunk by itself (CONVENTIONS.md, Cure rule, condition 5).
          #
          # node -e over grep: package.json is JSON, and a "typecheck" substring can
          # appear inside a dependency name or another script's body.
          has() {
            node -e "const s=(require('./package.json').scripts)||{};process.exit(s['$1']?0:1)" 2>/dev/null
          }
          for s in typecheck lint test; do
            if has "$s"; then
              echo "$s=true" >> "$GITHUB_OUTPUT"
            else
              echo "$s=false" >> "$GITHUB_OUTPUT"
              echo "::notice::No '$s' script in package.json — skipping."
            fi
          done

      - name: Typecheck
        if: steps.scripts.outputs.typecheck == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.scripts.outputs.lint == 'true'
        run: npm run lint

      # EDIT: cap your test runner's workers in CI, in its own config (#478). vitest,
      # jest, node:test and playwright start one worker per CPU the job can SEE. On a
      # self-hosted pool slot that is often the whole host's count, while the slot
      # caps only memory. A host upgrade then adds workers until the slot is
      # throttled. There is no OOM, the tests time out, and trunk goes red with no
      # code change. Use a fixed number sized to the slot's memory, e.g. vitest
      # `maxWorkers: process.env.CI ? 4 : undefined`, jest `--maxWorkers=4`,
      # node:test `--test-concurrency=4`. GitHub Actions sets CI=true. Why and how
      # to size it: CONVENTIONS.md §7, "Self-hosted runners".
      - name: Test
        if: steps.scripts.outputs.test == 'true'
        run: npm test

      # Optional, like the scripts above (#526): a library or a test-only repo has no `build`
      # script, and a template that fails on that turns a new adopter's first trunk run red.
      - name: Build
        if: hashFiles('package.json') != ''
        run: |
          if [ -z "$BUILD_COMMAND" ]; then
            echo "::notice::BUILD_COMMAND is empty — no build."
          elif ! node -e "const s=(require('./package.json').scripts)||{};process.exit(s[process.env.BUILD_COMMAND]?0:1)" 2>/dev/null; then
            echo "::notice::No '$BUILD_COMMAND' script in package.json — skipping the build."
          else
            npm run "$BUILD_COMMAND"
          fi

  # ---------------------------------------------------------------------------
  # Migration round-trip — OPT-IN (#494). Needed for `migration-grant: reviewer`: condition R
  # reads a passing job named "Migration round-trip…" at the shipped head (CONVENTIONS.md §5),
  # and the audit warns when a repo declares `reviewer` without one. Node has no canonical
  # migration runner, so the job runs YOURS, forward-only, three times — each pass's schema
  # must equal the first:
