# This repo's own project descriptor — and the reference example of the format.
#
# Every repo following the handbook carries one of these at .github/project.yml. It
# is the single machine-readable answer to "what is this repo?", read by the copied
# CI templates (for toolchain resolution) and by audit/audit.mjs (for conventions).
#
#   tier        OPTIONAL, legacy. A = has a production deploy target. B = does not.
#               `exposure` below is the axis of record where both are declared; this
#               is read through it (tools/lib/axis-authority.js: A -> released, C ->
#               live, B -> null — project.schema.md "tier — optional (legacy)").
#   trunk       Branch feature work merges into — a declared setting, not a fixed
#               spelling (project.schema.md "trunk — required"). Fixed to `main`
#               where there is no production (tier B / exposure none|self). A branch
#               distinct from `main` where the promotion itself is the deploy (tier C
#               / exposure live) — `dev` is the default, any other name equally
#               conforming, never a per-tier mapping. `dev`, or `main` when
#               `deploy: tag`, where a tag gates production (tier A / exposure
#               released).
#   production  Live URL, or null. Must be set wherever a deploy target exists (tier
#               A or C); null where none does (tier B).
#   deploy      tag | manual | push-main | none. HOW production is reached, not
#               whether it exists — that is tier/exposure's job. `none` wherever no
#               deploy target exists (tier B).
#               `manual` (a human runs a documented procedure) also requires
#               `runbook: <path>` naming that committed document.
#   stack       FREE-FORM string. Describe the stack however reads best.
#               Deliberately NOT an enum: the old closed list had no value for a
#               Capacitor mobile app and forced a repo to be mislabelled, so the
#               enum was actively doing harm. Nothing validates this value; it is
#               documentation for humans and for grep.
#   node / php / python
#               OPTIONAL toolchain pins. When present these WIN over the ecosystem
#               manifest — .nvmrc / package.json engines; composer.json require.php;
#               .python-version / pyproject.toml requires-python. Set them when a
#               repo's manifest is vague (">=22") but CI must be exact, or when
#               there is no manifest to read. Omit them and the manifest decides.
#               NOTE requirements.txt is not a source: it pins dependencies, never
#               the interpreter, so a Python repo with only that file must declare
#               `python:` here (or add .python-version) or CI has nothing to resolve.
#   writes      OPTIONAL. isolated (default) | serial-direct | serial-gated (serial is a
#               legacy alias of serial-direct — #208). Which write-conflict prevention
#               method this repo's sessions default to — a separate axis from tier and
#               ceremony (project.schema.md "writes — optional"). This repo is
#               `serial-direct`: one writer at a time, no declared pre-merge gate, which
#               is what lets solo flow's entry gate open here — a doc-only fix may commit
#               straight to trunk with no issue/branch (CLAUDE.local.md, "Doc-only typo
#               fixes do not need this ceremony"). Deliberately NOT serial-gated: this
#               repo genuinely uses the trunk-direct escape hatch, not merely a branch by
#               another name, and #208 made that distinction declarable rather than
#               inferred. The entry gate stays mechanical, not a promise — it refuses the
#               moment a second worktree, claim or place-claim is live, which is the
#               ordinary state while any unit is mid-flight (most work here still goes
#               through the full claim + branch + squash flow).
#   room        OPTIONAL. solo | team | public. Who could ever READ what a session writes
#               down here — not who writes it (project.schema.md "room — optional"). This
#               repo is `public`: adopters outside the org read its Issues as the worked
#               examples for the rules it states. Orthogonal to `writes` above, and this
#               descriptor is the worked example of that orthogonality — one writer, many
#               readers, so `writes: serial-direct` never implies `room: solo`.
#   autonomy    ABSENT here, deliberately. Absent already means `manual`
#               (project.schema.md "autonomy — optional"), and a reference example that
#               pins a key to its own default stops demonstrating which keys are
#               required. The `auto-trunk` grant this repo carried was dropped in #202:
#               every branched unit's Phase B is a human act again.
#   exposure    OPTIONAL. none | self | live | released. What consumes a merge here —
#               additive alongside tier in this unit; tier stays authoritative
#               (project.schema.md "exposure — optional"). This repo IS released:
#               public, adopters copy it, and it ships by tag (#128 §2c — a repo can
#               be tag-published with real downstream adopters while production stays
#               null, because there is no server to publish a URL for).
#   channels    OPTIONAL. a LIST of workflow | hook | procedure | checkout | artifact |
#               data | none. By what path a commit reaches something that runs it —
#               additive alongside deploy in this unit; deploy stays authoritative
#               (project.schema.md "channels — optional"). This repo's own channel is
#               `artifact`: adopters copy files out of a tagged release (the same fact
#               already on record as exposure: released above). No deploy workflow, no
#               in-repo or installed hook, no service definition serves this checkout.
#
tier: B
trunk: main
production: null
deploy: none
stack: docs + copy-and-own CI templates + audit CLI (no build)
writes: serial-direct
room: public
exposure: released
channels: [artifact]

# Granted 2026-08-14 (#224), by the operator, after the matrix cell above it was
# corrected — `serial-direct` + `auto-trunk` was forbidden until that ruling.
# What it grants: `colab ship` may complete the BRANCH-MERGE half of Phase B on
# its own, once every precondition passes (CI green measured by trunk's head sha,
# no new migrations without a grant, no hand-code conflict). A refusal means a
# human finishes, never that the tool improvises around it.
# What it does NOT grant, on this repo or any other: promotion, tags, or anything
# that reaches production. This repo is `exposure: released` — the tag that ships
# it stays a human act, and no field can say otherwise.
autonomy: auto-trunk
