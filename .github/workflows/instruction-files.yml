# Instruction files — REUSABLE workflow (#588). Callable from any repo, any org, while this repo
# is public. Copy the caller in templates/instruction-files.yml (≤10 lines); nothing here is
# copied, which is the point: one judgement, maintained once.
#
# THE RULE (CONVENTIONS.md §9 step 5): repo prose lives in AGENTS.md; every CLAUDE.md is only
# the `@AGENTS.md` import plus tool-managed blocks (the Conventions block with its stamp, paired
# BEGIN/END or <name>:start/end blocks). The judgement is `colab instruction-files`
# (tools/lib/instruction-gate.js over tools/lib/instruction-file.js) — the same code the audit and
# the pre-commit hook run.
#
# THE RATCHET, so the caller can be added before a repo is migrated. Fails only when a CLAUDE.md
# does not conform at the head AND either
#   - a CLAUDE.md or AGENTS.md changed since the merge base (the change owns those files), or
#   - every CLAUDE.md conformed at the merge base (this would regress a migrated repo).
# An unmigrated repo whose change leaves both files alone stays green — adding the caller never
# turns trunk red on its own.
#
# THE FORK EXEMPTION (#602): a repo declaring `instruction-files: upstream` in .github/project.yml
# (a fork whose CLAUDE.md/AGENTS.md are its upstream's — CONVENTIONS.md §9) passes unjudged.
#
# THE BASE: a pull request → the first parent of the merge commit actions/checkout checked out
# (refs/pull/N/merge), i.e. the base-branch tip GitHub merged the PR onto — so the diff is exactly
# what the PR adds. Not `pull_request.base.sha`: that sha can be OLDER than the first parent (the
# base moved and the PR branch was not updated), and then every base-branch commit since — an
# AGENTS.md edit on trunk, say — would be blamed on the PR (#595). A caller that checked out the
# head instead of the merge commit has no second parent; then the base sha is right as-is, because
# merge-base(base sha, head) is the PR's fork point. A push to trunk (`trunk:` in
# .github/project.yml, else the default branch) → the sha before the push. Any other push →
# origin/<trunk>. Resolved here in the shell, not by a checker flag, so a caller pinning an older
# `handbook-ref` keeps working.
#
# THE RUNNER (#594): `runs-on` defaults to ubuntu-latest. A caller whose org has no GitHub-hosted
# minutes (spending limit, self-hosted-only org) has that job refused before it starts — a red
# check on every PR it can never fix — so it passes its own runner: a bare label
# (`runs-on: my-runner`) or a JSON label list (`runs-on: '["self-hosted","linux"]'`). The job needs
# only git (actions/checkout) — Node comes from actions/setup-node — so any Linux runner works.
name: instruction-files

on:
  workflow_call:
    inputs:
      handbook-ref:
        description: Ref of the handbook whose checker runs (default main). Pin a tag to freeze it.
        type: string
        required: false
        default: main
      runs-on:
        description: >-
          Runner for the job — a bare label (`ubuntu-latest`, `my-runner`) or a JSON label list
          (`'["self-hosted","linux"]'`). Default ubuntu-latest. Needs only git — Node is set up by the job.
        type: string
        required: false
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  instruction-files:
    name: CLAUDE.md is @AGENTS.md + tool blocks
    # A value starting with `[` is a JSON label list; anything else is one label, used as-is.
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0          # the merge base must be reachable; a shallow clone cannot answer
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: futurelastic/colab-handbook
          ref: ${{ inputs.handbook-ref }}
          path: .colab-handbook-checker
          persist-credentials: false
      # Pinned Node, not whatever is on PATH: a plain self-hosted runner may have none (#594).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .colab-handbook-checker/.nvmrc   # the checker's own pin
      - name: Judge every CLAUDE.md (ratcheted)
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          trunk=$(sed -n 's/^trunk:[[:space:]]*\([^[:space:]#]*\).*/\1/p' .github/project.yml 2>/dev/null | head -1)
          trunk=${trunk:-$DEFAULT_BRANCH}
          base="origin/$trunk"
          if [ -n "$PR_BASE" ]; then
            base="$PR_BASE"
            if git rev-parse -q --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')   # the merge commit's first parent — see THE BASE (#595)
            fi
          elif [ "$EVENT" = push ] && [ "$REF" = "refs/heads/$trunk" ] && [ -n "$BEFORE" ] \
               && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          fi
          echo "ratchet base: $base"
          node .colab-handbook-checker/tools/colab instruction-files --base "$base"
