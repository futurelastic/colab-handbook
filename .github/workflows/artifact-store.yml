# The oracle for .github/actions/artifact-store (#601).
#   hermetic  — the same bash script on Linux, macOS and Windows, through a fake `aws`
#               (test/aws): path handling, globs, attempts, publish, every refusal.
#   produce → consume — a real S3-compatible store (SeaweedFS) round-trips a file AND a directory
#               between two jobs, once per client (aws, mc). A store started in a job dies with it,
#               so its data dir rides to the next job in actions/cache — the consuming job is a
#               different runner and workspace, and finds the files only through the run key.
#   bare-linux / bare-windows — object/ (#753), the single-file path for a runner with no bash and
#               no S3 client. Linux: against Garage, which ENFORCES a non-default region (SeaweedFS
#               ignores it, #752), interleaved with the bash actions both ways. Windows: every step in
#               Windows PowerShell 5.1 with the inbox curl.exe, against a native SeaweedFS.
name: artifact-store
on:
  push:
    paths:
      - '.github/actions/artifact-store/**'
      - '.github/workflows/artifact-store.yml'
  pull_request:
    paths:
      - '.github/actions/artifact-store/**'
      - '.github/workflows/artifact-store.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  SEAWEEDFS_IMAGE: chrislusf/seaweedfs:4.48
  SEAWEEDFS_VERSION: '4.48'   # the same release, as a Windows binary for bare-windows
  GARAGE_IMAGE: dxflrs/garage:v1.1.0
  # Test-only: built from source because MinIO stopped publishing mc binaries. The action itself
  # never installs a client.
  MC_VERSION: RELEASE.2025-08-13T08-35-41Z
  ENDPOINT: http://127.0.0.1:8333

jobs:
  hermetic:
    name: Hermetic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Script round-trip through the fake client
        shell: bash
        run: bash .github/actions/artifact-store/test/roundtrip.sh
      - name: Put the fake aws first on PATH
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/.github/actions/artifact-store/test" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/fake-s3/artifacts"
          echo "FAKE_S3_ROOT=$RUNNER_TEMP/fake-s3" >> "$GITHUB_ENV"
          bash .github/actions/artifact-store/test/fixtures.sh fx
      - name: Upload through the action
        uses: ./.github/actions/artifact-store/upload
        with:
          name: tree
          path: fx/tree
          bucket: artifacts
          client: aws
          if-no-files-found: error
      - name: Download through the action
        uses: ./.github/actions/artifact-store/download
        with:
          name: tree
          path: got/tree
          bucket: artifacts
          client: aws
      - name: Compare
        shell: bash
        run: |
          test ! -e got/tree/.cache
          rm -rf fx/tree/.cache
          diff -r fx/tree got/tree

  produce:
    name: Produce (${{ matrix.client }})
    strategy:
      fail-fast: false
      matrix:
        client: [aws, mc]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Build mc
        if: matrix.client == 'mc'
        run: |
          GOBIN="$RUNNER_TEMP/store/bin" go install "github.com/minio/mc@$MC_VERSION"
          echo "$RUNNER_TEMP/store/bin" >> "$GITHUB_PATH"
      - name: Start the store
        run: bash .github/actions/artifact-store/test/store.sh start
      - run: bash .github/actions/artifact-store/test/fixtures.sh fx
      - name: Upload a file
        uses: ./.github/actions/artifact-store/upload
        with:
          name: file-${{ matrix.client }}
          path: fx/one.txt
          if-no-files-found: error
          endpoint: ${{ env.ENDPOINT }}
          bucket: artifacts
          access-key: testkey
          secret-key: testsecret
          client: ${{ matrix.client }}
      - name: Upload a directory
        uses: ./.github/actions/artifact-store/upload
        with:
          name: dir-${{ matrix.client }}
          path: fx/tree
          if-no-files-found: error
          endpoint: ${{ env.ENDPOINT }}
          bucket: artifacts
          access-key: testkey
          secret-key: testsecret
          client: ${{ matrix.client }}
      - name: Publish release files
        id: publish
        uses: ./.github/actions/artifact-store/upload
        with:
          mode: publish
          app: demo-${{ matrix.client }}
          version: 1.0.0
          path: fx/tree/sub
          public-base: https://downloads.example.com
          endpoint: ${{ env.ENDPOINT }}
          bucket: artifacts
          access-key: testkey
          secret-key: testsecret
          client: ${{ matrix.client }}
      - name: Check the published keys and headers
        env:
          AWS_ACCESS_KEY_ID: testkey
          AWS_SECRET_ACCESS_KEY: testsecret
          AWS_DEFAULT_REGION: us-east-1
          URLS: ${{ steps.publish.outputs.urls }}
          APP: demo-${{ matrix.client }}
        run: |
          h() { aws --endpoint-url "$ENDPOINT" s3api head-object --bucket artifacts --key "$1" --query '[ContentType,CacheControl]' --output text; }
          h "$APP/1.0.0/deeper/numbers.txt" | grep -q 'immutable'
          h "$APP/latest/deeper/numbers.txt" | grep -q 'max-age=300'
          h "$APP/latest.json" | grep -q 'application/json'
          grep -qx "https://downloads.example.com/$APP/1.0.0/deeper/numbers.txt" <<< "$URLS"
      - name: Stop the store
        run: bash .github/actions/artifact-store/test/store.sh stop
      - name: Hand the store's data to the next job
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/store
          key: artifact-store-test-${{ github.run_id }}-${{ matrix.client }}-${{ github.run_attempt }}

  consume:
    name: Consume (${{ matrix.client }})
    needs: produce
    strategy:
      fail-fast: false
      matrix:
        client: [aws, mc]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Take the store's data from the producing job
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/store
          key: artifact-store-test-${{ github.run_id }}-${{ matrix.client }}-${{ github.run_attempt }}
          restore-keys: artifact-store-test-${{ github.run_id }}-${{ matrix.client }}-
          fail-on-cache-miss: true
      - name: Restart the store on that data
        run: |
          if [ "${{ matrix.client }}" = mc ]; then echo "$RUNNER_TEMP/store/bin" >> "$GITHUB_PATH"; fi
          bash .github/actions/artifact-store/test/store.sh start-again
      - run: bash .github/actions/artifact-store/test/fixtures.sh fx
      - name: Download the file
        uses: ./.github/actions/artifact-store/download
        with:
          name: file-${{ matrix.client }}
          path: got/file
          endpoint: ${{ env.ENDPOINT }}
          bucket: artifacts
          access-key: testkey
          secret-key: testsecret
          client: ${{ matrix.client }}
      - name: Download the directory
        uses: ./.github/actions/artifact-store/download
        with:
          name: dir-${{ matrix.client }}
          path: got/dir
          endpoint: ${{ env.ENDPOINT }}
          bucket: artifacts
          access-key: testkey
          secret-key: testsecret
          client: ${{ matrix.client }}
      - name: Download by pattern
        uses: ./.github/actions/artifact-store/download
        with:
          pattern: '*-${{ matrix.client }}'
          path: got/all
          endpoint: ${{ env.ENDPOINT }}
          bucket: artifacts
          access-key: testkey
          secret-key: testsecret
          client: ${{ matrix.client }}
      - name: A missing name must fail
        id: missing
        continue-on-error: true
        uses: ./.github/actions/artifact-store/download
        with:
          name: never-uploaded
          path: got/missing
          endpoint: ${{ env.ENDPOINT }}
          bucket: artifacts
          access-key: testkey
          secret-key: testsecret
          client: ${{ matrix.client }}
      - name: Compare with the regenerated fixtures
        env:
          MISSING: ${{ steps.missing.outcome }}
          CLIENT: ${{ matrix.client }}
        run: |
          cmp fx/one.txt got/file/one.txt
          test ! -e got/dir/.cache
          rm -rf fx/tree/.cache
          diff -r fx/tree got/dir
          cmp fx/one.txt "got/all/file-$CLIENT/one.txt"
          diff -r fx/tree "got/all/dir-$CLIENT"
          test "$MISSING" = failure
          echo "round-trip between two jobs through the store: ok ($CLIENT)"

  bare-linux:
    name: Bare-runner path (Linux, region-enforcing store)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GARAGE_REGION: eu-north-9
      STORE: http://127.0.0.1:3900   # garage.sh start mints a throwaway key into AK / SK
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Start a store that enforces its region
        run: bash .github/actions/artifact-store/test/garage.sh start
      - name: Pack the hand-off (the persistent job's side)
        run: |
          mkdir -p inst && head -c 300000 /dev/urandom > inst/setup.exe
          (cd inst && zip -q ../handoff.zip setup.exe)
      - name: Upload it with the bash action
        uses: ./.github/actions/artifact-store/upload
        with:
          name: installer
          path: handoff.zip
          if-no-files-found: error
          endpoint: ${{ env.STORE }}
          bucket: artifacts
          access-key: ${{ env.AK }}
          secret-key: ${{ env.SK }}
          region: ${{ env.GARAGE_REGION }}
          client: aws
      - name: Get it with the object action
        id: get
        uses: ./.github/actions/artifact-store/object
        with:
          mode: get
          name: installer
          file: handoff.zip
          path: fetched/handoff.zip
          endpoint: ${{ env.STORE }}
          bucket: artifacts
          access-key: ${{ env.AK }}
          secret-key: ${{ env.SK }}
          region: ${{ env.GARAGE_REGION }}
      - name: Pack its logs (the bare job's side)
        shell: pwsh
        run: Compress-Archive -Path fetched/handoff.zip -DestinationPath logs.zip
      - name: Put the logs with the object action
        id: put
        uses: ./.github/actions/artifact-store/object
        with:
          mode: put
          name: clean-install-logs
          path: logs.zip
          endpoint: ${{ env.STORE }}
          bucket: artifacts
          access-key: ${{ env.AK }}
          secret-key: ${{ env.SK }}
          region: ${{ env.GARAGE_REGION }}
      - name: Read the logs back with the bash action
        uses: ./.github/actions/artifact-store/download
        with:
          name: clean-install-logs
          path: back
          endpoint: ${{ env.STORE }}
          bucket: artifacts
          access-key: ${{ env.AK }}
          secret-key: ${{ env.SK }}
          region: ${{ env.GARAGE_REGION }}
          client: aws
      - name: A missing object must fail
        id: missing
        continue-on-error: true
        uses: ./.github/actions/artifact-store/object
        with:
          mode: get
          name: never-uploaded
          file: x.zip
          endpoint: ${{ env.STORE }}
          bucket: artifacts
          access-key: ${{ env.AK }}
          secret-key: ${{ env.SK }}
          region: ${{ env.GARAGE_REGION }}
      - name: Compare
        env:
          MISSING: ${{ steps.missing.outcome }}
          GOT_ATTEMPT: ${{ steps.get.outputs.attempt }}
          PUT_KEY: ${{ steps.put.outputs.key }}
        run: |
          cmp handoff.zip fetched/handoff.zip
          cmp logs.zip back/logs.zip
          test "$MISSING" = failure
          test "$GOT_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
          test "$PUT_KEY" = "$GITHUB_REPOSITORY/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/clean-install-logs/logs.zip"
          echo "bash upload -> object get, object put -> bash download, region $GARAGE_REGION: ok"
      - name: The object script's own checks (attempts, encoding, wrong secret, wrong region, refusals)
        shell: pwsh
        env:
          AS_ENDPOINT: ${{ env.STORE }}
          AS_BUCKET: artifacts
          AS_ACCESS_KEY: ${{ env.AK }}
          AS_SECRET_KEY: ${{ env.SK }}
          AS_REGION: ${{ env.GARAGE_REGION }}
          AS_EXPECT_REGION_CHECK: 'true'
        run: '& ./.github/actions/artifact-store/test/object.ps1; exit $LASTEXITCODE'
      - name: Stop the store
        if: always()
        run: bash .github/actions/artifact-store/test/garage.sh stop

  bare-windows:
    name: Bare-runner path (Windows PowerShell 5.1, no bash)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell   # every step: the bare lane has Windows PowerShell and curl.exe, nothing else
    env:
      REGION: eu-north-9    # SeaweedFS ignores it; signed for anyway, as on the real lane
      STORE: http://127.0.0.1:8333
      AK: testkey
      SK: testsecret
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: The tools this path relies on
        run: |
          $PSVersionTable.PSVersion.ToString()
          curl.exe --version
      - name: Start a store (SeaweedFS's Windows binary — test-only)
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $d = Join-Path $env:RUNNER_TEMP 'weed'
          Invoke-WebRequest -UseBasicParsing "https://github.com/seaweedfs/seaweedfs/releases/download/$env:SEAWEEDFS_VERSION/windows_amd64.zip" -OutFile "$d.zip"
          Expand-Archive -LiteralPath "$d.zip" -DestinationPath $d
          $weed = (Get-ChildItem -LiteralPath $d -Recurse -Filter weed.exe | Select-Object -First 1).FullName
          [void](New-Item -ItemType Directory -Path "$d\data")
          $cfg = Join-Path $env:GITHUB_WORKSPACE '.github\actions\artifact-store\test\seaweedfs-s3.json'
          # -ip too: without it the master advertises the runner's LAN address and cannot reach itself
          Start-Process -FilePath $weed -ArgumentList @('server', "-dir=$d\data", '-s3', "-s3.config=$cfg", '-ip=127.0.0.1', '-ip.bind=127.0.0.1') `
            -RedirectStandardOutput "$d\out.log" -RedirectStandardError "$d\err.log" -WindowStyle Hidden
          for ($i = 0; $i -lt 90; $i++) {
            # credentials on stdin (-K -), as the action passes them, and with the same encoding:
            # the runner's Windows PowerShell otherwise writes a BOM curl reads as part of the option
            $OutputEncoding = New-Object System.Text.UTF8Encoding $false
            $code = ('user = "' + $env:AK + ':' + $env:SK + '"') | curl.exe -s -K - -o NUL -w '%{http_code}' --aws-sigv4 "aws:amz:${env:REGION}:s3" -X PUT "$env:STORE/artifacts"
            if ($code -eq '200') { Write-Output 'store: up, bucket artifacts'; exit 0 }
            Start-Sleep -Seconds 1
          }
          Get-Content "$d\err.log" -Tail 30; exit 1
      - name: The object script's own checks, under Windows PowerShell 5.1
        env:
          AS_ENDPOINT: ${{ env.STORE }}
          AS_BUCKET: artifacts
          AS_ACCESS_KEY: ${{ env.AK }}
          AS_SECRET_KEY: ${{ env.SK }}
          AS_REGION: ${{ env.REGION }}
        run: '& .\.github\actions\artifact-store\test\object.ps1; exit $LASTEXITCODE'
      - name: Write a log
        run: |
          [void](New-Item -ItemType Directory -Path logs -Force)
          [IO.File]::WriteAllText("$PWD\logs\clean install.log", "installer exit 0`r`n")
      - name: Put it with the object action
        uses: ./.github/actions/artifact-store/object
        with:
          mode: put
          name: win-logs
          path: logs/clean install.log
          endpoint: ${{ env.STORE }}
          bucket: artifacts
          access-key: ${{ env.AK }}
          secret-key: ${{ env.SK }}
          region: ${{ env.REGION }}
      - name: Get it back with the object action
        uses: ./.github/actions/artifact-store/object
        with:
          mode: get
          name: win-logs
          file: clean install.log
          path: got\clean install.log
          endpoint: ${{ env.STORE }}
          bucket: artifacts
          access-key: ${{ env.AK }}
          secret-key: ${{ env.SK }}
          region: ${{ env.REGION }}
      - name: A missing object must fail
        id: missing
        continue-on-error: true
        uses: ./.github/actions/artifact-store/object
        with:
          mode: get
          name: never-uploaded
          file: x.zip
          endpoint: ${{ env.STORE }}
          bucket: artifacts
          access-key: ${{ env.AK }}
          secret-key: ${{ env.SK }}
          region: ${{ env.REGION }}
      - name: Compare
        env:
          MISSING: ${{ steps.missing.outcome }}
        run: |
          if ((Get-FileHash -LiteralPath 'logs\clean install.log').Hash -ne (Get-FileHash -LiteralPath 'got\clean install.log').Hash) { Write-Output 'round-trip changed the file'; exit 1 }
          if ($env:MISSING -ne 'failure') { Write-Output 'a missing object must fail'; exit 1 }
          Write-Output 'object put -> get under Windows PowerShell 5.1: ok'
