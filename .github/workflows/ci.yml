# CI for the handbook itself. Two outcomes, per CONVENTIONS.md §7:
# a secret scan and a build/verify. "Build" here means: the CLI parses,
# the installer parses, and the handbook passes its own audit tool —
# a handbook that fails its own conventions is anti-pattern #4.
name: CI

on:
  push:
    # Every branch, not only trunk (#411) — the same trigger shape #384 gave the
    # templates. Sessions push branches without opening a PR, so a main-only trigger
    # leaves every candidate with branch CI class `none`: the green-branch-run stand-in
    # for the hermetic verdict never applies here, and a red first surfaces as a TRUNK
    # red after the merge (CONVENTIONS.md §4, "Branch CI"). GitHub-hosted runners, so
    # branch runs never queue ahead of a trunk run (§7, "Self-hosted runners").
    branches: ['**']
  pull_request:

# One live run per ref: a new push cancels the superseded run on the same branch.
# `main` is NEVER cancelled — every trunk sha keeps a completed run of its own, which
# is what the merge gate reads. Pull-request runs group under refs/pull/<n>/merge,
# apart from the branch's push runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Already tested at this sha? (#418) — the claim push.
  # A session's claim pushes its branch at the moment it is cut (CONVENTIONS.md §5, the
  # claim record), so the branch's first push sits on a sha trunk has usually already
  # run. Without this job that push re-runs the whole suite on a tested commit (~19% of
  # all runs, measured across five adopting repos). This job runs ONLY on a ref's first
  # push (`github.event.created`), checks nothing out, and asks one question: does THIS
  # workflow already have a completed, green, non-PR run at THIS exact sha? Yes → every
  # other job is skipped and the run concludes `success` — a branch-CI `green` that is
  # true, because the same workflow passed at the same sha. Anything else — trunk still
  # running, red, never run, `gh` missing, the API failing — and the suite runs as
  # before (fail-open: this job never fails the run). Every later push has
  # `created == false`, so a real commit always gets the full suite, with no extra hop.
  # Why not simply `if: !github.event.created` on every job: a run whose jobs are ALL
  # skipped concludes `skipped`, which `colab ship` reads as not-green (CONVENTIONS.md
  # §4, "Branch CI"). This job is the one that ends green.
  #
  # Already tested at this TREE? (#493) — the squash merge.
  # A ship squash-merges a branch whose green run already contained the current base, so
  # the trunk commit's TREE is byte-identical to the tree that branch run passed — only the
  # sha is new. On a non-creating push to trunk this job therefore also asks: does THIS
  # workflow have a green `push` run, on another ref of this repo, whose commit has THIS
  # exact tree? It confirms the tree through the git object, never only the run listing.
  # Yes → the suite is skipped and the run cites the run it relied on (a
  # `tree-already-green` notice that `colab ship` / `colab trunk-ci` read back). Equal
  # trees cover every committed byte, workflows and lockfiles included — NOT runner images,
  # unpinned downloads, secrets or `github.ref`-conditional steps; a repo whose suite
  # depends on those declares `tree-reuse: off` in .github/project.yml. Trunk only (the
  # descriptor's `trunk:`, read at this sha), never a release branch, never a dispatch;
  # any doubt (no descriptor, opt-out, an API error, no exact match) runs the full suite.
  # Never put a trunk-only job (publish, deploy, release) behind this gate.
  dedupe:
    name: Already tested at this sha or tree?
    # EDIT: the trunk refs here mirror `concurrency`'s list above (#493).
    if: github.event_name == 'push' && (github.event.created || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
      cited: ${{ steps.check.outputs.cited }}
    steps:
      - name: Look for a green run of this workflow at this sha or tree
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          CREATED: ${{ github.event.created }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tested=false
          cited=
          if ! command -v gh >/dev/null 2>&1; then
            echo "::notice::gh is not installed on this runner — running the full suite (#418)."
          elif ! WFID="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .workflow_id 2>/dev/null)" || [ -z "$WFID" ]; then
            echo "::notice::Could not read this run's workflow id — running the full suite (#418)."
          elif [ "${CREATED:-}" = "false" ]; then
            # A non-creating push: trunk tree mode (#493). Every branch below but one runs the suite.
            if ! DESC="$(gh api "repos/$REPO/contents/.github/project.yml?ref=$SHA" -H 'Accept: application/vnd.github.raw' 2>/dev/null)" || [ -z "$DESC" ]; then
              echo "::notice::Could not read .github/project.yml at $SHA — running the full suite (#493)."
            elif grep -Eq '^tree-reuse[[:space:]]*:' <<< "$DESC"; then
              echo "::notice::tree-reuse is declared in .github/project.yml — running the full suite (#493)."
            elif [ "$(printf '%s\n' "$DESC" | sed -nE "s/^trunk:[[:space:]]*[\"']?([A-Za-z0-9._/-]+).*/\\1/p" | head -n 1)" != "$REF_NAME" ]; then
              echo "::notice::$REF_NAME is not this repo's trunk — running the full suite (#493)."
            elif ! OURS="$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha 2>/dev/null)" || [ -z "$OURS" ]; then
              echo "::notice::Could not read the tree of $SHA — running the full suite (#493)."
            elif ! CAND="$(gh api "repos/$REPO/actions/workflows/$WFID/runs?event=push&status=success&per_page=50" \
                   --jq "first(.workflow_runs[] | select(.id != $RUN_ID and .head_branch != \"$REF_NAME\" and .head_repository.full_name == \"$REPO\" and .head_commit.tree_id == \"$OURS\") | \"\\(.head_sha) \\(.html_url) \\(.head_branch)\") // empty" 2>/dev/null)"; then
              echo "::notice::Could not list this workflow's green runs — running the full suite (#493)."
            elif [ -z "$CAND" ]; then
              echo "No green run of this workflow on another ref has tree $OURS — running the full suite."
            else
              read -r CSHA URL BR <<< "$CAND"
              if ! CTREE="$(gh api "repos/$REPO/git/commits/$CSHA" --jq .tree.sha 2>/dev/null)" || [ "$CTREE" != "$OURS" ]; then
                echo "::notice::Could not confirm the tree of $CSHA — running the full suite (#493)."
              else
                tested=true
                cited="$URL"
                echo "::notice title=tree-already-green::$URL tree=$OURS head=$CSHA branch=$BR"
                echo "Tree $OURS already passed this workflow at $CSHA on $BR ($URL) — skipping the suite (#493)."
                echo "Already tested: tree \`$OURS\` passed this workflow on \`$BR\` — [the run relied on]($URL); suite skipped (#493)." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          elif ! N="$(gh api "repos/$REPO/actions/workflows/$WFID/runs?head_sha=$SHA&status=success&per_page=20" \
                 --jq "[.workflow_runs[] | select(.id != $RUN_ID and .event != \"pull_request\")] | length" 2>/dev/null)"; then
            echo "::notice::Could not list this workflow's runs at $SHA — running the full suite (#418)."
          elif [ "${N:-0}" -ge 1 ] 2>/dev/null; then
            tested=true
            echo "This workflow already passed at $SHA ($N green run(s)) — skipping the suite (#418)."
            echo "Already tested: this workflow has a green run at \`$SHA\` — suite skipped (#418)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No green run of this workflow at $SHA yet — running the full suite."
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          [ -z "$cited" ] || echo "cited=$cited" >> "$GITHUB_OUTPUT"

  gitleaks:
    name: Secret scan (gitleaks)
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      # Pinned binary instead of gitleaks-action v2: the action requires a
      # GITLEAKS_LICENSE for org-owned repos; the binary is MIT and free.
      - name: Install gitleaks (pinned binary)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz
      - name: gitleaks detect
        run: gitleaks detect --source . --no-banner

  actionlint:
    name: Schema-lint workflow templates (actionlint)
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: "1.7.12"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      # Pinned binary, same pattern as gitleaks above.
      - name: Install actionlint (pinned binary)
        run: |
          curl -sSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          rm -f actionlint.tar.gz
      # #245: a job-level `if: hashFiles('package.json') != ''` in templates/ci-node.yml
      # is rejected at workflow-VALIDATION time — before any job runs — because
      # hashFiles() is not among the functions GitHub permits in `jobs.<job_id>.if`.
      # yaml.safe_load and this job's own syntax checks both pass on a file like that;
      # only a schema/expression-aware linter catches it. That bug shipped in two
      # tagged releases before an adopter's red trunk surfaced it. This step is what
      # would have caught it on the commit that introduced it (a042cea).
      #
      # -shellcheck= and -pyflakes= are deliberate: they turn off actionlint's shell-
      # and Python-linting integrations, which flag pre-existing style issues in the
      # templates' embedded scripts unrelated to workflow schema/expression validity —
      # the regression class this step exists for. templates/*.yml are also meant to
      # be edited by adopters after copying, so shell-style enforcement here would be
      # policing text that is not this repo's to keep clean. Verified: actionlint with
      # both disabled is clean on current templates/*.yml + this repo's own ci.yml, and
      # fails at the exact offending line when #245's job-level `if: hashFiles(...)` is
      # reintroduced.
      - name: actionlint templates/*.yml + this repo's own workflow
        run: actionlint -shellcheck= -pyflakes= templates/*.yml .github/workflows/*.yml

  self-check:
    name: Self-audit + syntax
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the audit's trunk-existence check can see real local branch
      # refs on a pull_request run too — a shallow, detached checkout has none, and the
      # audit used to misread that as "trunk does not exist" rather than "unverifiable"
      # (#104). The audit itself was also fixed to treat a branchless detached HEAD as
      # not-evaluable, so this is belt-and-suspenders, not the only fix.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
      - name: Syntax-check the CLI and audit tool
        run: |
          node --check tools/colab
          for f in tools/lib/*.js tools/lib/codec/*.js audit/audit.mjs; do node --check "$f"; done
          for f in templates/*.mjs; do node --check "$f"; done
          sh -n install.sh
          # Every shell artifact this repo ships or runs. The hook templates are `sh`, and an
          # unbalanced quote inside an embedded awk program parses as a shell quote — one such
          # typo (an apostrophe in an awk comment) made the scanner unrunnable while looking
          # perfectly ordinary. Their BEHAVIOUR is covered by tools/lib/identity-hook.test.js;
          # this line is the cheap first gate, not the coverage.
          for f in .githooks/install.sh templates/pre-commit-identity templates/pre-commit-dispatch \
                   .githooks/pre-commit .githooks/pre-commit.d/*; do sh -n "$f"; done
      # A syntax check reads bytes; it does not read like a human. Two raw NULs once made the CLI
      # read as "binary data" to file(1) and invisible to grep without -a, while node --check, the
      # tests, git diff and the audit all stayed green. Cheap byte scan, catches the whole class.
      - name: No stray control bytes in tracked text files
        run: node scripts/check-text-bytes.mjs
      # The npm tarball (#431): `npm pack --dry-run`, every packed file compared against an
      # allowlist AND required to be tracked — a stray local file under an allowed directory fails.
      # The second step proves the gate can fail: it plants a file and expects a refusal, so a gate
      # that quietly stopped measuring cannot stay green.
      - name: npm pack allowlist (privacy gate)
        run: |
          node scripts/check-pack-allowlist.mjs
          echo stray > templates/zz-planted-stray.local
          if node scripts/check-pack-allowlist.mjs; then echo "gate passed with a planted stray file"; exit 1; fi
          rm -f templates/zz-planted-stray.local
      # The normative documents (#523): every rule in docs/rule-inventory.md is still where its row
      # says, every hard rule carries its marker and names a gate literal that exists, and each
      # document is within its line budget. Both checks are proved able to fail by unit tests
      # (tools/lib/rule-inventory.test.js, tools/lib/doc-budget.test.js).
      - name: Rule inventory and size budget (normative documents)
        run: |
          node scripts/check-rule-inventory.mjs
          node scripts/check-doc-budget.mjs
      # The skills install into any coding agent (#530), so no skill body may write one engine's
      # slash command, tool call or model name (#531). The planted file proves the gate can fail.
      - name: Skill bodies are engine-neutral
        run: |
          node scripts/check-engine-neutral.mjs
          echo 'run /code-wrap' > skills/code-plan/zz-planted.md
          if node scripts/check-engine-neutral.mjs 2>/dev/null; then echo "gate passed with a planted slash command"; exit 1; fi
          rm -f skills/code-plan/zz-planted.md
      # The stamp heuristic decides whether a repo's file is "ours". A false positive there ends in
      # advice to overwrite that file, so it is the one piece of logic here with unit tests.
      #
      # This step is fail-open by default: if NODE_TEST_CONTEXT/NODE_TEST_WORKER_ID leak in from a
      # parent process, `node --test` decides it is already running as a child test run, skips
      # everything, and still exits 0 (#154). A hosted runner starts clean so that specific cause is
      # not believed to hit here today, but the check below is not about that one cause — it also
      # catches a glob matching zero files after a rename, or a runner image change, the same way.
      # `-u` on unset vars is a harmless no-op, so scrubbing is safe even when nothing leaked.
      #
      # `set -o pipefail` is NOT implied here. This repo declares no `shell:`, so a Linux `run:`
      # block is invoked as `bash -e {0}` — `-e` only, no `-o pipefail` (that combination is only
      # what `shell: bash` gets). Piping `node --test | tee …` without it made `tee`'s always-0 exit
      # the step's exit, silently turning a genuine failing test into a passing step — a wider
      # fail-open than the one this change closes. Measured: a deliberately failing test under
      # `bash -e {0}` exactly as the runner invokes it exits 0 without the line below, 1 with it.
      - name: Unit tests
        run: |
          set -o pipefail
          env -u NODE_TEST_CONTEXT -u NODE_TEST_WORKER_ID \
            node --test --test-reporter=tap tools/lib/*.test.js tools/lib/codec/*.test.js | tee /tmp/unit-tests.tap
          ran="$(grep -oE '^# tests [0-9]+' /tmp/unit-tests.tap | grep -oE '[0-9]+' || true)"
          failed="$(grep -oE '^# fail [0-9]+' /tmp/unit-tests.tap | grep -oE '[0-9]+' || true)"
          if [ -z "$ran" ] || [ "$ran" -eq 0 ]; then
            echo "::error::node --test reported zero tests run — this step is supposed to fail closed, not silently pass (see #154)" >&2
            exit 1
          fi
          if [ -z "$failed" ] || [ "$failed" -ne 0 ]; then
            echo "::error::node --test reported $failed failing test(s) — pipefail should already have failed this step; this is belt-and-suspenders (see #154)" >&2
            exit 1
          fi
          echo "Ran $ran test(s), 0 failed."

      - name: Audit the handbook against its own conventions
        run: node audit/audit.mjs --local .
