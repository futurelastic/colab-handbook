# The full-history secret scan of trunk's tip (#722) — this repo's stand-in for the heavy lane's
# `secrets` job (templates/ci-<stack>-heavy.yml, #716), because this repo has no heavy lane.
#
# ci.yml's "gitleaks detect" reads only the commits its run brings. This one reads every commit
# trunk's tip can reach: a secret committed and removed before this repo scanned in CI, or one a
# newer GITLEAKS_VERSION's rules now catch. `HEAD` only, never `git log --all`: a finding on a
# branch is that branch's own run's to report.
#
# A workflow of its own, not a job in ci.yml, so it never blocks a merge:
#   - Deliberately NOT triggered by push or pull_request. The merge gate counts only those events
#     (tools/lib/verify-runs.js, VERIFYING_EVENTS), and its lost-push rescue (#567) counts a
#     dispatch run only of a workflow that a push or pull request triggers, which this one is not.
#     So a red run here is never a merge verdict.
#   - A job inside ci.yml would share ci.yml's runs, and ci.yml's dispatch runs ARE counted by
#     that rescue, so its red would land on the sha the gate reads.
# A red scheduled run files one trunk-red issue (job `report`) instead.
#
# Runs nightly and by hand: Actions → "Secret scan (full history)" → Run workflow (it scans the
# chosen ref's history).

name: Secret scan (full history)

on:
  schedule:
    - cron: "41 4 * * *" # nightly, UTC — off the hour, when scheduled runs queue shortest
  workflow_dispatch:

permissions: {}

jobs:
  secrets:
    name: Secret scan, full history (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # the whole history, not a range
    permissions:
      contents: read
    env:
      # The same pin as ci.yml's gitleaks job — bump both together.
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0 # every commit the tip reaches
          persist-credentials: false
      # ci.yml's install step, verbatim: keep them in step when you edit either.
      - name: Install gitleaks (pinned binary)
        env:
          # Authenticated: an anonymous release download is what GitHub sheds under load (#698).
          GH_TOKEN: ${{ github.token }}
        run: |
          # Why each part — the curl flags, the API asset lookup, the sha256 check: the same step
          # in .github/workflows/ci-light.yml (#690, #698). Linux x64 only: this job runs on ubuntu-latest.
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tmp="$(mktemp -d)"
          fetch() {
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 120 \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: $1" -o "$3" "$2"
          }
          fetch application/vnd.github+json \
            "https://api.github.com/repos/gitleaks/gitleaks/releases/tags/v${GITLEAKS_VERSION}" "$tmp/release.json"
          for f in "$asset" "$sums"; do
            url="$(tr ',{[' '\n\n\n' < "$tmp/release.json" | awk -F'"' -v want="$f" '
              $2 == "url" && $4 ~ /\/releases\/assets\/[0-9]+$/ { u = $4 }
              $2 == "name" && $4 == want && !found { print u; found = 1 }')"
            if [ -z "$url" ]; then echo "::error::gitleaks release v${GITLEAKS_VERSION} has no asset $f"; exit 1; fi
            fetch application/octet-stream "$url" "$tmp/$f"
          done
          (cd "$tmp" && awk -v f="$asset" '$2 == f' "$sums" | sha256sum -c --strict -) \
            || { echo "::error::$asset failed its sha256 check against $sums"; exit 1; }
          tar -xzf "$tmp/$asset" -C "$tmp" gitleaks
          chmod +x "$tmp/gitleaks"
          sudo mv "$tmp/gitleaks" /usr/local/bin/gitleaks
          rm -rf "$tmp"
      - name: gitleaks detect (full history)
        run: gitleaks detect --source . --no-banner --log-opts=HEAD

  # A red NIGHTLY is a trunk finding, never a merge block: one open issue at a time. An open issue
  # with the same title suppresses a new one; an issue list that cannot be read files nothing and
  # fails this job, so a silent miss is never mistaken for "already reported". A red dispatch is
  # read by whoever ran it, and files nothing.
  report:
    name: Report a red nightly
    needs: secrets
    if: ${{ always() && github.event_name == 'schedule' && needs.secrets.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: File one trunk-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          title="Nightly full-history secret scan red"
          if ! open="$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number,title \
                         --jq "[.[] | select(.title == \"$title\")][0].number // \"\"")"; then
            echo "::error::cannot read this repo's issues — nothing filed; the red run is the only report"
            exit 1
          fi
          if [ -n "$open" ]; then
            echo "::notice::#$open already reports this scan red — not filing another."
            exit 0
          fi
          gh label create trunk-red -R "$REPO" --color B60205 --description "Trunk fails a check" 2>/dev/null || true
          body="$(printf 'The full-history secret scan failed on trunk at `%s`: %s\n\nIt reads every commit the trunk tip reaches, so the finding may be old. A nightly never blocks a merge. Close this issue once a nightly is green again.\n' "$SHA" "$RUN_URL")"
          gh issue create -R "$REPO" --title "$title" --label trunk-red --body "$body"
