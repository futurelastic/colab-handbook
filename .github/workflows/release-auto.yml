# Release (auto) — the handbook's OWN copy of templates/release-auto.yml (#428, rollout wave 1).
#
# The template's header explains what this workflow does and why (cut on green trunk, finalize
# daily, publish in the same run, a refusal is a warning). Read it there; this header records only
# how this copy DIFFERS from the template, and why.
#
# 1. IT RUNS THIS CHECKOUT'S OWN tools/colab, NOT A PINNED HANDBOOK_REF (ruling on #428). The
#    handbook is the one repo that ships the CLI it releases with, so it releases with the CLI at
#    the sha being released. The checkout is `ref: main`, the same commit `colab release cut`
#    fetches and tags (origin/main's head), so the CLI that decides is the commit it tags. No
#    clone, no branch ref. Adopters keep the template's pin and move it to the first final that
#    carries `release --auto`.
#
# 2. A RED CI RUN IS GATED IN A STEP, NOT A JOB-LEVEL `if:`. A run whose only job is skipped by
#    `if:` concludes `skipped`, and the trunk read (`summarizeRunsForCommit`, tools/lib/git.js)
#    counts any completed conclusion other than success/cancelled as not-green — so a skipped
#    Release row would keep a sha red after a CI re-run turned it green. The gate step below ends
#    green and switches the cut step off instead. NO LONGER A DIFFERENCE since #435: the template
#    adopted this same gate step after a run that red CI triggered was measured concluding
#    `skipped`. Kept here so the step's `header, point 2` reference still resolves.
#
# 3. THE `npm` JOBS ARE THE TEMPLATE'S, UNEDITED (#434) — publishing to npm by trusted publishing, opted in
#    by release.npm in .github/project.yml. The npm trusted publisher is bound to THIS file's name,
#    `release-auto.yml`; renaming it breaks publishing. Only difference: setup-node pins 22 (the
#    template's 24), because the audit reads .nvmrc=22 and flags a workflow pinning another major.
#
# 4. The route is not edited here: .github/project.yml (exposure: released, deploy: none,
#    production: null) derives `public-tool` — candidates automatic, final automatic after a clean
#    3-day test period (CONVENTIONS.md §6). The fleet reconciliation that scripts/release.sh runs
#    after a final is NOT run here (no fleet clones on a runner); a human runs it afterwards.

name: Release (auto)

on:
  workflow_run:
    # ci.yml's `name:` (pinned by tools/lib/release-auto-template.test.js).
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  schedule:
    # The daily finalize (UTC). Off the hour on purpose — the top of the hour is when
    # scheduled runs queue longest.
    - cron: "17 3 * * *"
  workflow_dispatch:

# One release run at a time; a second one waits rather than racing the first for the same
# candidate number. Never cancelled mid-run: a half-finished run may have pushed a tag
# without publishing it.
concurrency:
  group: release-auto
  cancel-in-progress: false

permissions: {}

# The template's retry helper, verbatim (#464) — pinned identical by release-auto-template.test.js.
env:
  # A TRANSIENT UPSTREAM ERROR NEVER TURNS MAIN RED (#464). This run fires on every landing, and a
  # red run at main's head blocks every `colab ship` — so a GitHub / registry 5xx, a 429, a timeout
  # or a dropped connection must not fail a step that a plain re-run would pass. Every step that
  # talks to the network runs its call through `retry_transient` (each step `eval`s this block):
  # the command is re-run with backoff while its output names a transient error, up to
  # RETRY_ATTEMPTS times, and the last attempt's output and exit code are what the step sees. A
  # persistent transient error still fails, with its message; anything else fails at once.
  # Retrying is only safe because every retried call is idempotent — a read, or a write whose
  # re-run after success is a no-op (`colab release cut/finalize/promote` read a head already done
  # as a no-op; a Release or npm version that already exists is a skip). Keep that true if you add one.
  RETRY_ATTEMPTS: "4" # EDIT: tries per call; backoff 5s, 10s, 20s between them.
  RETRY_TRANSIENT: |
    exec 3>&2
    TRANSIENT_PATTERN='HTTP (5[0-9][0-9]|429)|returned error: (5[0-9][0-9]|429)|No server is currently available|Service Unavailable|Bad Gateway|Gateway Time-?out|Internal Server Error|secondary rate limit|rate limit exceeded|ETIMEDOUT|ECONNRESET|EAI_AGAIN|socket hang up|i/o timeout|TLS handshake timeout|connection reset|Could not resolve host|remote end hung up|early EOF|RPC failed|code E(5[0-9][0-9]|429)'
    retry_transient() {
      local attempt=1 max="${RETRY_ATTEMPTS:-4}" delay="${RETRY_DELAY:-5}" rc out err
      out="$(mktemp)"; err="$(mktemp)"
      while :; do
        rc=0
        "$@" > "$out" 2> "$err" || rc=$?
        if [ "$rc" -eq 0 ] || [ "$attempt" -ge "$max" ] || ! cat "$err" "$out" | grep -Eiq "$TRANSIENT_PATTERN"; then
          cat "$out"; cat "$err" >&2; rm -f "$out" "$err"; return "$rc"
        fi
        echo "::warning::$1: transient error (attempt $attempt/$max), retrying in ${delay}s — $(cat "$err" "$out" | grep -Eim1 "$TRANSIENT_PATTERN")" >&3
        sleep "$delay"; attempt=$((attempt + 1)); delay=$((delay * 2))
      done
    }

jobs:
  release:
    name: Cut, finalize, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tags, publish the GitHub Release
      issues: write # finalize opens / comments on / closes the "release: vX.Y.Z" tracking issue
      actions: read # read the runs at a commit (ci-green, full-suite, trunk-green)
    # What the npm job below needs (#434, adopted from the template's #433) — empty / publish=false
    # unless this run tagged something AND .github/project.yml declares release.npm.
    outputs:
      tags: ${{ steps.npm-target.outputs.tags }}
      npm: ${{ steps.npm-target.outputs.publish }}
      npm-dir: ${{ steps.npm-target.outputs.dir }}
      npm-gate: ${{ steps.npm-target.outputs.gate }}
      npm-package: ${{ steps.npm-target.outputs.package }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          # Full history plus tags: versions, bumps and "previous final" are all read from
          # git, and the on-trunk check refuses a shallow checkout outright.
          fetch-depth: 0
          # Left on deliberately: `colab release cut` / `finalize` push their tag over the
          # checkout's origin. The token is this job's, scoped by `permissions:` above.
          persist-credentials: true

      # A red CI run on main is not a candidate. Gated here rather than by a job-level `if:` so
      # this run concludes success, never `skipped` (header, point 2).
      - name: Gate on the triggering CI run
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_run" ] && [ "$CONCLUSION" != "success" ]; then
            echo "cut=false" >> "$GITHUB_OUTPUT"
            echo "CI concluded \`$CONCLUSION\` at $HEAD_SHA — nothing to cut." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "cut=true" >> "$GITHUB_OUTPUT"
          fi

      # This checkout's own CLI, at the commit being released (header, point 1).
      - name: Use this checkout's colab CLI
        run: |
          set -euo pipefail
          echo "COLAB=$GITHUB_WORKSPACE/tools/colab" >> "$GITHUB_ENV"
          echo "colab CLI at $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          # The tags are annotated; git needs an identity to write one.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # #443: the scheduled run cuts too — a head held back by a declared candidates-per-day window
      # is tagged once the window ends; a head already carrying a candidate is a no-op.
      - name: Cut a candidate (colab release cut --auto)
        id: cut
        if: steps.gate.outputs.cut == 'true' && (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          set -uo pipefail
          eval "$RETRY_TRANSIENT"
          OUT="$RUNNER_TEMP/cut.json"
          rc=0
          retry_transient node "$COLAB" release cut --auto --json > "$OUT" || rc=$?
          # A verdict is JSON carrying `ok`; anything else is a run that never decided.
          if ! jq -e 'has("ok")' "$OUT" > /dev/null 2>&1; then
            echo "::error::colab release cut produced no verdict (exit $rc)"
            echo "colab release cut produced no verdict (exit $rc) — the reason is in this step's log." >> "$GITHUB_STEP_SUMMARY"
            cat "$OUT"
            exit 1
          fi
          {
            echo "### colab release cut --auto"
            echo
            jq -r '.checks[]? | "- \(if .ok then "✓" else "✗" end) **\(.condition)** — \(.detail)"' "$OUT"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$(jq -r '.created' "$OUT")" = "true" ]; then
            TAG="$(jq -r '.tag' "$OUT")"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Cut $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
            # #446: on route deploy-tag-fast the cut IS the final, and the deploy job deploys it in
            # this run (a tag pushed with GITHUB_TOKEN starts no `push: tags` workflow).
            if [ "$(jq -r '.final // false' "$OUT")" = "true" ]; then
              echo "final=$TAG" >> "$GITHUB_OUTPUT"
              echo "health-url=$(jq -r '.deploy.healthUrl // ""' "$OUT")" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$(jq -r '.noop' "$OUT")" = "true" ]; then
            echo "No-op: nothing owed, head already a candidate, inside a declared cadence window, or main's head is not a promotion." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$(jq -r '.ok' "$OUT")" = "true" ]; then
            echo "Verdict ok but nothing created." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::colab release cut refused: $(jq -r '[.checks[]? | select(.ok | not) | .condition] | join(", ")' "$OUT")"
          fi

      - name: Finalize the newest clean candidate (colab release finalize --auto)
        id: finalize
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -uo pipefail
          eval "$RETRY_TRANSIENT"
          OUT="$RUNNER_TEMP/finalize.json"
          rc=0
          retry_transient node "$COLAB" release finalize --auto --json > "$OUT" || rc=$?
          if ! jq -e 'has("state")' "$OUT" > /dev/null 2>&1; then
            echo "::error::colab release finalize produced no verdict (exit $rc)"
            echo "colab release finalize produced no verdict (exit $rc) — the reason is in this step's log." >> "$GITHUB_STEP_SUMMARY"
            cat "$OUT"
            exit 1
          fi
          STATE="$(jq -r '.state' "$OUT")"
          {
            echo "### colab release finalize --auto — $STATE"
            echo
            jq -r '.checks[]? | "- \(if .ok then "✓" else "✗" end) **\(.condition)** — \(.detail)"' "$OUT"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$(jq -r '.tagged' "$OUT")" = "true" ]; then
            TAG="$(jq -r '.finalTag' "$OUT")"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Finalized $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            case "$STATE" in
              refused|needs-new-candidate|held) echo "::warning::colab release finalize: $STATE" ;;
              *) echo "Finalize: $STATE" ;;
            esac
          fi

      # Whether the npm job publishes what this run tagged — `colab release npm` reads the
      # release: block (one reading, the same as cut/finalize). A CLI older than #433 gives no
      # verdict; that is a warning and no npm publish, never a failed release.
      - name: Read the npm target (colab release npm)
        id: npm-target
        if: steps.cut.outputs.tag != '' || steps.finalize.outputs.tag != ''
        env:
          TAGS: ${{ steps.cut.outputs.tag }} ${{ steps.finalize.outputs.tag }}
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/npm.json"
          node "$COLAB" release npm --json > "$OUT" 2> /dev/null || true
          if ! jq -e 'has("publish")' "$OUT" > /dev/null 2>&1; then
            echo "::warning::colab release npm gave no verdict (a HANDBOOK_REF older than #433?) — nothing is published to npm"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(jq -r '.publish' "$OUT")" != "true" ]; then
            if [ "$(jq -r '.findings | length' "$OUT")" != "0" ]; then
              echo "::warning::not publishing to npm: $(jq -r '.findings | join("; ")' "$OUT")"
            fi
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "publish=true"
            echo "tags=$(echo $TAGS)"
            echo "dir=$(jq -r '.dir' "$OUT")"
            echo "gate=$(jq -r '.gate' "$OUT")"
            echo "package=$(jq -r '.package' "$OUT")"
          } >> "$GITHUB_OUTPUT"

      # Publishes every tag THIS run created. In this run, never via a tag-push workflow:
      # see "PUBLISHING HAPPENS IN THIS RUN" in the header.
      - name: Publish GitHub Release (same run)
        if: steps.cut.outputs.tag != '' || steps.finalize.outputs.tag != ''
        env:
          TAGS: ${{ steps.cut.outputs.tag }} ${{ steps.finalize.outputs.tag }}
        run: |
          set -euo pipefail
          eval "$RETRY_TRANSIENT"
          for TAG in $TAGS; do
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "$TAG already has a Release — skipping"
              continue
            fi
            # Notes since the previous FINAL tag, candidate or final alike — never since an
            # earlier candidate (the same rule as release-tag.yml).
            PREV="$(git describe --tags --abbrev=0 --match 'v*.*.*' --exclude '*-*' "${TAG}^" 2>/dev/null || true)"
            NOTES="$RUNNER_TEMP/notes-$TAG.md"
            if [ -n "$PREV" ]; then
              node "$COLAB" release-notes "${PREV}..${TAG}" --out "$NOTES"
            else
              printf '## %s\n\nFirst release.\n' "$TAG" > "$NOTES"
            fi
            case "$TAG" in
              *-*) KIND=(--prerelease --latest=false) ;;
              *)   KIND=(--latest) ;;
            esac
            # The view above is a check, not a lock: `colab release cut` publishes a candidate's
            # pre-release itself, and the API can still answer 404 for it seconds later (#462 — a
            # trunk went red on exactly that 422). So a create refused because the Release already
            # exists is the skip case too, decided from the create's own answer. That also covers a
            # create the API applied but answered 5xx for: the retry's 422 is that skip (#464).
            ERR="$RUNNER_TEMP/create-$TAG.err"
            if ! retry_transient gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES" --generate-notes "${KIND[@]}" 2> "$ERR"; then
              cat "$ERR" >&2
              if grep -qiE 'already[ _]exists' "$ERR"; then
                echo "$TAG already has a Release (published while this step ran) — skipping"
                continue
              fi
              exit 1
            fi
            echo "Published $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  # ---------------------------------------------------------------------------------------------
  # npm (#433) — publishes what the release job tagged, in this same run. Opt-in: it runs only when
  # .github/project.yml declares release.npm + release.npm-gate on the public-tool route, so a repo
  # without them never gets this job.
  #
  #   candidate vX.Y.Z-rc.N  ->  npm publish --tag next   --provenance
  #   final     vX.Y.Z       ->  npm publish --tag latest --provenance   (latest never moves to an rc)
  #
  # TRUSTED PUBLISHING (OIDC) ONLY. No npm token is stored, read, or offered as a fallback — the
  # job refuses to run with one in its environment. npm ends direct publishing with 2FA-bypass
  # tokens in January 2027; this design never used one. One-time setup on npmjs.com: the package's
  # Settings -> Trusted publishing -> GitHub Actions, this repository, workflow file
  # `release-auto.yml` (the file's name, not its `name:`).
  #
  # GITHUB-HOSTED, ALWAYS. npm trusted publishing does not support self-hosted runners, so this job
  # stays on GitHub-hosted even where `release` above runs self-hosted (free on a public repo — the
  # only kind that publishes here; a private repo is refused outright, #432).
  #
  # IT NEVER MOVES GIT. It checks out the tag, stamps the version from the tag into package.json
  # (the manifest carries none — the tag is the version), runs the gate, publishes. Nothing is
  # committed or pushed. If it fails, the tag stands, `npm-record` writes "tagged, not published"
  # on the Release, and re-running the failed job publishes the existing tag; a version already on
  # npm is skipped, so a re-run never double-publishes.
  npm:
    name: Publish to npm (trusted publishing)
    needs: release
    if: needs.release.outputs.npm == 'true'
    runs-on: ubuntu-latest # NEVER self-hosted: npm trusted publishing does not support it.
    permissions:
      contents: read # check out the tag; read the repository's visibility
      id-token: write # the OIDC token npm exchanges for a one-time publish credential
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAGS: ${{ needs.release.outputs.tags }}
      PKG_DIR: ${{ needs.release.outputs.npm-dir }}
      GATE: ${{ needs.release.outputs.npm-gate }}
      PACKAGE: ${{ needs.release.outputs.npm-package }}
    steps:
      - name: Refuse a private repository, and any npm token
        run: |
          set -uo pipefail
          eval "$RETRY_TRANSIENT"
          # Visibility from the API, never assumed: unknown is refused like private. A transient
          # error on this read is retried (#464) — one 5xx here once turned a trunk red.
          ERR="$RUNNER_TEMP/visibility.err"
          PRIVATE="$(retry_transient gh api "repos/$REPO" --jq '.private' 2> "$ERR")" || PRIVATE=unknown
          if [ "$PRIVATE" != "false" ]; then
            WHY="$(grep -v '^::warning::' "$ERR" 2> /dev/null | tail -n 1)"
            echo "::error::$REPO is private (or its visibility could not be read: $PRIVATE${WHY:+ — $WHY}) — a private repository never publishes to public npm (#432). Remove release.npm, or install from git."
            exit 1
          fi
          if [ -n "${NODE_AUTH_TOKEN:-}${NPM_TOKEN:-}" ]; then
            echo "::error::an npm token is set in this job's environment — this workflow publishes through trusted publishing (OIDC) only and never with a token. Remove it."
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false # nothing here pushes

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22 # >= 22.14 for trusted publishing; matches .nvmrc (the audit flags a different pin). No registry-url: that writes an .npmrc expecting a token

      - name: npm new enough for trusted publishing (>= 11.5.1)
        run: |
          set -euo pipefail
          eval "$RETRY_TRANSIENT"
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"; then
            retry_transient npm install --global npm@11
          fi
          npm --version

      # EDIT: a package that needs a build step builds here, BEFORE the gate — the gate measures
      # what ships, and the publish below runs with --ignore-scripts so nothing changes after it.
      - name: Publish each tag (npm publish --provenance)
        run: |
          set -euo pipefail
          eval "$RETRY_TRANSIENT"
          for TAG in $TAGS; do
            VERSION="${TAG#v}"
            case "$VERSION" in
              *-*) DIST=next ;;
              *)   DIST=latest ;;
            esac
            # A 404 is "not published" and answers at once; a transient error is retried first (#464).
            if retry_transient npm view "$PACKAGE@$VERSION" version > /dev/null 2>&1; then
              echo "$PACKAGE@$VERSION is already on npm — skipping" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            git checkout --quiet --force "refs/tags/$TAG"
            git clean -fdxq
            (cd "$PKG_DIR" && npm pkg set "version=$VERSION")
            sh -c "$GATE"
            # The view above is a check, not a lock: a publish the registry applied but answered 5xx
            # for, or one that landed between the view and here, is refused as a republish — the skip
            # case again, decided from the publish's own answer (#464, the same shape as #462).
            ERR="$RUNNER_TEMP/npm-publish-$VERSION.err"
            if ! (cd "$PKG_DIR" && retry_transient npm publish --tag "$DIST" --provenance --access public --ignore-scripts) 2> "$ERR"; then
              cat "$ERR" >&2
              if grep -qiE 'EPUBLISHCONFLICT|cannot publish over (the )?previously published' "$ERR"; then
                echo "$PACKAGE@$VERSION is already on npm (published while this step ran) — skipping" | tee -a "$GITHUB_STEP_SUMMARY"
                continue
              fi
              exit 1
            fi
            echo "Published $PACKAGE@$VERSION to npm (dist-tag $DIST)" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  # Writes the npm outcome onto each GitHub Release the run published, replacing its own earlier
  # line on a re-run: "published" once it is, "tagged, not published" with the re-run hint until then.
  npm-record:
    name: Record the npm outcome on the Release
    needs: [release, npm]
    if: always() && needs.release.outputs.npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # edit the Release notes
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAGS: ${{ needs.release.outputs.tags }}
      PACKAGE: ${{ needs.release.outputs.npm-package }}
      RESULT: ${{ needs.npm.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Record the npm outcome
        run: |
          set -euo pipefail
          eval "$RETRY_TRANSIENT"
          for TAG in $TAGS; do
            ERR="$RUNNER_TEMP/record-$TAG.err"
            BODY="$(retry_transient gh release view "$TAG" --repo "$REPO" --json body --jq '.body' 2> "$ERR")" || {
              # Only a Release that is not there is nothing to record on; a read that kept failing is a failure.
              if grep -qiE 'release not found|HTTP 404|Not Found' "$ERR"; then
                echo "$TAG has no Release — nothing to record on"
                continue
              fi
              cat "$ERR" >&2
              exit 1
            }
            VERSION="${TAG#v}"
            case "$VERSION" in *-*) DIST=next ;; *) DIST=latest ;; esac
            if [ "$RESULT" = "success" ]; then
              LINE="npm: published \`$PACKAGE@$VERSION\` (dist-tag \`$DIST\`)."
            else
              LINE="**npm: tagged, not published** (\`$PACKAGE@$VERSION\`, job $RESULT). Re-run the failed \`npm\` job of $RUN_URL — it publishes this existing tag; nothing in git moves."
            fi
            NOTES="$RUNNER_TEMP/notes-$TAG.md"
            printf '%s\n' "$BODY" | sed '/^<!-- colab:npm -->$/,/^<!-- \/colab:npm -->$/d' > "$NOTES"
            printf '\n<!-- colab:npm -->\n%s\n<!-- /colab:npm -->\n' "$LINE" >> "$NOTES"
            # Idempotent: the block between the colab:npm markers is replaced, never appended twice.
            retry_transient gh release edit "$TAG" --repo "$REPO" --notes-file "$NOTES" > /dev/null
            echo "$TAG: $LINE" | tee -a "$GITHUB_STEP_SUMMARY"
          done
