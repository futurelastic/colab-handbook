# OpenAI Codex (CLI, IDE extension, desktop app).
# Source for every value below: developers.openai.com/codex/skills, /codex/agent-approvals-security,
# /codex/guides/agents-md and /codex/subagents, read 2026-10-06.
label: OpenAI Codex
skills_dir: ~/.agents/skills
invoke: $<name> (or pick it from /skills)
instructions: AGENTS.md, read natively from the repo root down to the working directory
helper_agents: yes
load_time_injection: no
shell_network: no
verified: no — values from Codex's own docs (2026-10-06), not yet a clean-VM run (#530 oracle)
note: Codex follows symlinked skill folders. It does not merge two skills with the same name; both appear in /skills.
note: Codex picks up new skills automatically; restart it if one does not appear.
caveat: the default workspace-write sandbox has NO network, so gh and git fetch fail. Allow it in ~/.codex/config.toml: [sandbox_workspace_write] network_access = true
caveat: the sandbox writes only inside the workspace; colab keeps state in ~/.colab (COLAB_HOME), so claims and worktrees need that path writable or an approval
