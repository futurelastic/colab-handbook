# Claude Code — the engine the skills were written in.
label: Claude Code
default: yes
skills_dir: ~/.claude/skills
invoke: /<name>
instructions: CLAUDE.md — keep the prose in AGENTS.md and make CLAUDE.md import it with a line reading @AGENTS.md
helper_agents: yes
load_time_injection: yes
shell_network: yes
verified: 2026-10-06 — the handbook's own fleet runs every skill from this folder daily; install behaviour unchanged by #530
note: Skill precedence is enterprise > personal > project, so this user-level install WINS over a repo's own .claude/skills/<name> of the same name. To use a repo's variant, rename it.
note: Start a new session (or run /skills) to see newly linked skills.
