# opencode (opencode.ai) — terminal agent runtime.
# Sources: opencode.ai/docs/skills, /docs/rules, /docs/commands, /docs/agents, read 2026-10-26;
# and a run of opencode 1.18.3 against an isolated HOME (see verified:).
# Skill folders it reads — global: ~/.config/opencode/skills, ~/.claude/skills, ~/.agents/skills;
# project (walking up to the git worktree root): .opencode/skills, .claude/skills, .agents/skills.
# The install uses opencode's own global folder: ~/.agents/skills belongs to Codex, and sharing it
# would make --check report the same links under two agent runtimes.
label: opencode
skills_dir: ~/.config/opencode/skills
invoke: ask for it by name ("use the <name> skill"); the agent loads it with its skill tool, skills are not slash commands
instructions: AGENTS.md, read natively from the working directory up; CLAUDE.md only where no AGENTS.md exists
helper_agents: yes
load_time_injection: no
shell_network: yes
verified: 2026-10-26 — opencode 1.18.3, isolated HOME: ./install.sh --engine opencode, then opencode debug skill lists all nine skills through the symlinks, with OPENCODE_DISABLE_CLAUDE_CODE=1 too; descriptions over 1024 characters still load. helper_agents, shell_network and invoke from the docs only.
note: opencode follows symlinked skill folders. A skill linked for Claude Code too (~/.claude/skills) is listed once, from this folder.
note: opencode lists new skills in a new session; check with: opencode debug skill
caveat: opencode does not run a skill's !`command` lines (it runs them only in custom commands); the agent reads .colab/skills/<name>.md itself when the skill says to
caveat: with OPENCODE_DISABLE_CLAUDE_CODE=1 (or _SKILLS=1) opencode reads no .claude/skills, global or project — only .opencode/skills, .agents/skills and this folder
caveat: the folder follows XDG_CONFIG_HOME: when it is set, opencode reads $XDG_CONFIG_HOME/opencode/skills instead — install there with --skills-dir
