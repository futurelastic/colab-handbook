# Any other engine: you supply its user-level skills folder with --skills-dir <path>,
# or answer "other" at the prompt. The skills are plain SKILL.md folders with name +
# description frontmatter; they call git, gh and colab, nothing engine-specific.
label: another engine (you give the folder)
skills_dir:
invoke: depends on the engine
instructions: AGENTS.md if the engine reads it; otherwise point its own instruction file at AGENTS.md
helper_agents: no
load_time_injection: no
shell_network: unknown
verified: n/a — the folder is yours
note: If the engine cannot run a skill's !`command` lines, the agent reads .colab/skills/<name>.md itself when the skill says to.
note: The skills call gh and git fetch: the agent's shell needs network access.
