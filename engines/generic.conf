# Any other agent runtime: you supply its user-level skills folder with --skills-dir <path>,
# or answer "other" at the prompt. The skills are plain SKILL.md folders with name +
# description frontmatter; they call git, gh and colab, nothing specific to one agent runtime.
label: another agent runtime (you give the folder)
skills_dir:
invoke: depends on the agent runtime
instructions: AGENTS.md if the agent runtime reads it; otherwise point its own instruction file at AGENTS.md
helper_agents: no
load_time_injection: no
shell_network: unknown
verified: n/a — the folder is yours
note: If the agent runtime cannot run a skill's !`command` lines, the agent reads .colab/skills/<name>.md itself when the skill says to.
note: The skills call gh and git fetch: the agent's shell needs network access.
